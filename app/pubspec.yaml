name: manna_hr_app
description: "Manna HRM — punch in, punch out, and the month behind it."
publish_to: 'none'

# The site is the server (CLAUDE.md §1). There is no backend of ours between
# this app and ERPNext, so the version here is only what the store shows.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  # The same three the field-sales app runs on, at the versions already in the
  # bench's pub cache — this app is the second phone client against the same
  # site and a different HTTP stack would be a second set of auth bugs.
  dio: ^5.10.0
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time only, and neither ships in the APK: `tool/make_icon.dart`
  # composites the square launcher sources and flutter_launcher_icons writes
  # them into android/. Listed here because the analyzer reads `tool/` too — an
  # orphaned script there is fifteen errors on a clean checkout.
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.1

flutter:
  uses-material-design: true

  assets:
    - assets/manna_logo.png

# The launcher icon, built by `dart run tool/make_icon.dart` from
# assets/manna_logo.png — see that file for why the lockup cannot be handed to
# the generator directly.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  # Android 8+ crops the foreground to whatever shape the launcher uses, so the
  # logo is drawn smaller and a white plate sits behind it. Orange behind a
  # grey-and-orange wordmark would lose half of it.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
