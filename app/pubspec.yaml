name: manna_hr_app
description: "Manna HR — the phone app for everybody: their own attendance, and HR's side for an HR login."
publish_to: 'none'

# The site is the server (CLAUDE.md §1). There is no backend of ours between
# this app and ERPNext, so the version here is only what the store shows.
version: 2.1.6+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  # The same three the field-sales app runs on, at the versions already in the
  # bench's pub cache — this app is the second phone client against the same
  # site and a different HTTP stack would be a second set of auth bugs.
  dio: ^5.10.0
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  # The punch photo: the front (selfie) camera only, shown live on the Punch
  # screen and taken at the press (asked for 27 November 2026). The phone's own
  # camera app could be switched to the back camera, so it is not used.
  camera: ^0.12.2
  # Where a punch kept with no signal keeps its photo until it is sent — not
  # the cache, which Android empties when storage runs low.
  path_provider: ^2.1.5
  # Which handset a punch came from, for the dashboard's Punch Info column —
  # the make and model and Android version, never an identifier.
  device_info_plus: ^13.3.0
  # The street a punch was made in, by the phone's own keyless geocoder, for
  # the dashboard's Location column — see services/address.dart.
  geocoding: ^5.0.0
  # The map on the Punch screen: OpenStreetMap, as the field-sales and driver
  # apps draw it — no key and nothing to pay. With no signal the tiles already
  # seen are kept on the phone, and the screen says the map needs signal.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time only, and neither ships in the APK: `tool/make_icon.dart`
  # composites the square launcher sources and flutter_launcher_icons writes
  # them into android/. Listed here because the analyzer reads `tool/` too — an
  # orphaned script there is fifteen errors on a clean checkout.
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.1

flutter:
  uses-material-design: true

  assets:
    - assets/manna_logo.png

  # The FlutterFlow design's face (29 October 2026). Bundled rather than
  # fetched: a gate with no signal still has to draw the punch button.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# The launcher icon, built by `dart run tool/make_icon.dart` from
# assets/manna_logo.png — see that file for why the lockup cannot be handed to
# the generator directly.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  # Android 8+ crops the foreground to whatever shape the launcher uses, so the
  # logo is drawn smaller and a white plate sits behind it. Orange behind a
  # grey-and-orange wordmark would lose half of it.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
