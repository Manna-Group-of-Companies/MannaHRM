/* The panel's controls. Generate is the only one that changes what is listed;
   everything else changes what Generate would list, which is why pressing it
   clears the last run rather than quietly leaving a stale report on screen. */
function wireDaily(){
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };
  const f=S.dda;
  const restale=()=>{ f.run=false; f.msg=""; };
  on("#ddastat2","change", e=>{ f.status=e.target.value; restale(); renderBody(); });
  on("#ddaby","change",    e=>{ f.by=e.target.value; restale(); renderBody(); });
  on("#ddaperiod","change",e=>{ f.period=e.target.value; restale(); renderBody(); });
  on("#ddafrom","change",  e=>{ f.from=e.target.value; restale(); renderBody(); });
  on("#ddato","change",    e=>{ f.to=e.target.value; restale(); renderBody(); });
  on("#ddarefresh","click",()=>load());
  on("#ddamore","click",   ()=>{ f.more=!f.more; renderBody(); });
  on("#ddaadd","change",   e=>{ if(e.target.value){ f.layout[e.target.value]=true; renderBody(); } });
  on("#ddastatus","click", e=>{ e.stopPropagation(); f.menu=!f.menu; renderBody(); });
  document.querySelectorAll("[data-ddaoff]").forEach(b=>b.addEventListener("click",()=>{
    f.layout[b.dataset.ddaoff]=false; renderBody();
  }));
  document.querySelectorAll("[data-ddatab]").forEach(b=>b.addEventListener("click",()=>{
    f.tab=b.dataset.ddatab; renderBody();
  }));
  document.querySelectorAll(".ddabar [data-dst]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    f.status=b.dataset.dst; f.menu=false; restale(); renderBody();
  }));
  document.querySelectorAll("[data-ddaemp]").forEach(b=>b.addEventListener("click",()=>{
    f.emp=b.dataset.ddaemp; f.q=""; restale(); renderBody();
  }));
  on("#ddago","click", ()=>{ f.run=true; f.msg=""; renderBody(); });
  on("#ddaxls","click", ()=>{
    if(!f.run){ f.msg="Press Generate first — there is nothing to export until the report has run."; return renderBody(); }
    const {rows}=ddaRows();
    if(!rows.length){ f.msg="Nothing to export."; return renderBody(); }
    const cell=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const csv=[DDA_COLS.map(c=>c[0]).join(",")]
      .concat(rows.map(r=>DDA_COLS.map(c=>cell(c[1](r))).join(","))).join("\r\n");
    const name="daily-detail-"+(f.from||monthStart())+"-to-"+(f.to||monthEnd())+".csv";
    download(name, csv);
    f.msg="Exported "+fmt(rows.length)+" rows to "+name+". Their button writes .xls; this one writes CSV, which every spreadsheet opens and nothing has to be installed to read.";
    renderBody();
  });
  const q=$("#ddaq");
  if(q){
    q.addEventListener("input", ()=>{
      // Typing over a chosen name clears the choice — otherwise the box says
      // one person and the report runs for another.
      f.emp=""; f.q=q.value; S.ddafocus=true; restale(); renderBody();
    });
    if(S.ddafocus){ S.ddafocus=false; q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  }
}

/* Monthly Basic Attendance — the muster grid, one row per person and one
   column per day. Drawn against the live employee list for the current month,
   because the shape is the argument: 160 people by 31 days is close to five
   thousand cells, every one an output of a policy engine that does not exist,
   and every one of them feeding somebody's pay.

   Sunday is the only cell that can be filled today, and it can be filled for
   everybody: week-off is Sunday for 100% of the active workforce, with no
   exceptions (docs/FACTOHR_DATA.md, section 4). */
/* Factor HR's Monthly Basic Attendance Report, criteria panel first (screenshot
   28 Aug 2026): a toolbar of four filters, two tabs, a date range, layout
   options as removable chips, and one checkbox. The grid underneath is still
   ours — that half has never been screenshotted, and this panel says nothing
   about what it looks like. */
const MB_LAYOUT = [["logo","With Logo"], ["shift","Show Shift Code"]];
/* Every status ERPNext's Attendance can hold, in the one or two letters a
   muster grid has room for. Anything unrecognised falls through to its own
   first letter rather than being dropped, because a cell that silently empties
   is a day somebody is not paid for. */
const MB_LETTER = {"Present":"P", "Absent":"A", "Half Day":"HD", "On Leave":"L",
                   "Work From Home":"WFH", "Holiday":"H"};
const MB_PAID = {P:1, HD:0.5, L:1, H:1, WFH:1, WO:1};

function mbDays(from, till){
	const out = [], a = new Date(from+"T00:00:00"), b = new Date(till+"T00:00:00");
	if(isNaN(a) || isNaN(b) || b < a) return out;
	// Capped rather than validated: a year-long range is a mistake, not a
	// request, and 366 columns would hang the browser rather than say so.
	for(const d = new Date(a); d <= b && out.length < 62; d.setDate(d.getDate()+1)) out.push(new Date(d));
	return out;
}

function secMonthlyBasic(){
	const f = S.mb;
	if(!f.from){
		const now = new Date();
		f.from = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
		f.till = ymd(new Date(now.getFullYear(), now.getMonth()+1, 0));
	}
	const days = mbDays(f.from, f.till);
	const people = scoped()
		.filter(e => !f.status || e.status === f.status)
		.filter(e => !f.emp || e.name === f.emp);
	const named = f.emp ? (S.byName[f.emp]||{}).employee_name : "";

	const opt = (v, cur, label) => '<option value="'+esc(v)+'"'+(String(cur)===String(v)?" selected":"")+'>'
		+ esc(label||v)+'</option>';
	const fld = (label, ctl) => '<label class="mbf"><span>'+(label?esc(label):"&nbsp;")+'</span>'+ctl+'</label>';

	/* ---- the toolbar, control for control ---- */
	const bar = '<div class="mbbar">'
		+ fld("Particular Employee",
			'<select id="mbEmp" class="grow"><option value="">every employee</option>'
			+ scoped().slice().sort((a,b)=>(a.employee_name||"").localeCompare(b.employee_name||""))
				.map(p=>opt(p.name, f.emp, p.employee_name+" ("+(p.employee_number||"-")+")")).join("")
			+ '</select>')
		+ fld("Employee Status",
			'<select id="mbStatus">'+["Active","Inactive","Suspended","Left"]
				.map(s=>opt(s, f.status)).join("")
			+ '<option value=""'+(f.status?"":" selected")+'>All</option></select>')
		+ fld("Filter By",
			'<select disabled title="'+esc("Never screenshotted open. In the report toolbar it sits where a grouping normally does — company, department, shift — but nobody has seen the list.")+'"><option>&mdash;</option></select>')
		+ fld("Report Period",
			'<select id="mbPeriod"><option value="datewise">Date Wise</option></select>')
		+ fld("",
			'<span style="display:flex;gap:.35rem">'
			+ '<button class="btn ghost" id="mbCsv" title="'+esc("Factor HR exports this to Excel. A CSV is the same thing without the formatting, and it opens in Excel.")+'">&#8681; Excel</button>'
			+ '<button class="btn ghost" id="mbReload" title="Reload from the site" aria-label="Reload from the site">&#8635;</button>'
			+ '<button class="btn imp" id="mbGen"'+(f.busy?" disabled":"")+'>'
			+ (f.busy?"Reading…":"Generate")+'</button></span>')
		+ '</div>';

	/* ---- the two tabs ---- */
	const tabs = '<div class="tabs" style="margin-bottom:.85rem">'
		+ '<button class="tab" data-mbt="criteria" aria-selected="'+(f.tab!=="advance")+'">Report Criteria</button>'
		+ '<button class="tab" data-mbt="advance" aria-selected="'+(f.tab==="advance")+'">Advance</button>'
		+ '</div>';

	const criteria = f.tab === "advance"
		? '<div class="empty"><b>Never screenshotted</b>The Advance tab is drawn because it is there, and left empty because nobody has opened it. Whatever it holds is one screenshot away.</div>'
		: '<div class="repgrid" style="max-width:760px">'
			+ '<label for="mbFrom">Date Range:</label><span class="ctl">'
				+ '<input type="date" id="mbFrom" value="'+esc(f.from)+'">'
				+ '<span style="color:var(--ink-2)">to</span>'
				+ '<input type="date" id="mbTill" value="'+esc(f.till)+'">'
				+ '<span class="hint">'+(days.length?fmt(days.length)+" days":"the range reads backwards")+'</span></span>'
			+ '<label>Layout Options:</label><span class="ctl"><span class="taglist" style="flex:1 1 auto">'
				+ MB_LAYOUT.filter(o=>f[o[0]]).map(o=>'<span class="t">'+esc(o[1])
					+ '<button data-mbdrop="'+o[0]+'" aria-label="'+esc("Remove "+o[1])+'">&#215;</button></span>').join("")
				+ MB_LAYOUT.filter(o=>!f[o[0]]).map(o=>'<button class="add" data-mbadd="'+o[0]+'">+ '+esc(o[1])+'</button>').join("")
				+ (MB_LAYOUT.every(o=>f[o[0]]) ? "" : "")
				+ '</span></span>'
			+ '<span></span><span class="ctl"><label class="chk"><input type="checkbox" id="mbWo"'
				+ (f.weekoff?" checked":"")+'>Show Day Status on Week Off/Holiday</label>'
				+ '<span class="hint">off: Sunday reads WO. on: Sunday shows whatever the day actually holds.</span></span>'
		+ '</div>';

	/* ---- the grid, still ours ---- */
	const head = '<tr><th>Emp code</th><th>Name</th>'
		+ (f.shift ? '<th>Shift</th>' : "")
		+ days.map(d=>'<th class="d">'+d.getDate()+'<small>'+DAY[d.getDay()].slice(0,2)+'</small></th>').join("")
		+ '<th>Payable</th></tr>';
	const body = people.map(e=>{
		let paid = 0, real = 0;
		const cells = days.map(d=>{
			const wo = d.getDay() === 0;
			const got = S.mbRows[e.name+"|"+ymd(d)];
			const letter = got ? (MB_LETTER[got] || String(got).slice(0,1).toUpperCase())
			                   : (wo && !f.weekoff ? "WO" : "");
			// Only a row that came off the site counts as knowing something.
			// The weekly off is paid, but a month with nothing else in it is
			// not a month with five payable days — it is a month nobody has
			// measured, and this column is the one payroll reads.
			if(got) real++;
			if(letter) paid += (MB_PAID[letter] || 0);
			return '<td class="d '+(letter==="WO"?"wo":(letter?"":"non"))+'">'
				+ (letter || "&middot;")+'</td>';
		}).join("");
		return '<tr><td class="mono">'+esc(e.employee_number||e.name)+'</td>'
			+ '<td>'+esc(e.employee_name||"")+'</td>'
			+ (f.shift ? '<td class="mono muted">'+esc(e.default_shift||"—")+'</td>' : "")
			+ cells
			+ '<td class="pay">'+(real ? (Math.round(paid*2)/2) : "&mdash;")+'</td></tr>';
	}).join("");

	const woDays = days.filter(d=>d.getDay()===0).length;
	return '<div class="legend"><b style="font-family:var(--display)">Monthly Basic Attendance Report</b>'
		+ '<span class="cov '+(f.count?"live":"none")+'">'+(f.count?fmt(f.count)+" rows":"Nothing to fill it with")+'</span>'
		+ '<span>'+(named?'<b>'+esc(named)+'</b>':fmt(people.length)+(people.length===1?' person':' people'))
		+ ' &times; '+fmt(days.length)+' days'
		+ (f.when ? ' &mdash; generated <b>'+esc(f.when)+'</b>' : ' &mdash; not generated yet')
		+ '. '+fmt(people.length*woDays)+' of the cells are the weekly off.</span></div>'

		+ '<div class="repform" style="margin-top:.7rem">'+bar+tabs+criteria
		+ (f.err ? '<div style="margin-top:.8rem">'+gap("The site refused the report: "+esc(f.err))+'</div>' : "")
		+ '</div>'

		+ (f.logo
			? '<div class="legend" style="margin-top:.8rem;justify-content:center">'
			  + '<b style="font-family:var(--display);font-size:1rem">MANNA GROUP</b>'
			  + '<span>Monthly Basic Attendance &mdash; '+esc(dmy(f.from))+' to '+esc(dmy(f.till))
			  + ($("#company")&&$("#company").value?' &mdash; '+esc($("#company").value):"")+'</span></div>'
			: "")

		+ '<div class="legend" style="margin-top:.6rem">'
		+ '<span><b>WO</b> weekly off</span><span><b>P</b> present</span><span><b>A</b> absent</span>'
		+ '<span><b>HD</b> half day</span><span><b>L</b> leave</span>'
		+ '<span class="muted">&middot; nothing generated</span></div>'

		+ (!days.length
			? '<div class="empty" style="margin-top:.7rem"><b>The range reads backwards</b>Date Range ends before it starts.</div>'
			: people.length
			  ? '<div class="scroll" style="margin-top:.7rem"><table class="muster"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
			  : '<div class="empty" style="margin-top:.7rem"><b>Nobody matches</b>No employee is left after these criteria.</div>')

		+ '<div class="cols" style="margin-top:.8rem">'
		+ panel("Every cell but Sunday is empty, and correctly so","none",
				gap("Shifts, then punches, then the policy engine. In that order &mdash; none of the three can be skipped.")
				+ '<div style="margin-top:.7rem">'+note('A cell here is not a fact anybody records; it is the <em>output</em> of measuring a punch against a shift and then against a policy. With Employee Checkin empty there is nothing to compute and nothing honest to show. <b>A grid of zeros would be worse than a grid of dots</b> &mdash; an empty attendance table and an empty factory produce identical numbers.')+'</div>', {ico:"🗓"})
		+ panel("Generate reads the site, and will keep reading it","part",
				note('<b>Generate is not a mock.</b> It asks the site for every <code>Attendance</code> row in the date range and fills the grid from what comes back &mdash; today that is '+fmt(f.count||0)+' rows, because the shift job has never run. The day it runs, this page fills itself with no further work.'), {ico:"⚡"})
		+ panel("Sunday is the one thing we know","live",
				note('Week-off is <b>Sunday for 100% of the active workforce</b>, no exceptions, so one Holiday List rule covers the group and every Sunday column can be filled today. Factor HR&rsquo;s own dashboard showed all 160 people as <em>Not Yet In</em> on Sunday 23 August, because its tile does not net off the weekly off. <code>rules.py</code> treats weekly-off as its own state precisely so that a person nobody expected in is not somebody to chase.'), {ico:"⛅"})
		+ panel("The last column is the whole point","none",
				gap("Payable days &mdash; present, plus paid leave, plus the weekly off, minus whatever the policy deducts.")
				+ '<div style="margin-top:.7rem">'+note('That single number is what payroll reads off this screen, and it is where 1,300 days of Leave Without Pay come from on the leave report. The column adds up what the grid holds; <b>it does not apply a policy, because the policy has not been stated</b>. Any rule that turns an unexplained absence into LWP will be exercised hard, so it has to be written down before it is coded.')+'</div>', {ico:"📐"})
		+ panel("Never write this grid directly","part",
				note('<b>Attendance is generated from Employee Checkin by the shift job.</b> A hand-written row is invisible to the thing that would have created it, and the two disagree the moment anything is reprocessed. A correction on this grid writes the missing <em>punch</em>; the job fills the cell in. Carried in <code>regularization.py</code>.'), {ico:"⚡"})
		+ '</div>';
}

async function mbGenerate(){
	S.mb.busy = true; S.mb.err = ""; renderBody();
	try{
		const rows = await listAll("Attendance", ["name","employee","attendance_date","status"],
			[["attendance_date",">=",S.mb.from], ["attendance_date","<=",S.mb.till]]);
		S.mbRows = {};
		rows.forEach(r=>{ S.mbRows[r.employee+"|"+String(r.attendance_date).slice(0,10)] = r.status; });
		S.mb.count = rows.length;
		S.mb.when = nowStamp();
	}catch(err){ S.mb.err = String(err.message||err); }
	S.mb.busy = false; renderBody();
}

/* The grid as it stands, not the rows behind it: what somebody exports from
   this screen is what they can see on it. */
function mbCsv(){
	const f = S.mb, days = mbDays(f.from, f.till);
	const people = scoped().filter(e=>!f.status||e.status===f.status).filter(e=>!f.emp||e.name===f.emp);
	if(!days.length || !people.length) return;
	const cell = v => { const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
	const cols = ["Emp code","Name"].concat(f.shift?["Shift"]:[], days.map(d=>ymd(d)), ["Payable"]);
	const rows = people.map(e=>{
		let paid = 0, real = 0;
		const cells = days.map(d=>{
			const got = S.mbRows[e.name+"|"+ymd(d)];
			const letter = got ? (MB_LETTER[got] || String(got).slice(0,1).toUpperCase())
			                   : (d.getDay()===0 && !f.weekoff ? "WO" : "");
			if(got) real++;
			if(letter) paid += (MB_PAID[letter]||0);
			return letter;
		});
		return [e.employee_number||e.name, e.employee_name||""]
			.concat(f.shift?[e.default_shift||""]:[], cells, [real?(Math.round(paid*2)/2):""]);
	});
	download("monthly-basic-attendance-"+f.from+"-to-"+f.till+".csv",
		[cols.map(cell).join(",")].concat(rows.map(r=>r.map(cell).join(","))).join("\r\n"));
}

   — Date wise / Month wise, a month and year, Report Type, Employee Status,
   Particular Employee, Filter By, Report Output, two checkboxes, and five
   buttons including Schedule Report.

   **Report Type was left unselected in the screenshot**, so the one thing that
   would say what this menu actually files is still unknown. Ours is filled
   from the statutory forms our own site holds and says so — an invented list
   would be worse than an honest borrowed one. */

const SR_OUTPUTS = ["Excel","PDF","On screen"];
const SR_BY = [["","(none)"],["company","Company"],["department","Department"],
               ["designation","Designation"],["grade","Grade"],["branch","Branch"]];

/* The columns any monthly statutory return needs, and where each one would come
   from here. Nothing on this list is a guess about *their* report — it is what
   our site can and cannot put behind a return, which is the question a
   readiness check exists to answer. */
const SR_COLS = [
  ["Emp code",    "code", e=>e.employee_number||e.name, ""],
  ["Name",        "have", e=>e.employee_name||"", ""],
  ["Date of joining","have", e=>e.date_of_joining||"\u2014", ""],
  ["Company",     "have", e=>e.company||"\u2014", ""],
  ["Department",  "have", e=>tidyDept(e.department), ""],
  ["Status",      "have", e=>e.status||"\u2014", ""],
  ["PF account / UAN","pf", null, "not on this site"],
  ["PAN",         "pan",  null, "PANNOTAVBL for 502 of 504"],
  ["Days paid",   "gap",  null, "0 Attendance rows"],
  ["Gross",       "gap",  null, "payroll not started"],
  ["Employee PF", "gap",  null, "payroll not started"],
  ["Employer PF / ESI","gap", null, "payroll not started"],
];

function srPeriod(){
  const f=S.sr;
  if(f.mode==="date") return (f.from||"\u2014")+" to "+(f.till||"\u2014");
  return CAL_MONTHS[f.month]+" "+f.year;
}

function srRows(){
  const f=S.sr, co=$("#company").value, q=(f.emp||"").toLowerCase().trim();
  return S.employees.filter(e=>{
    if(co && e.company!==co) return false;
    if(f.status && (e.status||"")!==f.status) return false;
    if(q){
      const hay=((e.employee_number||"")+" "+(e.employee_name||"")+" "+e.name).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort((a,b)=>{
    if(f.by){ const d=String(a[f.by]||"\u2014").localeCompare(String(b[f.by]||"\u2014")); if(d) return d; }
    return String(a.employee_name||"").localeCompare(String(b.employee_name||""));
  });
}

/* One extra read, and only when Generate is pressed: whether the two statutory
   identifiers exist on this site at all. Both are tried together and a refusal
   is an answer rather than an error — "the field is not there" is exactly what
   a readiness check wants to know. */
async function srProbe(){
  if(S.srExtraState) return;
  S.srExtraState="loading";
  const rows=await listAll("Employee",["name","provident_fund_account","custom_pan_no"]).catch(()=>null);
  if(rows){
    S.srExtra=Object.fromEntries(rows.map(r=>[r.name,r]));
    S.srExtraState="ok";
  }else{
    S.srExtra=null;
    S.srExtraState="absent";
  }
  renderBody();
}

function srReport(){
  const f=S.sr, rows=srRows();
  if(!rows.length) return '<div class="empty" style="margin-top:.9rem">'
    + '<b>Nobody in scope</b>No employee is left after these filters. Reset Fields puts them back.</div>';

  const cols=SR_COLS.filter(c=>c[1]!=="code" || f.code);
  const pfKnown=S.srExtraState==="ok";
  const value=(c,e)=>{
    if(c[2]) return esc(String(c[2](e)));
    if(c[1]==="pf") return pfKnown
      ? esc(((S.srExtra[e.name]||{}).provident_fund_account)||"\u2014")
      : "\u2014";
    if(c[1]==="pan") return pfKnown
      ? esc(((S.srExtra[e.name]||{}).custom_pan_no)||"\u2014")
      : "\u2014";
    return "\u2014";
  };
  const filled=c=>{
    if(c[2]) return true;
    if((c[1]==="pf"||c[1]==="pan") && pfKnown) return rows.some(e=>{
      const x=S.srExtra[e.name]||{};
      return c[1]==="pf" ? x.provident_fund_account : x.custom_pan_no;
    });
    return false;
  };
  const empty=cols.filter(c=>!filled(c));

  let body="", last=null;
  rows.forEach(e=>{
    if(f.by){
      const k=e[f.by]||"\u2014";
      if(k!==last){ last=k; body+='<tr class="grp"><td colspan="'+cols.length+'">'+esc(k)+'</td></tr>'; }
    }
    body+='<tr>'+cols.map(c=>'<td'+(filled(c)?"":' class="gapcol"')+'>'+value(c,e)+'</td>').join("")+'</tr>';
  });

  return '<div class="legend" style="margin-top:.9rem">'
      + '<b style="font-family:var(--display)">Generated</b>'
      + '<span class="cov '+(empty.length>cols.length/2?"none":"part")+'">'+fmt(rows.length)+' people</span>'
      + '<span>'+esc(srPeriod())+(f.type?', '+esc(f.type):'')+' \u2014 <b>'+(cols.length-empty.length)
      + ' of '+cols.length+' columns</b> can be filled.</span>'
      + '<button class="btn ghost" style="margin-left:auto" data-sb="export">\u2b07 Export CSV</button></div>'
    + '<div style="margin:.6rem 0">'
      + gap('<b>This is not their report.</b> Nobody has opened Report Type, so what Factor HR files from this menu is unknown and is not reproduced here. What is shown instead is the readiness check underneath any monthly return: everybody in scope for '+esc(srPeriod())+', and which of the columns such a return needs our site can actually put behind it. '
        + (empty.length ? 'The '+empty.length+' shaded column'+(empty.length===1?" is":"s are")+' empty for every person: '
            + empty.map(c=>'<code>'+esc(c[0])+'</code>'+(c[3]?' ('+esc(c[3])+')':'')).join(', ')+'.'
            : 'Every column has something behind it.'))
    + '</div>'
    + '<div class="scroll"><table class="sr" style="min-width:'+(140*cols.length)+'px">'
      + (f.hidehdr ? "" : '<thead><tr>'+cols.map(c=>'<th'+(filled(c)?"":' class="gapcol"')+'>'+esc(c[0])+'</th>').join("")+'</tr></thead>')
      + '<tbody>'+body+'</tbody></table></div>'
    + (f.hidehdr ? '<div style="margin-top:.5rem" class="muted">Header hidden, as asked. On their side that is for pasting straight into a form that carries its own headings.</div>' : "");
}

function srExport(){
  const f=S.sr, rows=srRows();
  if(!rows.length){ S.srMsg="Nothing to export \u2014 nobody is in scope."; return; }
  const cols=SR_COLS.filter(c=>c[1]!=="code" || f.code);
  const cell=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const val=(c,e)=>{
    if(c[2]) return c[2](e);
    const x=(S.srExtra||{})[e.name]||{};
    if(c[1]==="pf") return x.provident_fund_account||"";
    if(c[1]==="pan") return x.custom_pan_no||"";
    return "";
  };
  const head=cols.map(c=>c[0].toLowerCase().replace(/[^a-z0-9]+/g,"_"));
  const csv=(f.hidehdr?[]:[head.join(",")])
    .concat(rows.map(e=>cols.map(c=>cell(val(c,e))).join(","))).join("\r\n");
  const name="statutory-"+(f.mode==="month"?f.year+"-"+String(f.month+1).padStart(2,"0"):(f.from||"range"))+".csv";
  download(name, csv);
  S.srMsg="Exported "+fmt(rows.length)+" row"+(rows.length===1?"":"s")+" to "+name
    + ". Written in the browser from what is already loaded \u2014 nothing was sent anywhere.";
}

function srButton(k){
  const f=S.sr;
  if(k==="generate"){
    S.srRun=true; S.srMsg="";
    // The two statutory identifiers are read once, on demand: whether the
    // fields exist at all is the answer this page is really after.
    if(!S.srExtraState) srProbe();
    if(f.output==="Excel"){ srExport(); }
    if(f.output==="PDF"){
      S.srMsg="<b>PDF is not built, and for these forms that is deliberate.</b> Nine of the seventeen formats are government forms whose layout is legally fixed \u2014 reproduce them exactly or not at all. A PDF that is nearly right is worse than none, because somebody will file it.";
    }
    return renderBody();
  }
  if(k==="reset"){
    S.sr={mode:"month", month:new Date().getMonth(), year:new Date().getFullYear(),
          from:"", till:"", type:"", status:"Active", emp:"", by:"", output:"Excel",
          code:false, hidehdr:false, pick:false};
    S.srRun=false; S.srMsg="Fields reset."; return renderBody();
  }
  if(k==="close"){ S.srRun=false; S.srMsg=""; S.subtab="all"; renderSub(); return renderBody(); }
  if(k==="pick"){ f.pick=!f.pick; return renderBody(); }
  if(k==="export"){ srExport(); return renderBody(); }
  if(k==="schedule"){
    S.srMsg="<b>Scheduling exists in ERPNext already</b> \u2014 Frappe's <em>Auto Email Report</em> sends a saved report on a cron to a list of people, which is exactly this button. It needs two things this page does not have: an outgoing mail account on the site, and a write to create the schedule. It is configuration on the bench rather than code, and it is worth knowing that the day somebody asks who receives the PF return each month.";
    return renderBody();
  }
  if(k==="background"){
    S.srMsg="There is no queue behind this page. In ERPNext a long report is enqueued and mailed when it finishes; here it is computed in the browser from records already loaded, so Generate is instant and this button has nothing to hand off to.";
    return renderBody();
  }
}

function wireSR(){
  const c=$("#content");
  c.querySelectorAll("[data-sf]").forEach(el=>{
    const k=el.dataset.sf, typing=el.tagName==="INPUT" && el.type==="text";
    el.addEventListener(typing?"input":"change",()=>{
      const v = el.type==="checkbox" ? el.checked : el.value;
      S.sr[k] = (k==="month"||k==="year") ? Number(v) : v;
      if(k==="hidehdr") S.srMsg = el.checked
        ? "Hide Header drops the column headings from the table and from the export. On their side that is for pasting into a form that carries its own headings \u2014 which is a small confirmation that these reports end up inside somebody else's document."
        : "";
      if(k==="code") S.srMsg="";
      if(typing) S.srFocus='[data-sf="'+k+'"]';
      renderBody();
    });
  });
  c.querySelectorAll("[data-sm]").forEach(el=>el.addEventListener("change",()=>{
    S.sr.mode=el.dataset.sm; S.srMsg=""; renderBody();
  }));
  c.querySelectorAll("[data-sb]").forEach(b=>b.addEventListener("click",()=>srButton(b.dataset.sb)));
  const pick=c.querySelector("#srpicklist");
  if(pick) pick.addEventListener("change",()=>{ S.sr.emp=pick.value; S.sr.pick=false; renderBody(); });

  if(S.srFocus){
    const el=c.querySelector(S.srFocus); S.srFocus="";
    if(el){ el.focus(); if(el.setSelectionRange) el.setSelectionRange(el.value.length,el.value.length); }
  }
}

/* Both punch streams come out of one Factor HR report and differ only in which
   columns are filled — the same single-funnel design as Employee Checkin,
   which is why the mapping is clean. */
const FH_STREAMS = [
  ["Terminal",   "Manna_Rubber_Products", "blank"],
  ["Location",   "blank",                 "a street address"],
  ["Punch Info", "blank",                 "Loc Acc, Device Info, Latitude, Longitude"],
  ["Selfie",     "none",                  "an embedded image per punch"],
];
/* Today's punches, newest last, for whichever company is selected up top.
   Employee Checkin is one table for both streams, which is why this list needs
   no union and no flag: a punch is a punch, and where it came from is a
   column. */
function todaysPunches(){
  const co=$("#company").value;
  return S.checkins
    .filter(c=>!co || (S.byName[c.employee]||{}).company===co)
    .slice().sort((x,y)=>String(x.time).localeCompare(String(y.time)));
}

/* Factor HR's newer report chrome, photographed 28 Aug 2026: the title, a row
   of labelled controls, then REPORT CRITERIA / ADVANCE tabs holding a date
   range, a time window, the selfie switch, layout options and a funnel for
   additional filters.

   Copied control for control, including the four that cannot answer. The date
   range is the one that reaches the site: the dashboard loads today's punches
   on open, and any other day has to be fetched, so Generate is a request and
   the rest of the form is arithmetic on what it returned. */

const IO_PERIODS = ["Date Wise","Employee Wise"];
const IO_BY = [["","(none)"],["company","Company"],["department","Department"],
               ["designation","Designation"],["grade","Grade"],["branch","Branch"]];
const IO_MAXDAYS = 92;

const ioToday = () => new Date().toISOString().slice(0,10);

/* Which stream a punch came from. The trusted device-id prefix is still one of
   the open questions, so this reads the weaker version of the same rule: a
   punch carrying a terminal is from a machine, and one carrying none is not.
   Named `Unknown` rather than `Mobile` on purpose — the strong claim needs the
   prefix, and calling it mobile would geofence it in a reader's head. */
function ioStream(r){ return r.device_id ? "Terminal" : "Unknown"; }

/* Everything the form asks of what came back. The date range was already
   applied by the fetch; these are the filters that do not need the site. */
function ioFiltered(){
  const f=S.io, co=$("#company").value, q=(f.emp||"").toLowerCase().trim();
  return (S.ioRows||[]).filter(r=>{
    const e=S.byName[r.employee]||{};
    if(co && e.company!==co) return false;
    if(f.status && (e.status||"")!==f.status) return false;
    if(f.logtype && (r.log_type||"")!==f.logtype) return false;
    if(f.stream && ioStream(r)!==f.stream) return false;
    const hm=String(r.time||"").slice(11,16);
    if(f.t1 && hm && hm<f.t1) return false;
    if(f.t2 && hm && hm>f.t2) return false;
    if(q){
      const hay=((e.employee_number||"")+" "+(e.employee_name||r.employee_name||"")+" "+r.employee).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort((a,b)=>{
    if(S.io.period==="Employee Wise"){
      const an=(S.byName[a.employee]||{}).employee_name||a.employee;
      const bn=(S.byName[b.employee]||{}).employee_name||b.employee;
      const d=String(an).localeCompare(String(bn)); if(d) return d;
    }
    return String(a.time||"").localeCompare(String(b.time||""));
  });
}

/* The one request this page makes. Both field lists are tried in turn: an
   `Employee Checkin` without `device_id` on it would otherwise take the whole
   report down, and the report is more useful without that column than absent. */
async function ioGenerate(){
  const f=S.io;
  if(!f.from) f.from=ioToday();
  if(!f.till) f.till=ioToday();
  if(f.from>f.till){
    S.ioMsg="The date range ends before it starts."; return renderBody();
  }
  const days=Math.round((new Date(f.till)-new Date(f.from))/86400000)+1;
  if(days>IO_MAXDAYS){
    // The site has a daily compute limit and this is a per-punch table: at 160
    // people a year is on the order of a hundred thousand rows.
    S.ioMsg="That is "+fmt(days)+" days. This report asks the site for every punch in the range, "
      + "so it is capped at "+IO_MAXDAYS+" days \u2014 the site has a daily compute limit and a punch table grows by 320 rows a day once the bridge is running.";
    return renderBody();
  }

  S.ioState="loading"; S.ioMsg=""; renderBody();
  const range=[["time",">=",f.from+" 00:00:00"],["time","<=",f.till+" 23:59:59"]];
  let rows=await listAll("Employee Checkin",
      ["name","employee","employee_name","time","log_type","device_id"], range).catch(()=>null);
  if(rows===null) rows=await listAll("Employee Checkin",
      ["name","employee","time","log_type"], range).catch(e=>({err:String(e.message||e)}));

  if(rows && rows.err){ S.ioState="error"; S.ioMsg=rows.err.slice(0,220); S.ioRows=null; }
  else{ S.ioRows=rows||[]; S.ioState="done"; S.ioRan=f.from+" to "+f.till; }
  renderBody();
}

/* The generated table. Their export carries Terminal, Location, Punch Info and
   a selfie per row; ours carries the two of those four that Employee Checkin

function ioReport(){
  const f=S.io, rows=ioFiltered();
  if(S.ioState==="loading") return '<div class="empty" style="margin-top:.9rem"><b>Reading the site</b>Every punch between '+esc(f.from)+' and '+esc(f.till)+'.</div>';

    + '<b>No punches in that range</b>'

  const key=r=>{
    if(f.by) return (S.byName[r.employee]||{})[f.by]||"\u2014";

function ioExport(){
  const rows=ioFiltered();
  if(!rows.length){ S.ioMsg="Nothing to export \u2014 generate the report first, or widen the filters."; return; }
  const cell=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const cols=["date","time","emp_code","name","log_type","terminal","stream","company"];
  const csv=[cols.join(",")].concat(rows.map(r=>{ const e=S.byName[r.employee]||{};
      return [String(r.time||"").slice(0,10), clock(r.time), e.employee_number||r.employee,
              e.employee_name||r.employee_name||"", r.log_type||"", r.device_id||"",
              ioStream(r), e.company||""].map(cell).join(","); })).join("\r\n");
  const name="in-out-activity-"+(S.io.from||ioToday())+".csv";
  download(name, csv);
  S.ioMsg="Exported "+fmt(rows.length)+" punch"+(rows.length===1?"":"es")+" to "+name
    + ". Written in the browser from what was already read \u2014 nothing was sent anywhere.";
}

/* Every control rebuilds the body, which keeps the form and the table below it

function wireIO(){
  const c=$("#content");
  c.querySelectorAll("[data-if]").forEach(el=>{
    const k=el.dataset.if, typing=el.tagName==="INPUT" && el.type==="text";
    el.addEventListener(typing?"input":"change",()=>{
      S.io[k]= el.type==="checkbox" ? el.checked : el.value;
      if(k==="selfie") S.ioMsg = el.checked
        ? "Nothing in Frappe HR captures a photo on punch, so the column is shown empty rather than dropped. Their export carried 35 images for 34 punches \u2014 the selfie is real, it is stored, and at 160 people it is on the order of 5 MB a day."
        : "";
      if(typing) S.ioFocus='[data-if="'+k+'"]';
      renderBody();
    });
  });
  c.querySelectorAll("[data-iost]").forEach(b=>b.addEventListener("click",()=>{
    S.io.status=b.dataset.iost; S.io.menu=false; renderBody();
  }));
  c.querySelectorAll("[data-iotab]").forEach(b=>b.addEventListener("click",()=>{
    S.io.tab=b.dataset.iotab; renderBody();
  }));
  c.querySelectorAll("[data-ib]").forEach(b=>b.addEventListener("click",()=>ioButton(b.dataset.ib)));

  if(S.ioFocus){
    const el=c.querySelector(S.ioFocus); S.ioFocus="";
    if(el){ el.focus(); if(el.setSelectionRange) el.setSelectionRange(el.value.length,el.value.length); }
  }
}

/* Factor HR's regularization report carries 36 columns and the design is worth
   taking wholesale: the original punch is never overwritten. */
/* Factor HR's Attendance Regularization screen, photographed 28 Aug 2026:
   the title, then one bar — Attendance Cycle, the status dot, Search Employee,
   Select Categories, and four icons: filter, import, refresh, history. Under it,
   nothing at all until somebody is picked:

       No Employee Selected
       Please select employee for show Regularization

   That empty state is the screen's whole model, so it is copied word for word,
   their grammar included. **This queue is one person at a time.** Ours on
   Dashboard → Approvals is everybody's corrections in one list, which is the
   better screen for an approver working a backlog — but theirs is the one HR
   uses to answer "what happened to my 19th of August", and the two are worth
   seeing side by side rather than one replacing the other quietly. */

const FH_REG_COLS = [
  ["Original In",   r=>"—",                          "the punch, which this request does not carry"],
  ["Original Out",  r=>"—",                          "same"],
  ["AR In",         r=>tOf(r.requested_in),          ""],
  ["AR Out",        r=>tOf(r.requested_out),         ""],
  ["AR Hours",      r=>spanOf(r.requested_in,r.requested_out)||"—", "computed, not stored"],
  ["Day Status",    r=>"—",                          "an output of the attendance policy engine"],
  ["Reason",        r=>r.reason||"—",                ""],
  ["Remarks",       r=>r.remarks||r.decision_note||"—", ""],
  ["Initiated By",  r=>r.owner||"—",                 ""],
  ["Current Status",r=>r.status||"—",                ""],
  ["Last Action By",r=>r.decided_by||r.modified_by||"—", ""],
  ["Last Action On",r=>dmyTime(r.decided_on||r.modified||r.creation), ""],
];
const tOf = v => v ? String(v).slice(11,16) || String(v).slice(0,5) : "—";

/* Their cycle picker reads "Aug-2026". Thirteen months ending one ahead of
   today, which is as far as a correction can be raised for. */
function regCycles(){
  const out=[], now=new Date();
  for(let i=11;i>=-1;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push([d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),
              MON[d.getMonth()]+"-"+d.getFullYear()]);
  }
  return out;
}
const regCycle = () => S.reg.cycle || new Date().toISOString().slice(0,7);

/* The same coloured dot as Employee Master, because it is the same control on
   their screen — Active, InActive, All, in that order (FACTOHR_SCREENS §11).
   Its own selection, though: a filter set on one screen is not a filter set on
   another, and sharing them would silently hide people here. */
function regDot(){
  const opts=[["Active","on","Active"],["Inactive","off","InActive"],["","all","All"]];
  const cur=opts.find(o=>o[0]===S.reg.status)||opts[2];
  return '<span class="empdrop">'
    + '<button class="embtn" id="regstatus" aria-haspopup="listbox" aria-label="Filter by status"'
      + ' aria-expanded="'+(S.reg.menu?"true":"false")+'" title="'+esc("Status: "+cur[2])+'">'
      + '<i class="sdot '+cur[1]+'"></i><b class="cx">&#9662;</b></button>'
    + '<div class="emmenu" role="listbox" aria-label="Status"'+(S.reg.menu?"":" hidden")+'>'
    + opts.map(o=>'<button role="option" data-rst="'+esc(o[0])+'" aria-selected="'+(o[0]===S.reg.status)+'">'
        + '<i class="sdot '+o[1]+'"></i>'+esc(o[2])+'</button>').join("")
    + '</div></span>';
}

/* Who the search box can offer. Scoped by company like the rest of the page,
   then by the dot and the category box — which is what those two controls are
   for on their screen as well. */
function regMatches(){
  const q=(S.reg.q||"").trim().toLowerCase();
  let rows=scoped();
  if(S.reg.status) rows=rows.filter(e=>e.status===S.reg.status);
  if(S.reg.cat)    rows=rows.filter(e=>e.department===S.reg.cat);
  if(!q) return {rows:[], all:rows.length};
  return {rows:rows.filter(e=>[e.employee_number,e.employee_name,e.designation]
      .some(v=>(v||"").toLowerCase().includes(q))).slice(0,8), all:rows.length};
}

function regBar(){
  const cyc=regCycle();
  const depts=[...new Set(scoped().map(e=>e.department).filter(Boolean))].sort();
  const icon=(id,path,label,title,dead)=>'<button class="embtn ic" '+(dead?"disabled ":"id=\""+id+"\" ")
    + 'title="'+esc(title)+'" aria-label="'+esc(label)+'">'
    + '<svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg></button>';

  return '<div class="embar regbar">'
    + '<label class="cyc" title="Factor HR calls the month an attendance cycle. Ours is the calendar month until somebody says the payroll month runs to a different day.">'
      + '<svg viewBox="0 0 24 24" width="15" height="15" stroke="var(--ink-3)" fill="none" stroke-width="1.7"><path d="M3 5h18v16H3zM3 9h18M8 3v4M16 3v4"/></svg>'
      + 'Attendance Cycle : <select id="regcyc">'
      + regCycles().map(c=>'<option value="'+c[0]+'"'+(c[0]===cyc?" selected":"")+'>'+c[1]+'</option>').join("")
      + '</select></label>'
    + regDot()
    + '<span class="find rev">'
      + '<input type="search" id="regq" placeholder="Search Employee" aria-label="Search employee" value="'+esc(S.reg.q||"")+'">'
      + '<svg viewBox="0 0 24 24" width="15" height="15" stroke="var(--ink-3)" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></span>'
    + '<select id="regcat" title="Factor HR&rsquo;s Categories is a master of masters — eight category types, three of them ours. Department is the one both systems hold, so it is what this box can offer.">'
      + '<option value="">Select Categories</option>'
      + depts.map(d=>'<option value="'+esc(d)+'"'+(d===S.reg.cat?" selected":"")+'>'+esc(tidyDept(d))+'</option>').join("")
      + '</select>'
    + '<span class="regicons">'
      + icon("", "M3 5h18l-7 8v6l-4 2v-8Z", "Filter",
             "Factor HR's filter panel on this screen has never been opened. The two controls it would hold are already on the bar.", true)
      + icon("", "M12 16V4M7 9l5-5 5 5M4 20h16", "Import",
             "This writes attendance from a spreadsheet — no shift check, no geofence, no approver. Drawn because it exists over there, refused because it is the most dangerous button in any HR system.", true)
      + icon("regrefresh", "M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4", "Refresh", "Reload the queue from the site", false)
      + icon("", "M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 8v4l3 2", "History",
             "Only open requests are read — see pendingRegularizations(). A decided correction is history and this page has never asked for it.", true)
    + '</span></div>';
}

function secRegularization(){
  const pend=(S.approvals.attendance||[]).length;
  const emp=S.reg.emp ? S.byName[S.reg.emp] : null;
  const {rows:matches, all}=regMatches();
  const cyc=regCycle();

  let screen = '<div class="fhtitle">Attendance Regularization</div>' + regBar();

  // The picker Factor HR opens under its search box. Ours says how many people
  // it is searching, because the dot and the category box can empty it and a
  // search that finds nobody should say which filter did it.
  if(!emp && (S.reg.q||"").trim())
    screen += matches.length
      ? '<div class="regfind">'+matches.map(e=>'<button data-regemp="'+esc(e.name)+'">'
          + '<i class="sdot '+(e.status==="Active"?"on":"off")+'"></i>'
          + '<b>'+esc(e.employee_name)+'</b><span class="mono">'+esc(e.employee_number||"—")+'</span>'
          + '<span class="muted">'+esc(tidyDept(e.department))+'</span></button>').join("")+'</div>'
      : '<div class="regfind"><span class="none">Nobody matches, out of '+fmt(all)+' searched'
        + (S.reg.status?' · status '+esc(S.reg.status):"")
        + (S.reg.cat?' · '+esc(tidyDept(S.reg.cat)):"")+'</span></div>';

  if(!emp){
    // Their words, their grammar. It is the screen.
    screen += '<div class="regnone"><b>No Employee Selected</b>'
      + '<span>Please select employee for show Regularization</span></div>';
  }else{
    const mine=(S.approvals.attendance||[])
      .filter(r=>r.employee===emp.name && String(r.attendance_date||"").slice(0,7)===cyc)
      .sort((a,b)=>String(a.attendance_date).localeCompare(String(b.attendance_date)));
    screen += '<div class="regwho"><i class="sdot '+(emp.status==="Active"?"on":"off")+'"></i>'
      + '<b>'+esc(emp.employee_name)+'</b><span class="mono">'+esc(emp.employee_number||"—")+'</span>'
      + '<span class="muted">'+esc(tidyDept(emp.department))+' · '+esc(emp.company)+'</span>'
      + '<span class="n">'+fmt(mine.length)+' in '+esc(MON[+cyc.slice(5,7)-1]+"-"+cyc.slice(0,4))+'</span>'
      + '<button class="embtn" id="regclear">Clear</button></div>';
    screen += mine.length
      ? '<div class="scroll"><table style="min-width:1180px"><thead><tr><th>Date</th><th>Day</th>'
        + FH_REG_COLS.map(c=>'<th>'+c[0]+'</th>').join("")+'</tr></thead><tbody>'
        + mine.map(r=>'<tr><td class="mono">'+esc(dmy(r.attendance_date))+'</td>'
            + '<td class="muted">'+esc(dayOf(String(r.attendance_date).slice(0,10)))+'</td>'
            + FH_REG_COLS.map(c=>'<td'+(/In$|Out$|Hours$|On$/.test(c[0])?' class="mono"':"")+'>'
                + esc(String(c[1](r)))+'</td>').join("")
            + '</tr>').join("")
        + '</tbody></table></div>'
      : '<div class="empty"><b>No corrections for '+esc(emp.employee_name)+' in '
        + esc(MON[+cyc.slice(5,7)-1]+"-"+cyc.slice(0,4))+'</b>'
        + 'Only <em>open</em> requests are read, so a correction already decided will not appear here — which is what the History icon is for, and it has never been asked for.</div>';
  }

  return '<div class="legend"><b style="font-family:var(--display)">Attendance Regularization</b>'
    + '<span class="cov '+(pend?"live":"part")+'">'+(pend?fmt(pend)+" pending":"queue live, empty")+'</span>'
    + '<span>Factor HR&rsquo;s screen, and it is <b>one person at a time</b>. The same requests are worked as a backlog on <b>Dashboard &rarr; Approvals</b>, where the card carries the shift and the hours.</span></div>'

  + '<div class="fhscreen">'+screen+'</div>'

  + '<div class="cols" style="margin-top:1rem">'
  + panel("Their twelve columns, and the four we cannot fill","part",
      '<div class="rows">'
      + FH_REG_COLS.map(c=>'<div class="row"><span class="mono">'+esc(c[0])+'</span>'
          + '<span class="val muted">'+(c[2]?esc(c[2]):"held")+'</span></div>').join("")
      + '</div>'
      + '<div style="margin-top:.7rem">'+note('<b>Original In and Original Out are the gap.</b> Their row shows the punch beside the correction, so an approver reads both without leaving the screen. Ours holds the request only — the punch is on <code>Employee Checkin</code> and nothing joins them yet. <b>Day Status and AR Hours</b> are outputs of the attendance policy engine, which is the one part of Factor HR that Frappe HR has no equivalent for.')+'</div>', {ico:"✎"})
  + panel("Corrections write a punch, never Attendance","part",
      note('Carried into <code>regularization.py</code>. <b>Attendance is generated from Employee Checkin by the shift job</b>; a hand-written row is invisible to the thing that would have created it, and the two disagree the moment anything is reprocessed. So a correction writes the missing <em>punch</em> and lets the job do the rest.'), {ico:"⚡"})
  + panel("Breaks are tracked, and were not in the plan","none",
      gap("Break handling — <code>Break Out</code> / <code>Break In</code> and their AR equivalents, plus an Exemption Type.")
      + '<div style="margin-top:.7rem">'+note('<b>Two kinds of break, counted differently.</b> <code>Personal Break Duration</code> appears as its own column on the daily report, separate from <code>Break Duration</code>. Nothing in the current design accounts for either, and they affect worked hours, which affects pay.')+'</div>', {ico:"☕"})
  + panel("Per-row durations","part",
      note('Each row also carries <code>Overtime Duration</code>, <code>Late Coming Duration</code> and <code>Early Going Duration</code>. These are outputs of the attendance policy engine — the one part of Factor HR that Frappe HR has no equivalent for.'), {ico:"⏳"})
  + '</div>';
}

/* The bar's controls. Bound only when the regularization screen is what just
   rendered — nothing else on Attendance has any of them. */
function wireRegularization(){
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };
  on("#regcyc","change", e=>{ S.reg.cycle=e.target.value; renderBody(); });
  on("#regcat","change", e=>{ S.reg.cat=e.target.value; renderBody(); });
  on("#regrefresh","click", ()=>load());
  on("#regclear","click", ()=>{ S.reg.emp=""; S.reg.q=""; renderBody(); });
  on("#regstatus","click", e=>{
    // Out of the document handler's way, which would otherwise close the menu
    // in the same click that opened it.
    e.stopPropagation();
    S.reg.menu=!S.reg.menu; renderBody();
  });
  document.querySelectorAll(".regbar [data-rst]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    S.reg.status=b.dataset.rst; S.reg.menu=false; renderBody();
  }));
  document.querySelectorAll("[data-regemp]").forEach(b=>b.addEventListener("click",()=>{
    S.reg.emp=b.dataset.regemp; S.reg.q=""; renderBody();
  }));
  const q=$("#regq");
  if(q){
    q.addEventListener("input", ()=>{ S.reg.q=q.value; S.regfocus=true; renderBody(); });
    if(S.regfocus){ S.regfocus=false; q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  }
}

/* Factor HR's second-level menus, under the module each belongs to, in its
   order. Only pages the tenant has actually been seen to have are listed:
   Loans and Survey are absent because nobody has captured their sub-menu yet,
   and an invented menu is worse than a missing one.

   Employees is Factor HR's seven, in its order, and then Reporting lines,
   which Factor HR has no equivalent for. It earns the exception: a blank
   Reporting Manager is a correction request with nowhere to go, and there is
   nowhere else on the menu that says so. Biometric enrolment and Companies used
   to sit beside it and were taken off — what they found is written down in
   docs/DEVICES.md and docs/FACTOHR_DATA.md, and a menu that mirrors another
   system stops being a comparison once it accumulates pages that system has
   never had. */
const SUBTABS = {
  dashboard: [["overview","Start up"],["engagement","Engagement"],["approvals","Approvals"]],
  onboard:   [["candidates","Candidate Master"],["overview","Create Letter / Form"],
              ["documents","Document Entry"],["assets","Assets Details"],
              ["assignment","Assets Assignment"],["all","All"]],
  employees: [["overview","Employee Master"],["salary","Salary Master"],["detail","Employee Detail"],
              ["ctc","CTC / Earnings"],["categories","Categories"],["calendar","Calendar"],["all","All"],
              ["reporting","Reporting lines"]],
  /* Factor HR's own Attendance menu, captured 28 Aug 2026, item for item and
     in its order. `overview` is Attendance Regularization because that is the
     first item on their menu and the one page here with a live queue behind
     it — so clicking Attendance in the nav lands on it. */
  attendance:[["overview","Attendance Regularization"],["submit","Submit Attendance"],
              ["inout","In Out Activities Report"],["daily","Daily Detail Attendance Report"],
              ["monthly","Monthly Basic Attendance"],["statutory","Statutory Reports"],
              ["shifts","Manage Shift"],["all","All"]],
  leave:     [["overview","Leave"],["balances","Balances"],["reports","Reports"]],
  payroll:   [["overview","Payroll Summary"],["fnf","Full &amp; Final"],["reports","Reports"]],
  settings:  [["overview","Setup readiness"],["coverage","Module coverage"]],
};

function renderSub(){
  const tabs = SUBTABS[S.section];
  $("#subbar").innerHTML = tabs ? tabs.map(t =>
    '<button class="subtab" data-s="'+t[0]+'" aria-selected="'+(S.subtab===t[0])+'">'+t[1]+'</button>').join("") : "";
  $("#subbar").querySelectorAll(".subtab").forEach(b=>b.addEventListener("click",()=>{
    S.subtab=b.dataset.s; renderSub(); renderBody();
  }));
}

/* One entry per page. Nested by module so the dispatch reads in the same shape
   as SUBTABS above and the two cannot drift apart unnoticed — a subtab with no
   page here falls back to the module's overview rather than blanking. */
const PAGES = {
  dashboard: {overview:secDashboard, engagement:secEngagement, approvals:secApprovals},
  // `overview` is Create Letter / Form rather than the first tab: clicking On
  // Board resets to it, and landing on the one page with real work on it beats

  onboard:   {overview:secLetterForm, candidates:secCandidates, documents:secDocuments,

function renderBody(){
  // On Board's extra reads are half a dozen requests against a site with a
  // daily compute limit, so they are made the first time somebody opens the
  // module and not once per page load. The flag is set before the call, so the
  // re-render it triggers cannot ask again.
  if(S.section==="onboard" && !S.onboardRead){ S.onboardRead=true; loadOnBoard(); }

  const c=$("#content");
  const mod=PAGES[S.section]||PAGES.dashboard;
  c.innerHTML = (mod[S.subtab]||mod.overview)();

  // Only the letter page has controls to bind, and binding them against a
  // different page's markup would throw before the rest of the body renders.
  if(S.section==="onboard" && (mod[S.subtab]||mod.overview)===secLetterForm) wireLetterForm();
  if(S.section==="employees") wireEmployees();
  if($("#mbGen")) wireMonthly();
  if(S.section==="employees" && S.subtab==="calendar") wireCalendar();
  if(S.section==="attendance" && (mod[S.subtab]||mod.overview)===secRegularization) wireRegularization();
  if(S.section==="attendance" && (mod[S.subtab]||mod.overview)===secDailyDetail) wireDaily();

  // The report form is bound wherever it appears rather than by section, so
  // the page it sits on can move without the controls going dead.
  if(c.querySelector("#ctcform")) wireCTC();
  if(c.querySelector("#ioform")) wireIO();
  if(c.querySelector("#srform")) wireSR();

  // The All page lists the module's own menu, so a line on it is a way in.
  c.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>{
    S.subtab=b.dataset.goto; renderSub(); renderBody();
  }));

  const at=$("#apptabs");
  if(at){
    at.querySelectorAll(".tab[data-t]").forEach(b=>b.addEventListener("click",()=>{
      // A selection made on one queue means nothing on the next one.
      S.apptab=b.dataset.t; S.appsel.clear();
      S.appmsg=""; S.appq=""; S.othf={}; S.othmsg="";
      renderBody();
    }));
    wireQueue();
  }
}

/* Both halves are optional: the picker exists only on Employee Detail and the
   rows only on the master list, so each is bound if it is there. */
function wireEmployees(){
	const pick = $("#edPick");
	if(pick){
		// Re-render before fetching: a person whose record is already cached
		// would otherwise stay on the previous one, because a cached read
		// returns without redrawing anything.
		pick.addEventListener("change", ()=>{
			S.empSel = pick.value; renderBody(); loadEmployeeDoc(S.empSel);
		});
		loadEmployeeDoc(S.empSel);
	}

	// The master toolbar. Every control is optional — the detail page has no
	// toolbar and the list view has no cards — so each is bound only if the
	// render that just ran put it there.
	const on = (id, ev, fn) => { const el = $(id); if(el) el.addEventListener(ev, fn); };

	// One search behind two boxes: the toolbar's input writes through to the
	// topbar's, so a filter typed in either is the same filter and the two
	// cannot disagree. Rebuilding the body on each keystroke loses the cursor,
	// hence the flag — the same trick the approvals queue uses.
	const q = $("#emq");
	if(q){
		q.addEventListener("input", ()=>{ $("#q").value = q.value; S.empfocus = true; renderBody(); });
		if(S.empfocus){ S.empfocus = false; q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
	}
	on("#emstatus", "click", e=>{
		// Kept out of the document handler below, which would otherwise close
		// the menu in the same click that opened it.
		e.stopPropagation();
		S.empmenu = !S.empmenu;
		const m = document.querySelector(".emmenu");
		if(m) m.hidden = !S.empmenu;
		e.currentTarget.setAttribute("aria-expanded", S.empmenu ? "true" : "false");
	});
	document.querySelectorAll(".emmenu [data-st]").forEach(b=>b.addEventListener("click", e=>{
		e.stopPropagation();
		S.empstatus = b.dataset.st; S.empmenu = false; renderBody();
	}));
	// Category Type's View Category buttons. Clicking the open one closes it,
	// so the row is a toggle rather than a trap on a page with no back button.
	document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click", ()=>{
		S.catopen = (S.catopen === b.dataset.cat) ? "" : b.dataset.cat; renderBody();
	}));
	on("#emdept",   "change", e=>{ S.empdept   = e.target.value; renderBody(); });
	on("#emdesig",  "change", e=>{ S.empdesig  = e.target.value; renderBody(); });
	on("#emdev",    "change", e=>{ S.empdev    = e.target.value; renderBody(); });
	on("#emfilter", "click",  ()=>{ S.empfilters = !S.empfilters; renderBody(); });

	// The report criteria deliberately do not re-render as they are filled in:
	// nothing on the page depends on a half-typed date, and rebuilding the body
	// on every keystroke is how a date input loses the cursor mid-year. The
	// tick boxes and chips update their own appearance for the same reason.
	const keep = (id, k) => { const el = $(id); if(el) el.addEventListener("change", ()=>{ S[k] = el.value; }); };
	keep("#edJoinA","edJoinA"); keep("#edJoinB","edJoinB");
	keep("#edSepA","edSepA");   keep("#edSepB","edSepB");
	keep("#edDobA","edDobA");   keep("#edDobB","edDobB");
	keep("#edAgeA","edAgeA");   keep("#edAgeB","edAgeB");
	keep("#edAgeOn","edAgeOn"); keep("#edMgr","edMgr");
	document.querySelectorAll("input[data-st]").forEach(c=>c.addEventListener("change", ()=>{
		const s = c.dataset.st;
		S.edStatus = c.checked ? S.edStatus.concat([s]) : S.edStatus.filter(x=>x!==s);
	}));
	document.querySelectorAll(".repchecks input[data-sec]").forEach(b=>b.addEventListener("change", ()=>{
		const k = b.dataset.sec, was = S.edSections.includes(k);
		S.edSections = was ? S.edSections.filter(x=>x!==k) : S.edSections.concat([k]);
	}));
	on("#edGen",  "click", ()=>edGenerate());
	on("#edCsv",  "click", ()=>edCsv());
	on("#edClose","click", ()=>{ S.edReport=null; S.edMsg=""; S.edBad=false; renderBody(); });
	on("#edReset","click", ()=>{
		S.edStatus = ED_STATUSES.slice(); S.edSections = ["category"];
		S.edJoinA = S.edJoinB = S.edSepA = S.edSepB = "";
		S.edDobA = S.edDobB = S.edAgeA = S.edAgeB = "";
		S.edAgeOn = new Date().toISOString().slice(0,10);
		S.edMgr = ""; S.empSel = ""; S.edReport = null; S.edMsg = ""; S.edBad = false;
		renderBody();
	});
	on("#emrefresh","click",  ()=>load());
	document.querySelectorAll(".emview .embtn").forEach(b=>b.addEventListener("click", ()=>{
		S.empview = b.dataset.v; renderBody();
	}));

	const open = el => { S.empSel = el.dataset.emp; S.subtab = "detail"; renderSub(); renderBody(); };
	document.querySelectorAll("[data-emp]").forEach(el=>{
		el.addEventListener("click", ()=>open(el));
		// A card is a div, so it has to be given the keyboard behaviour a link
		// would have had for free.
		el.addEventListener("keydown", ev=>{
			if(ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); open(el); }
		});
	});
}
async function loadEmployeeDoc(name){
	// Cached rather than re-read: the body is rebuilt on every keystroke in the
	// search box, and a fetch per keypress would be one per keypress.
	if(!name || S.empDoc[name]) return;
	const out = $("#edOut");
	if(out) out.innerHTML = '<div class="empty">reading the record…</div>';
	try{ S.empDoc[name] = (await api("/api/resource/Employee/"+encodeURIComponent(name))).data; }
	// The failure is kept on the record rather than thrown, so the page says
	// which person it could not read instead of blanking.
	catch(err){ S.empDoc[name] = {__err:String(err.message||err)}; }
	if(S.section==="employees" && S.subtab==="detail") renderBody();
}

function closeDialog(){ S.appdialog=""; S.dlgmsg=""; renderBody(); }

/* The five buttons across the top of the Other grid. All five do their job;
   what Save can reach depends on whether there is a document behind the row and
   whether the proxy has been started with writes on. */
function otherButton(k){
  if(k==="refresh"){ S.othmsg=""; return load(); }
  if(k==="export"){ S.othmsg=qExport(); return renderBody(); }
  if(k==="bulk"){ S.appdialog="bulk"; S.dlgmsg=""; S.dlgfocus=true; return renderBody(); }
  if(k==="log"){ S.appdialog="log"; S.dlgmsg=""; S.dlgfocus=true; return renderBody(); }
  if(k==="save") return saveApprovals();
}

const nowStamp = () => new Date().toISOString().slice(0,16).replace("T"," ");
/* No login of its own: the page talks to the site with one API token, so every
   decision made here lands as that token's user. Recorded as such rather than
   dressed up as the person at the keyboard. */
const DECIDER = "dashboard token";

function rowById(t,id){ return (S.approvals[t.k]||[]).find(r=>reqId(r)===id); }

async function apiWrite(dt,name,patch){
  try{
    const r=await fetch("/api/resource/"+encodeURIComponent(dt)+"/"+encodeURIComponent(name),
      {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(patch)});
    const j=await r.json().catch(()=>({}));
    return r.ok ? {ok:true} : {ok:false, error:(j.hint||j.error||("HTTP "+r.status)), status:r.status};
  }catch(e){ return {ok:false, error:String(e.message||e)}; }
}

/* Save Approval Changes. Every staged row is attempted against the site; a row
   with no doctype behind it — the Other queue's, today — is applied to the
   screen and reported as exactly that.

   The grid is updated either way, so what is on screen and what was staged
   never disagree, and a reload afterwards is what proves which of the two
   actually happened. */
async function saveApprovals(){
  const t=APPROVALS.find(x=>x.k===S.apptab)||APPROVALS[0];
  const staged=Object.keys(S.othact).filter(id=>S.othact[id]);
  if(!staged.length){
    S.othmsg="Nothing staged. Set Your Action on a row, or use Bulk Approval, then Save.";
    return renderBody();
  }
  const dt=t.doctype||(t.k==="attendance"?S.regDoctype:null);
  S.othmsg="Saving "+staged.length+"…"; renderBody();

  let wrote=0, onscreen=0; const failed=[];
  for(const id of staged){
    const r=rowById(t,id), action=S.othact[id];
    const status=action==="Approve" ? "Approved" : "Rejected";
    let persisted=false, err="no document behind this queue yet";

    if(dt && r && r.name){
      const res=await apiWrite(dt, r.name, {status:status});
      persisted=res.ok; err=res.ok?"":res.error;
    }
    if(r){ r.status=status; r.decided_on=nowStamp(); r.decided_by=DECIDER; }
    logDecision({ref:(r&&r.name)||id, employee:(r&&r.employee)||"", action:action,
                 status:status, persisted:persisted, note:err, queue:t.l});
    if(persisted) wrote++; else { onscreen++; if(err && !failed.includes(err)) failed.push(err); }
  }
  S.othact={}; S.appsel.clear();

  S.othmsg = (wrote?wrote+" written to the site. ":"")
    + (onscreen?onscreen+" applied on this screen only — nothing was written, and a refresh will undo it"
        +(failed.length?" ("+failed[0]+")":"")+". ":"")
    + "Every one is in the Approval Activities Log.";
  // The site is the authority on what a write actually did — an approval that
  // fires the hook can change more than the field that was sent.
  if(wrote) return load();
  renderBody();
}

function logDecision(e){
  S.othlog.unshift(Object.assign({at:nowStamp(), by:DECIDER}, e));
  if(S.othlog.length>200) S.othlog.length=200;
}

/* The approval toolbar and the per-row controls. Every one of these rebuilds
   the body, which is cheap at this size and keeps the selected count, the
   checkboxes and the "N of M shown" line from ever disagreeing. */
function wireQueue(){
  const c=$("#content");
  const on=(sel,ev,fn)=>{ const el=c.querySelector(sel); if(el) el.addEventListener(ev,fn); };

  const qs=c.querySelector("#qsearch");
  if(qs){
    qs.addEventListener("input",()=>{ S.appq=qs.value; S.appfocus=true; renderBody(); });
    // Rebuilding the body drops focus mid-word, so it is put back where it was.
    if(S.appfocus){ S.appfocus=false; qs.focus(); qs.setSelectionRange(qs.value.length,qs.value.length); }
  }
  on("#qscope","change",e=>{ S.appscope=e.target.value; renderBody(); });
  on("#qgroup","change",e=>{ S.appgroup=e.target.value; renderBody(); });
  on("#qrefresh","click",()=>{ S.appmsg=""; load(); });
  on("#qall","change",e=>{
    // Select-all covers what is shown, never the rows a search has hidden.
    if(e.target.checked) S.appshown.forEach(id=>S.appsel.add(id));
    else S.appshown.forEach(id=>S.appsel.delete(id));
    renderBody();
  });
  on("#qbulk","change",e=>{
    const v=e.target.value, n=S.appsel.size;
    // Of Factor HR's two bulk actions, one reads and one writes. The one that
    // reads is done here and now; the one that writes says why it cannot be.
    if(v==="decide") S.appmsg=(n||"No")+" request"+(n===1?"":"s")+" selected. "+READ_ONLY;
    if(v==="data"){ S.appdialog="data"; S.dlgmsg=""; S.dlgfocus=true; }
    renderBody();
  });
  on("#dlgexport","click",()=>{ S.dlgmsg=qExport(); renderBody(); });
  on("#dlgtemplate","click",()=>{ S.dlgmsg=qTemplate(); renderBody(); });
  on("#dlgimport","click",()=>{ S.dlgmsg="Import is not built. "+READ_ONLY
    +" Importing attendance from a spreadsheet is also the one action here that can pay somebody the wrong amount silently, so it wants a server rule in front of it, not a file picker."; renderBody(); });
  on("#logexport","click",()=>{
    if(!S.othlog.length){ S.dlgmsg="Nothing to export yet."; return renderBody(); }
    const cols=["at","by","queue","ref","employee","action","status","persisted","note"];
    const cell=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    download("approval-log-"+new Date().toISOString().slice(0,10)+".csv",
      [cols.join(",")].concat(S.othlog.map(e=>cols.map(c=>cell(e[c])).join(","))).join("\r\n"));
    S.dlgmsg="Exported "+S.othlog.length+" log line"+(S.othlog.length===1?"":"s")+".";
    renderBody();
  });
  on("#logclear","click",()=>{ S.othlog=[]; S.dlgmsg="Log cleared."; renderBody(); });
  c.querySelectorAll("[data-bulkact]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.bulkact;
    if(!S.appsel.size){ S.dlgmsg="Nothing selected."; return renderBody(); }
    S.appsel.forEach(id=>{ if(v) S.othact[id]=v; else delete S.othact[id]; });
    S.dlgmsg=S.appsel.size+" row"+(S.appsel.size===1?"":"s")+(v?" marked "+v+". Save Approval Changes decides them.":" cleared.");
    renderBody();
  }));
  on("#dlgclose","click",closeDialog);
  on("#dlgx","click",closeDialog);
  // Clicking the backdrop closes; clicking inside the box must not.
  on("#dlg","click",e=>{ if(e.target.id==="dlg") closeDialog(); });
  c.querySelectorAll("[data-sel]").forEach(b=>b.addEventListener("change",()=>{
    const id=b.dataset.sel;
    if(b.checked) S.appsel.add(id); else S.appsel.delete(id);
    renderBody();
  }));
  // Focus moves into the dialog when it opens, and only then — re-focusing on
  // every re-render would drag it off whatever button was just pressed.
  if(S.dlgfocus){ const first=c.querySelector("#dlg .acts button"); if(first){ S.dlgfocus=false; first.focus(); } }

  /* ---- the Other grid ---- */
  on("#othtype","change",e=>{ S.othtype=e.target.value; renderBody(); });
  on("#othperiod","change",e=>{ S.appscope=e.target.value; renderBody(); });
  on("#othall","change",e=>{
    if(e.target.checked) S.appshown.forEach(id=>S.appsel.add(id));
    else S.appshown.forEach(id=>S.appsel.delete(id));
    renderBody();
  });
  c.querySelectorAll("[data-of]").forEach(b=>b.addEventListener("input",()=>{
    S.othf[b.dataset.of]=b.value; S.refocus='[data-of="'+b.dataset.of+'"]'; renderBody();
  }));
  c.querySelectorAll("[data-oact]").forEach(b=>b.addEventListener("change",()=>{
    // Staged, not applied — which is Factor HR's model too. Save is the write.
    S.othact[b.dataset.oact]=b.value; S.othmsg=""; renderBody();
  }));
  c.querySelectorAll("[data-ob]").forEach(b=>b.addEventListener("click",()=>{ otherButton(b.dataset.ob); }));

  if(S.refocus){
    const el=c.querySelector(S.refocus); S.refocus="";
    if(el){ el.focus(); if(el.setSelectionRange) el.setSelectionRange(el.value.length,el.value.length); }
  }

  c.querySelectorAll("[data-decide]").forEach(b=>b.addEventListener("click",()=>{
    S.appmsg="Cannot "+b.dataset.decide+" "+b.dataset.req+" from here. "+READ_ONLY;
    renderBody();
  }));
}

const EMP_FIELDS_MIN = ["name","employee_name","employee_number","company","department","designation",

const EMP_FIELDS = EMP_FIELDS_MIN.concat(["salutation","grade","branch","employment_type","holiday_list","ctc"]);

/* Holiday dates come one document at a time: the list endpoint returns names,
   and the dates are a child table. Fetched after the first paint so a slow
   holiday list never holds up the page, and each one guarded on its own so a
   list that cannot be read leaves the others readable. */
async function loadHolidayDates(){
	for(const h of (S.holidayLists||[])){
		const doc = await api("/api/resource/Holiday List/"+encodeURIComponent(h.name))
			.then(r=>r.data).catch(()=>null);

async function load(){
  $("#dot").className="dot"; $("#conn").textContent="loading…";
  try{
    const today=new Date().toISOString().slice(0,10);
    const [emps,companies,checkins,shifts,holidays,leavetypes,attendance,depts,desigs,regs,leaves,
           ltypes,letters]=await Promise.all([
      // Categories, CTC and Calendar each count a field the directory never
      // needed. Asking for a field a site does not have is a 417 on the whole
      // call, and the whole call is the dashboard — so the richer list is tried
      // and the original one is what it falls back to.
      listAll("Employee", EMP_FIELDS).catch(()=>listAll("Employee", EMP_FIELDS_MIN)),
      // `default_holiday_list` is what the Calendar screen's "Default Calendar"
      // tick reads. Asked for with the same fallback as the employee list: a
      // field a site does not have is a 417 on the whole call.
      listAll("Company",["name","abbr","default_holiday_list"])
        .catch(()=>listAll("Company",["name","abbr"])),
      listAll("Employee Checkin",["name","employee","time","log_type"],[["time",">=",today+" 00:00:00"]]),
      listAll("Shift Type",["name"]), listAll("Holiday List",["name"]),
      listAll("Leave Type",["name"]), listAll("Attendance",["name"]),
      listAll("Department",["name"]), listAll("Designation",["name"]),
      pendingRegularizations(),
      listAll("Leave Application",
        ["name","employee","employee_name","company","leave_type","from_date","to_date","half_day",
         "half_day_date","total_leave_days","leave_balance","leave_approver","leave_approver_name",
         "posting_date","status","description","creation","owner","modified","modified_by"],
        [["status","=","Open"]]).catch(()=>[]),
      // Order here must match the destructuring above, position for position.
      // These two were missing while the variables existed, so `ltypes` was
      // undefined and the On Board panels rendered empty with no error.
      listAll("Letter Type",["name","category","is_active","fields_used"]).catch(()=>[]),
      listAll("Employee Letter",
        ["name","employee","employee_name","letter_type","letter_date"]).catch(()=>[]),
    ]);
    S.employees=emps; S.byName=Object.fromEntries(emps.map(e=>[e.name,e])); S.checkins=checkins;
    // The five queues with no doctype behind them stay empty rather than
    // absent — see NO_APPROVALS. Their tabs are field lists, not backlogs.
    S.approvals=Object.assign(NO_APPROVALS(),{attendance:regs||[],leave:leaves||[]});
    S.letterTypes=(ltypes||[]).filter(t=>t.is_active!==0);
    S.letters=letters||[];
    S.companies=companies||[];
    S.holidayLists=holidays||[];
    S.counts={companies:companies.length,shift:shifts.length,holiday:holidays.length,
              leavetype:leavetypes.length,attendance:attendance.length,
              departments:depts.length,designations:desigs.length,left:344};

    const sel=$("#company"), cur=sel.value;
    sel.innerHTML='<option value="">All companies</option>'
      + companies.map(c=>'<option'+(c.name===cur?" selected":"")+'>'+esc(c.name)+'</option>').join("");
    $("#dot").className="dot live"; $("#conn").textContent="live";
    renderAll();
    loadHolidayDates();
  }catch(err){
    $("#dot").className="dot bad"; $("#conn").textContent=String(err.message||err).slice(0,80);
  }
}
/* On Board's own reads, and they are allowed to fail. Three of these four
   calls are onto doctypes nobody has confirmed holds anything, and a module
   still being compared must not be able to blank the page everybody opens — so
   this runs after the dashboard has rendered, catches everything, and records
   *why* it came back empty.

   "The field is not on this site" and "the request was refused" are different
   findings, and only the first is about the data. Each read therefore tries a
   full field list, falls back to the fields ERPNext ships, and remembers which
   of the two answered. */
async function loadOnBoard(){
  S.assetErr=""; S.docErr=""; S.onboardBusy=true;
  if(S.section==="onboard") renderBody();
  const EMP_STD=["name","employee_name","employee_number","company","status",
                 "passport_number","valid_upto","date_of_issue","place_of_issue"];
  const EMP_FULL=EMP_STD.concat(DOC_BACKFILL.map(f=>f[0]));

  const docs=await listAll("Employee", EMP_FULL).catch(()=>null);
  if(docs){ S.docs=docs; S.docTier="full"; S.docErr=""; }
  else{
    // The seven custom fields were added on 25 Aug. If they are absent the
    // coverage panel quotes the export instead, and says so on the page.
    await listAll("Employee", EMP_STD)
      .then(r=>{ S.docs=r; S.docTier="standard"; S.docErr=""; })
      .catch(e=>{ S.docs=[]; S.docTier=""; S.docErr=String(e.message||e).slice(0,160); });
  }

  const AST_FULL=["name","asset_name","item_code","asset_category","company","status",
                  "location","custodian","department","purchase_date","gross_purchase_amount"];
  const AST_STD=["name","asset_name","asset_category","company","status"];
  const assets=await listAll("Asset", AST_FULL).catch(()=>null);
  if(assets){ S.assets=assets; S.assetErr=""; }
  else{
    await listAll("Asset", AST_STD)
      .then(r=>{ S.assets=r; S.assetErr=""; })
      .catch(e=>{ S.assets=[]; S.assetErr=String(e.message||e).slice(0,160); });
  }
  S.assetMoves=await listAll("Asset Movement",
    ["name","purpose","transaction_date","company"]).catch(()=>[]);
  S.onboardBusy=false;

  // Only redraw what the reader is looking at. Repainting the dashboard here
  // would throw away a search or a selection somebody is mid-way through.
  if(S.section==="onboard") renderBody();
}

$("#company").addEventListener("change",()=>{ $("#cotitle").textContent=($("#company").value||"MANNA GROUP").toUpperCase(); renderBody(); });
$("#q").addEventListener("input",()=>{ if(S.section==="employees") renderBody(); });
// Bound once, on the document, rather than per render — a listener added on
// every rebuild would fire as many times as the page has been redrawn.
/* Both status dots — Employee Master's and the regularization screen's. They
   are the same control on their side and they close the same way on ours. */
function closeStatusMenu(){
	S.empmenu = false; S.reg.menu = false; S.dda.menu = false;
	document.querySelectorAll(".emmenu").forEach(m=>{ m.hidden = true; });
	document.querySelectorAll("#emstatus,#regstatus,#ddastatus").forEach(b=>b.setAttribute("aria-expanded","false"));
}
document.addEventListener("keydown",e=>{
	if(e.key !== "Escape") return;
	if(S.appdialog) return closeDialog();
	if(S.empmenu || S.reg.menu || S.dda.menu) closeStatusMenu();
});
// Also bound once on the document rather than per render: a menu that closes
// only when you click it a second time is a menu people leave open.
document.addEventListener("click",e=>{
	if((S.empmenu || S.reg.menu || S.dda.menu) && !e.target.closest(".empdrop")) closeStatusMenu();
});
renderNav(); load();
</script>
