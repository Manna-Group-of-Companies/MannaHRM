const DIALOGS = {data:dataDialog, bulk:bulkDialog, log:logDialog};

/* The header row an import would have to match, in the doctype's own
   fieldnames — not the page's labels, which would import as nothing. */
function qTemplate(){
  const t=APPROVALS.find(x=>x.k===S.apptab)||APPROVALS[0];
  if(!t.tpl) return "No importable doctype behind the "+t.l+" queue yet, so there is nothing to template.";
  download("template-"+t.k+".csv", t.tpl.join(",")+"\r\n");
  return "Template for "+t.src+" — "+t.tpl.length+" columns, header row only. "
    + "Deliberately no example row: a template that imports cleanly by accident is a hazard.";
}

function download(name, text){
  const a=document.createElement("a");
  // The BOM is for Excel, which otherwise reads a UTF-8 CSV as Latin-1 and
  // turns every name with an accent in it into mojibake.
  a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* Export is one of the two halves that only reads — so it works here, in the
   browser, with nothing sent anywhere.

   What it writes out is exactly what the site returned, field for field, with
   nothing computed added. An export that carried this page's own arithmetic
   would be a second opinion masquerading as a record; a reconciliation against
   ERPNext has to be able to disagree with us. */
function qExport(){
  const t=APPROVALS.find(x=>x.k===S.apptab)||APPROVALS[0];
  // The grid filters per column, so what it shows is not what qFilter alone
  // would return — an export that ignored that would not be what is on screen.
  const all=t.view==="grid" ? otherRows(t) : qFilter(S.approvals[t.k]||[]);
  const rows=S.appsel.size ? all.filter(r=>S.appsel.has(reqId(r))) : all;
  if(!rows.length) return "Nothing to export — this queue is empty.";

  const cols=[]; rows.forEach(r=>Object.keys(r).forEach(k=>{ if(!cols.includes(k)) cols.push(k); }));
  const cell=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>cell(r[c])).join(","))).join("\r\n");
  const name="approvals-"+t.k+"-"+new Date().toISOString().slice(0,10)+".csv";

  download(name, csv);
  return "Exported "+rows.length+" row"+(rows.length===1?"":"s")+" to "+name
    + (S.appsel.size?" — the selection only.":" — everything shown.");
}

/* Sort newest first, search across everything a person would type, then cut to
   the chosen window. Search is deliberately wide — an approver looking for
   "47299" and one looking for "Ekka" are the same search box. */
function qFilter(rows){
  const q=S.appq.trim().toLowerCase();
  let out=rows.slice().sort((a,b)=>String(b.creation||"").localeCompare(String(a.creation||"")));
  if(q) out=out.filter(r=>{
    const e=S.byName[r.employee]||{};
    return [e.employee_name,e.employee_number,e.company,r.employee_name,r.name,r.reason,r.remarks,
            r.status,r.attendance_date,r.from_date,r.to_date,r.leave_type,r.correction_for]
      .some(v=>String(v==null?"":v).toLowerCase().includes(q));
  });
  // "Last 20 Activities" counts rows; "Last 31 Days" counts days. Both windows
  // are cut from when the request was raised, never from the date it is about —
  // a correction filed today for a day in June is recent work, not old work.
  const w=String(S.appscope||"");
  if(w.startsWith("n:")) return out.slice(0, Number(w.slice(2)));
  if(w.startsWith("d:")){
    const since=isoAgo(Number(w.slice(2)));
    return out.filter(r=>String(r.applied_on||r.posting_date||r.creation||"").slice(0,10) >= since);
  }
  return out;
}

const reqId = r => r.name || (r.employee+"|"+(r.attendance_date||r.from_date||""));

function qGroupKey(r,t){
  if(S.appgroup==="type") return t.kind||t.l;
  if(S.appgroup==="manager") return (S.byName[r.employee]||{}).reports_to || "";
  return r.employee||"—";
}
function qGroupHead(key, rows, t){
  const waiting='<span class="code">'+rows.length+' waiting</span>';
  if(S.appgroup==="type")
    return '<b>'+esc(t.kind||t.l)+'</b><span class="code">'+esc(t.src)+'</span>'+waiting;
  if(S.appgroup==="manager"){
    const m=S.byName[key];
    // No reporting line is not a tidy edge case: it is a request nobody owns,
    // and grouping is where that becomes visible instead of staying buried.
    return key ? '<b>'+esc(m?m.employee_name:key)+'</b>'
                 +'<span class="code">'+esc((m&&m.employee_number)||key)+'</span>'
                 +'<span class="code">reporting manager</span>'+waiting
               : '<b>No reporting manager</b><span class="code">nobody owns these</span>'+waiting;
  }
  const e=S.byName[key]||{}, first=rows[0];
  return '<b>'+esc(e.employee_name||first.employee_name||key)+'</b>'
    +'<span class="code">'+esc(e.employee_number||key)+'</span>'
    +'<span class="code">'+esc(e.company||first.company||"")+'</span>';
}

function secApprovals(){
  const A=S.approvals;
  const t=APPROVALS.find(x=>x.k===S.apptab)||APPROVALS[0];

  let html='<div class="tabs" id="apptabs">'+APPROVALS.map(x=>{
    const n=(A[x.k]||[]).length;
    return '<button class="tab" data-t="'+x.k+'" aria-selected="'+(S.apptab===x.k)+'">'+esc(x.l)
      +' <span class="n '+(n?"hot":"")+'">'+n+'</span></button>';
  }).join("")+'</div>';

  // The Other queue is Factor HR's grid screen, toolbar and all, so it replaces
  // the card toolbar rather than sitting under it.
  if(t.view==="grid"){
    html += secOtherGrid(t);
    if(DIALOGS[S.appdialog]) html += DIALOGS[S.appdialog](t);
    return html + reqSpec(t);
  }

  const rows=A[t.k]||[], shown=qFilter(rows);
  S.appshown=shown.map(reqId);          // what select-all covers, and only that
  html += qToolbar(rows.length, shown);

  if(!shown.length){
    html += '<div class="empty"><b>Nothing waiting</b>'
      + (rows.length ? "Nothing matches “"+esc(S.appq)+"”. "+rows.length+" waiting in all." : t.empty)
      + '</div>';
  } else {
    /* Grouped the way the toolbar says. Employee Wise is Factor HR's default
       and the one that matches how approving actually happens — an approver
       decides about a person, not about a row. Reporting Manager Wise is the
       one that matters most here: it is the queue an approver actually owns. */
    const groups=new Map();
    shown.forEach(r=>{
      const k=qGroupKey(r,t);
      if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r);
    });
    html += [...groups.entries()].map(g=>
      '<div class="person"><div class="who">'+qGroupHead(g[0],g[1],t)+'</div>'
      + g[1].map(r=>(t.row||plainRow)(r,t)).join("")+'</div>').join("");
  }

  if(DIALOGS[S.appdialog]) html += DIALOGS[S.appdialog](t);

  html += reqSpec(t);
  html += note('These are Factor HR\'s own queues, in its order. <b>Leave and Attendance are read from the site; the other five are field lists awaiting your call</b> — Factor HR holds nothing in any of them either, so this is a decision about what to build rather than a backlog to clear.');
  return html;
}

/* ---------------------------------------------------------------------------
   Factor HR's Other queue, which is a different screen from the card queues:
   a grid with a filter box under every heading, an activity-type filter that
   lets one grid serve several kinds of request — Nominee in the screenshot —
   and a "Your Action" per row that is staged rather than applied. Nothing is
   decided until Save Approval Changes, which is a good model and the reason
   the button exists at all.
   --------------------------------------------------------------------------- */
const OTHER_BUTTONS=[
  ["save","Save Approval Changes","&#128190;"],
  ["refresh","Refresh Approval Activities","&#8635;"],
  ["log","Approval Activities Log","&#128220;"],
  ["bulk","Bulk Approval","&#9745;"],
  ["export","Export","&#8681;"],
];
/* Only one activity type has ever been seen on this screen. The rest of the
   list is a screenshot away and is not invented here. */
const OTHER_TYPES=[["","All activity types"],["Nominee","Nominee"]];
const OTHER_COLS=[
  ["ref","Reference No.", r=>r.name||""],
  ["date","Date", r=>dmy(r.date||r.attendance_date||r.creation)],
  ["employee","Employee", r=>{ const e=S.byName[r.employee]||{};
      return (e.employee_name||r.employee_name||r.employee||"")
        + (e.employee_number?" ("+e.employee_number+")":""); }],
  ["description","Description", r=>r.description||r.reason||""],
  ["remarks","Remarks", r=>r.remarks||""],
  ["status","Current Status", r=>r.status||""],
  ["action","Your Action", null],       // a staged decision, not a value
  ["lastby","Last Action By", r=>r.decided_by||r.modified_by||r.owner||""],
];

function otherRows(t){
  const all=(S.approvals[t.k]||[]).filter(r=>!S.othtype || (r.activity_type||"")===S.othtype);
  return qFilter(all).filter(r=>OTHER_COLS.every(c=>{
    const q=(S.othf[c[0]]||"").trim().toLowerCase();
    if(!q) return true;
    const v = c[0]==="action" ? (S.othact[reqId(r)]||"") : c[2](r);
    return String(v).toLowerCase().includes(q);
  }));
}

function secOtherGrid(t){
  const rows=otherRows(t);
  S.appshown=rows.map(reqId);
  const opt=(list,cur)=>list.map(o=>'<option value="'+esc(o[0])+'"'
    +(String(o[0])===String(cur)?" selected":"")+'>'+esc(o[1])+'</option>').join("");

  let html='<div class="gbar">'+OTHER_BUTTONS.map(b=>
      '<button class="gbtn" data-ob="'+b[0]+'">'+b[2]+' '+esc(b[1])+'</button>').join("")+'</div>'
    + '<div class="gfil">'
    + '<label>Filter Activity Type: <select id="othtype">'+opt(OTHER_TYPES,S.othtype)+'</select></label>'
    + '<label>Filter By Period: <select id="othperiod">'+opt(QSCOPES,S.appscope)+'</select></label>'
    + '<span class="muted" style="margin-left:auto;font-family:var(--mono);font-size:.74rem">'
    + rows.length+' shown'+(S.appsel.size?' · '+S.appsel.size+' selected':'')+'</span></div>'
    + (S.othmsg?note(esc(S.othmsg)):"");

  const allOn = rows.length>0 && rows.every(r=>S.appsel.has(reqId(r)));
  html += '<div class="scroll"><table class="grid"><thead>'
    + '<tr><th><input type="checkbox" id="othall" aria-label="Select everything shown"'
      +(allOn?" checked":"")+'></th>'
    + OTHER_COLS.map(c=>'<th>'+esc(c[1])+'</th>').join("")+'</tr>'
    + '<tr class="fil"><th></th>'
    + OTHER_COLS.map(c=>'<th><input data-of="'+c[0]+'" value="'+esc(S.othf[c[0]]||"")
        +'" aria-label="Filter '+esc(c[1])+'"></th>').join("")+'</tr></thead><tbody>'
    + rows.map(r=>{
        const id=reqId(r);
        return '<tr><td>'+pick(r)+'</td>'
          + OTHER_COLS.map(c=> c[0]==="action"
              ? '<td><select data-oact="'+esc(id)+'">'
                + ['','Approve','Reject'].map(v=>'<option value="'+v+'"'
                    +((S.othact[id]||"")===v?" selected":"")+'>'+(v||"—")+'</option>').join("")
                + '</select></td>'
              : '<td'+(c[0]==="description"?' class="desc"':'')+'>'+esc(c[2](r))+'</td>').join("")
          + '</tr>';
      }).join("")
    + '</tbody></table></div>'
    // Factor HR's own wording, and it is better than "no results": it says
    // whose queue is empty, not that nothing exists.
    + (rows.length?"":'<div class="nopend">No pending at your end</div>');

  return html;
}

/* The field list is the deliverable on a page that is not built, so it is
   rendered the same way everywhere — the approval queues, and the four On Board
   pages that have nothing behind them. A field that is live on one screen and
   missing on another should be visible as exactly that.

   The first two columns are HTML rather than escaped: these are hand-written
   lists in this file, and several of them need an arrow or a <code> span. */
function specTable(cols,list){
  return '<div class="scroll"><table style="min-width:820px"><thead><tr>'
    + cols.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>'
    + list.map(f=>'<tr><td>'+f[0]+'</td>'
        + '<td class="muted" style="white-space:normal">'+f[1]+'</td>'
        // A typo in a state key would otherwise take the whole page down with it.
        + '<td><span class="cov '+(FSTATE[f[2]]||FSTATE.build)[0]+'">'+(FSTATE[f[2]]||FSTATE.build)[1]+'</span></td>'
        + '<td class="muted" style="white-space:normal;min-width:280px">'+(f[3]||"")+'</td></tr>').join("")
    + '</tbody></table></div>';
}

function reqSpec(t){
  const table=specTable;

  let out='<div style="margin-top:1rem">'+panel(t.l+" — what a request carries", t.cov,
      table(["Field","Type","State","Note"], t.fields)
      + '<div style="margin-top:.7rem">'+note('Source: <code>'+esc(t.src)+'</code>. '+t.maps)+'</div>',
      {ico:t.ico})+'</div>';
  if(t.tools) out+='<div style="margin-top:1rem">'+panel(t.l+" — what the queue does","part",
      table(["Control","Where it sits","State","Note"], t.tools)
      + '<div style="margin-top:.7rem">'+note(
          (t.view==="grid" ? 'This queue has its own toolbar, as it does in Factor HR. '
                           : 'The toolbar is shared by every tab, so this list holds for all seven. ')
          + READ_ONLY)+'</div>',
      {ico:"🧰"})+'</div>';
  if(t.extra) out+='<div style="margin-top:1rem">'+panel(t.extra.title,"none",
      table(["Request","What it would carry","State","Note"], t.extra.rows)
      + '<div style="margin-top:.7rem">'+note(t.extra.note)+'</div>', {ico:t.extra.ico||"❓"})+'</div>';
  return out;
}

/* A queue with rows but no renderer of its own. None of the five unbuilt ones
   can produce rows today, but a queue that silently renders nothing when data
   finally arrives is the failure that goes unnoticed longest. */
function plainRow(r,t){
  return reqHead(r,(t&&t.kind)||"Request")
    +'<div class="reqx">'+pick(r)+'<div class="day"><b>'+String(r.creation||"").slice(0,10)+'</b></div>'
    +'<div class="ask">'+esc(r.name||"")+'</div><div></div><div></div>'+decide(r)+'</div>';
}

/* The grey strip Factor HR puts above every card: what kind of request it is,
   its document number, and who touched it last. The approver quotes the DocNo
   on the phone, so it is not decoration. */
function reqHead(r,kind){
  const by=r.decided_by||r.modified_by||r.owner, on=r.decided_on||r.modified||r.creation;
  return '<div class="reqhead"><span class="kind">'+esc(kind)+'</span><span class="meta">'
    + 'DocNo : '+esc(r.name||"—")+', Status : '+esc(r.status||"—")
    + ', Last Action On : '+(on?esc(dmyTime(on)):'<span class="muted">—</span>')
    + ', Last Action By : '+(by?esc(by):'<span class="muted">—</span>')+'</span></div>';
}
const pick = r => '<input type="checkbox" data-sel="'+esc(reqId(r))+'" aria-label="Select this request"'
  + (S.appsel.has(reqId(r))?" checked":"")+'>';

/* Approve and reject are drawn exactly where Factor HR draws them and do not
   act. A tick that silently does nothing would be worse than no tick at all,
   so pressing one says why — deciding a correction writes Employee Checkin
   rows, and that has to happen on the server, not in a page anybody can open. */
function decide(r){
  return '<div class="act"><div class="yn">'
    + '<button class="ok" data-decide="approve" data-req="'+esc(reqId(r))+'" title="'+esc(READ_ONLY)+'">&#10003;</button>'
    + '<button class="no" data-decide="reject" data-req="'+esc(reqId(r))+'" title="'+esc(READ_ONLY)+'">&#10005;</button>'
    + '</div><span class="link" title="Every field on the request, and its decision trail. Not built.">View Details</span></div>';
}

/* Hours, worded as Factor HR words them — "11 hrs 18 minutes", not 11.3. */
function hrsMin(ms){
  if(ms==null || !isFinite(ms) || ms<0) return null;
  const m=Math.round(ms/60000);
  return Math.floor(m/60)+" hrs "+(m%60)+" minutes";
}
const spanOf = (a,b) => (a&&b) ? hrsMin(new Date(String(b).replace(" ","T")) - new Date(String(a).replace(" ","T"))) : null;

/* What the employee is actually asking for. Factor HR carries this as its own
   field — "Overtime marking" in the 24 Aug screenshot — and until the doctype
   has one it is inferred from which punch is missing. Inference is shown as
   inference: the label says "inferred" rather than pretending to be the field. */
function correctionFor(r){
  if(r.correction_for) return [esc(r.correction_for), ""];
  if(r.requested_in && r.requested_out) return ["Both punches", " <span class=\"muted\">(inferred)</span>"];
  if(r.requested_out) return ["Missed punch-out", " <span class=\"muted\">(inferred)</span>"];
  if(r.requested_in) return ["Missed punch-in", " <span class=\"muted\">(inferred)</span>"];
  return ["Not stated",""];
}

function attRow(r,e,kind){
  const shift = e.default_shift || null;
  const planned = "—";                    // the shift window; no Shift Type has times yet
  const worked = spanOf(r.requested_in, r.requested_out);
  const cf = correctionFor(r);
  return reqHead(r,kind||"Time Correction")
    + '<div class="reqx">'+pick(r)
    + '<div class="day"><b>'+dmy(r.attendance_date)+'</b><span>'+dayOf(r.attendance_date)+'</span>'
      + '<span class="applied">Applied On : '+dmy(r.applied_on||r.creation)+'</span></div>'
    + '<div><div class="pa"><span class="h"></span><span class="h">Planned</span><span class="h">Attended</span>'
      + '<span class="lab">In</span><span>'+planned+'</span><span class="att">'+clock(r.requested_in)+'</span>'
      + '<span class="lab">Out</span><span>'+planned+'</span><span class="att">'+clock(r.requested_out)+'</span></div>'
      + '<div class="shift">'+esc(r.company||e.company||"")
      + (shift?'-'+esc(shift):' <span class="muted">— no shift set</span>')+'</div></div>'
    + '<div class="hrs">Working: <b>'+(worked||"—")+'</b><br>'
      + 'Overtime: <b class="muted">needs the shift window</b>'
      + '<br><span class="link" title="The day&#39;s Employee Checkin rows, raw. Loaded for today only.">Time Log</span></div>'
    + '<div class="ask">Correction for: <b>'+cf[0]+'</b>'+cf[1]
      + '<br>Hours: <b>'+(r.overtime_hours||"—")+'</b>'
      + '<br>Reason: <b>'+esc(r.reason||"—")+'</b>'
      + '<br>Remarks: '+(r.remarks?esc(r.remarks):'<span class="muted">—</span>')+'</div>'
    + decide(r)+'</div>';
}

function leaveRow(r,kind){
  const half = r.half_day ? " · half day"+(r.half_day_date?" "+dmy(r.half_day_date):"") : "";
  const approver = r.leave_approver_name || r.leave_approver;
  return reqHead(r,kind||"Leave Request")
    + '<div class="reqx">'+pick(r)
    + '<div class="day"><b>'+dmy(r.from_date)+'</b><span>to '+dmy(r.to_date)+'</span>'
      + '<span class="applied">Applied On : '+dmy(r.posting_date||r.creation)+'</span></div>'
    + '<div><div class="pa"><span class="h"></span><span class="h">Days</span><span class="h">Balance</span>'
      + '<span class="lab">Leave</span><span class="att">'+(r.total_leave_days==null?"—":r.total_leave_days)+'</span>'
      + '<span>'+(r.leave_balance==null?"—":r.leave_balance)+'</span></div>'
      + '<div class="shift">'+esc(r.company||(S.byName[r.employee]||{}).company||"")+'</div></div>'
    + '<div class="hrs">Type: <b>'+esc(r.leave_type||"—")+esc(half)+'</b><br>'
      + 'Approver: <b>'+esc(approver||"not set")+'</b></div>'
    + '<div class="ask">Reason: <b>'+esc(r.description||"—")+'</b>'
      + '<br>Remarks: <span class="muted">—</span></div>'
    + decide(r)+'</div>';
}
/* Employee Master, in the shape Factor HR draws it (screenshot 28 Aug 2026):
   a card per person over a toolbar, with the list view kept behind a toggle.

   Two of that toolbar's controls have never been seen opened — the coloured dot
   on the left and the dropdown marked "All" — so rather than draw two dead
   selects they were given the filters this site can actually answer: status,
   which is what the dot on every card reports, and department, which is what
   161 people mostly differ by. Where a control's meaning is known it is
   matched; where it is not, it does something real and this comment says so. */
const EICON = {
  code:  "M3 5h18v14H3zM7 9.5h3.5v3.5H7zM14 10h4M14 14h4",
  role:  "M12 3a3.6 3.6 0 1 0 0 7.2A3.6 3.6 0 0 0 12 3M5 21v-1.2A5.4 5.4 0 0 1 10.4 14h3.2A5.4 5.4 0 0 1 19 19.8V21",
  dept:  "M3 21h18M5 21V4h9v17M14 10h5v11M8 8h3M8 12h3M8 16h3",
  where: "M12 21s6.5-5.7 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.3 12 21 12 21M12 12.5a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4",
};
const eline = (k, text) => '<div class="eline'+(text?"":" off")+'">'
  + '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="'+EICON[k]+'"/></svg>'
  + '<span>'+esc(text || "-")+'</span></div>';

/* Two letters off the name, as Factor HR does it. A record with no name at all
   would otherwise render an empty circle, which reads as a broken image. */
const initials = n => (String(n||"").trim().split(/\s+/).filter(Boolean).slice(0,2)
  .map(w=>w[0]).join("").toUpperCase() || "?");

/* Active is the only status that means "at work today". Everything else —
   Inactive, Suspended, Left — is drawn the same way, because the distinction
   that matters on this card is whether to expect them at the gate. */
const isOn = e => e.status === "Active";

function empCard(e){
  const name = (e.salutation ? e.salutation+" " : "") + (e.employee_name||"—");
  return '<article class="ecard" data-emp="'+esc(e.name)+'" tabindex="0" title="Open this record">'
    + '<div class="ava">'+esc(initials(e.employee_name))+'</div>'
    + '<div>'
      + '<div class="ename"><span>'+esc(name)+'</span><span class="go">&rarr;</span></div>'
      + '<div class="estat"><i class="sdot '+(isOn(e)?"on":"off")+'"></i>'+esc(e.status||"—")+'</div>'
      + eline("code",  e.employee_number)
      + eline("role",  e.designation)
      + eline("dept",  e.department ? tidyDept(e.department) : "")
      // Location is blank for everybody in Factor HR too — it is not a gap in
      // the migration, it is a field nobody there has ever filled.
      + eline("where", e.branch)
    + '</div></article>';
}

/* Factor HR's status filter, dot for dot: green Active, red InActive, blue All.
   A native <select> cannot colour an option, and on this control the colour is
   what gets read — so it is a button and a listbox rather than a dropdown with
   the words alone. The statuses come off the records, so a site that grows a
   fourth one grows a fourth row here without anybody editing this. */
/* Factor HR draws Active and InActive whether or not anybody is in them, and
   so does this: a filter that appears only once somebody has that status is a
   filter nobody knows exists, and *nobody is Inactive* is worth being able to
   ask for and see. Anything else the site holds — Left, Suspended — is appended
   after them, so the control still follows the data rather than a fixed list. */
const STATUS_ROWS = [["Active","on"],["Inactive","off"]];
function statusDrop(status){
	const n = Object.fromEntries(status);
	const fixed = STATUS_ROWS.map(r=>[r[0], r[0]+" ("+fmt(n[r[0]]||0)+")", r[1], !n[r[0]]]);
	const rest = status.filter(r=>!STATUS_ROWS.some(f=>f[0]===r[0]))
		.map(r=>[r[0], r[0]+" ("+fmt(r[1])+")", "off", false]);
	// All last, where Factor HR puts it — this control is a copy of theirs and
	// the order is part of what is being copied.
	const opts = fixed.concat(rest, [["", "All", "all", false]]);
	const cur = opts.find(o=>o[0]===S.empstatus) || opts[opts.length-1];
	return '<span class="empdrop">'
		+ '<button class="embtn" id="emstatus" aria-haspopup="listbox" aria-label="Filter by status" '
			+ 'aria-expanded="'+(S.empmenu?"true":"false")+'" title="'+esc("Status: "+cur[1])+'">'
			+ '<i class="sdot '+cur[2]+'"></i><b class="cx">&#9662;</b></button>'
		+ '<div class="emmenu" role="listbox" aria-label="Status"'+(S.empmenu?"":" hidden")+'>'
		+ opts.map(o=>'<button role="option" data-st="'+esc(o[0])+'"'+(o[3]?' class="zero"':"")
			+ ' aria-selected="'+(o[0]===S.empstatus)+'">'
			+ '<i class="sdot '+o[2]+'"></i>'+esc(o[1])+'</button>').join("")
		+ '</div></span>';
}

function secEmployees(){
  const q = $("#q").value.trim().toLowerCase();
  const all = scoped();
  let rows = all.filter(e=>!q||[e.employee_number,e.employee_name,e.designation,e.department]
    .some(v=>(v||"").toLowerCase().includes(q)));
  if(S.empstatus) rows = rows.filter(e=>e.status===S.empstatus);
  if(S.empdept)   rows = rows.filter(e=>e.department===S.empdept);
  if(S.empdesig)  rows = rows.filter(e=>e.designation===S.empdesig);
  if(S.empdev==="yes") rows = rows.filter(e=>e.attendance_device_id);
  if(S.empdev==="no")  rows = rows.filter(e=>!e.attendance_device_id);

  const uniq = k => [...new Set(all.map(e=>e[k]).filter(Boolean))].sort();
  const sel = (id, cur, opts, blank) => '<select id="'+id+'">'
    + '<option value="">'+blank+'</option>'
    + opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===cur?" selected":"")+'>'+esc(o[1])+'</option>').join("")
    + '</select>';
  const status = tally(all,"status");

  return '<div class="emhead"><h2>Employee Master</h2>'
    + '<span class="cov live">Live</span>'
    + '<span class="n">'+fmt(rows.length)+(rows.length===all.length?"":" of "+fmt(all.length))+' people</span>'
    + '<span class="right">'
      // Read-only by design, and a button that lied about it would be worse than
      // no button. Hiring happens on the site; this page is a window.
      + '<button class="embtn" disabled title="This dashboard only reads. New employees are created on the ERPNext site itself — see app/README.md.">Add New Employee</button>'
    + '</span></div>'

    + '<div class="embar">'
    + statusDrop(status)
    + '<span class="find"><svg viewBox="0 0 24 24" width="15" height="15" stroke="var(--ink-3)" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>'
      + '<input type="search" id="emq" placeholder="Search employee…" aria-label="Search employees" value="'+esc($("#q").value)+'"></span>'

/* Factor HR's merge tokens, resolved case-insensitively.
   118 distinct tokens across 17 templates, and the same field appears as
   EmployeeName, employeename and EMPLOYEENAME - so the key is lowercased and
   stripped of spaces, dots and underscores, and case is re-applied on output. */
const TOKENS = {
  employeename:e=>e.employee_name, employeefullname:e=>e.employee_name,
  empcode:e=>e.employee_number, employeecode:e=>e.employee_number,
  designation:e=>e.designation, department:e=>tidyDept(e.department), branch:e=>e.branch,
  doj:e=>e.date_of_joining, dateofjoining:e=>e.date_of_joining, pastdateofjoining:e=>e.date_of_joining,
  dol:e=>e.relieving_date, dateofleaving:e=>e.relieving_date,
  dateofbirth:e=>e.date_of_birth, gender:e=>e.gender,
  nationality:e=>e.custom_nationality, maritalstatus:e=>e.marital_status,
  fathername:e=>e.custom_father_name, employeesfathername:e=>e.custom_father_name,
  employeefathername:e=>e.custom_father_name,
  employeespousename:e=>e.custom_spouse_name, employeesreligion:e=>e.custom_religion,
  employeeaddress:e=>e.current_address||e.permanent_address,
  employeepermanentaddress:e=>e.permanent_address,
  mobileno:e=>e.cell_number, mobile:e=>e.cell_number, employeemobileno:e=>e.cell_number,
  email:e=>e.company_email||e.personal_email, employeeemail:e=>e.company_email||e.personal_email,
  employeepanno:e=>e.custom_pan_no, employeeidentitypanno:e=>e.custom_pan_no,
  employeebankname:e=>e.bank_name, employeebankaccountno:e=>e.bank_ac_no,
  passportno:e=>e.passport_number,
  companyname:e=>e.company, company:e=>e.company,
  grosssalary:e=>e.ctc, currencysymbol:()=>"₹", currencytitle:()=>"Rupees",
  employeetitle:e=>(e.gender==="Female"?"Ms.":"Mr."), title:e=>(e.gender==="Female"?"Ms.":"Mr."),
  hisher:e=>(e.gender==="Female"?"Her":"His"),
  currentdate:()=>new Date().toISOString().slice(0,10),
};
const norm = t => t.toLowerCase().replace(/[\s._\-\/]/g,"");

function mergeLetter(html, emp, ctx){
  const missing=new Set();
  const out = html.replace(/\{([A-Za-z0-9 _.\-\/]{2,40})\}/g, (m, raw)=>{
    const key=norm(raw);
    if(ctx && ctx[key]!=null && ctx[key]!=="") return esc(String(ctx[key]));
    const fn=TOKENS[key];
    let v = fn ? fn(emp) : undefined;
    if(v==null || v==="" ){ missing.add(raw.trim());
      // Shown, never blanked. A letter with a visible gap is obviously
      // unfinished; one with a blank space looks finished and is not.
      return '<span class="tok">[['+esc(raw.trim())+']]</span>'; }
    v=String(v);
    if(raw===raw.toUpperCase() && /[A-Z]{3,}/.test(raw)) v=v.toUpperCase();
    return esc(v);
  });
  return {html:out, missing:[...missing]};
}

function wireLetterForm(){
  const e=$("#ltEmp"), t=$("#ltType"), go=$("#ltGo");
  if(!e||!t) return;
  const people=scoped().filter(x=>x.status==="Active")
    .sort((a,b)=>(a.employee_name||"").localeCompare(b.employee_name||""));
  e.innerHTML=people.map(p=>'<option value="'+p.name+'">'+esc(p.employee_name)
    +' ('+esc(p.employee_number||"-")+')</option>').join("");
  t.innerHTML=(S.letterTypes||[]).map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join("");
  go.addEventListener("click", async ()=>{
    const type=(S.letterTypes||[]).find(x=>x.name===t.value);
    if(!e.value||!type) return;
    $("#ltOut").innerHTML='<div class="empty">rendering…</div>';
    try{
      // The list load carries ten fields per employee; a letter wants thirty of
      // them. Read the record whole here, or every token but the name renders
      // as a gap and the page blames the data for what it never asked for.
      const [full, emp] = await Promise.all([
        api("/api/resource/Letter Type/"+encodeURIComponent(type.name)).then(r=>r.data),
        api("/api/resource/Employee/"+encodeURIComponent(e.value)).then(r=>r.data)
          .catch(()=>S.byName[e.value]),
      ]);
      const r=mergeLetter(full.template||"", emp, {letterdate:new Date().toISOString().slice(0,10),
                                                   letternumber:"(on issue)"});
      $("#ltOut").innerHTML =
        (r.missing.length
          ? '<div class="gap"><b>'+r.missing.length+' field(s) ERPNext cannot fill:</b> '+esc(r.missing.join(", "))+'</div>'
          : '<div class="note"><b>Every field resolved.</b></div>')
        + '<div class="letter">'+r.html+'</div>';
    }catch(err){ $("#ltOut").innerHTML='<div class="gap">'+esc(String(err.message||err))+'</div>'; }
  });
}

/* Days until a passport runs out. Negative is already expired, which is the
   row that matters — an expired document is a person who cannot be sent
   anywhere, and nobody is told until somebody looks. */
const daysTo = iso => {
  const d=new Date(String(iso).slice(0,10)+"T00:00:00");
  return isNaN(d) ? null : Math.round((d - new Date(new Date().toISOString().slice(0,10)+"T00:00:00"))/86400000);
};

                + ' Four of them came back empty because they are <b>empty in Factor HR</b>: father, mother, spouse and religion are populated for 0 of 504.')+'</div>'
          : '<div class="empty"><b>No employees read yet</b>The document coverage is counted off the Employee master, which has not answered.</div>')),
      {ico:"🗃"})
  + '</div>';

  // The expiry list is the only thing on this page that would be used daily,
  // so it is built even though it is almost certainly empty — a watch list that
  // appears only once somebody has data is a watch list nobody trusts.
  const expiring = rows.filter(r=>r.valid_upto)
    .map(r=>Object.assign({d:daysTo(r.valid_upto)}, r))

              + '<td>'+esc(r.company||"—")+'</td><td>Passport '+esc(r.passport_number||"")+'</td>'

              + (r.d<0 ? "expired "+Math.abs(r.d)+"d" : r.d+"d")+'</span></td></tr>').join("")
          + '</tbody></table></div>'
        : '<div class="empty"><b>Nothing has an expiry date recorded</b>Not one active employee carries a passport validity, so there is nothing to watch. That is the finding, not a failure &mdash; it says document expiry is not tracked anywhere today.</div>'),
      {ico:"⏳"})
  + '</div>';

  html += '<div class="cols">'
  + panel("The doctype this would need","none",
      specTable(["Field","Type","State","Note"], [
        ["Employee","Link &rarr; Employee","build",""],
        ["Document type","Link &rarr; Document Type","build","Factor HR&rsquo;s own master. Passport, licence, ESI card, gate pass, qualification, contract"],
        ["Document number","Data","build","Unique per type per person, or the same card gets entered twice"],
        ["Issued by","Data","build","The authority, not the person who typed it in"],
        ["Issue date","Date","build",""],
        ["Expiry date","Date","build","The whole reason the doctype exists. Blank means does not expire, and must be allowed"],
        ["Scan","Attach","build","A document register with no copy in it is an index, not a record"],
        ["Verified by, verified on","Link &rarr; User + Date","build","Somebody has seen the original"],
        ["Reminder before expiry","Notification","stock","Frappe sends this from a date field with no code &mdash; the only genuinely free part"],
        ["Confidentiality","Permissions on the doctype","build","A payroll clerk should not read everybody&rsquo;s passport. Note that Frappe <b>replaces</b> standard permissions the moment one custom row exists"],
      ])
      + '<div style="margin-top:.7rem">'+note('<b>Roughly a day of work, plus the decisions.</b> The build is small; what it is worth depends on whether anybody chases expiry today. Ask before writing it.')+'</div>',
      {ico:"🧱"})
  + '</div>';
  return html;
}

/* Factor HR's Employee Detail is a **report screen**, not a record view

   was a record page and that was wrong — this is the form, section for section,

   Each tick box names the fields it adds to the export. Where the answer lives
   in a child table rather than on the record it cannot come from a list call at

const ED_SECTIONS = [
	["category",  "Category Detail",       ["department","designation","grade","branch","employment_type"], ""],
	["pf",        "PF / ESIC Detail",      ["provident_fund_account"], ""],
	["salary",    "Salary Master Detail",  ["ctc","salary_currency","salary_mode"], ""],
	["personal",  "Personal Detail",       ["gender","date_of_birth","blood_group","marital_status","cell_number","personal_email"], ""],
	["skills",    "Skill Set Details",     [], "child"],
	["identity",  "Identity Detail",       ["pan_number","passport_number","valid_upto"], ""],
	["bank",      "Bank Detail",           ["salary_mode","bank_name","bank_ac_no","iban"], ""],
	["family",    "Family Detail",         ["person_to_be_contacted","relation","emergency_phone_number"], ""],
	["past",      "Past History",          [], "child"],
	["asjoin",    "Show Categories As Per Joining Date", [], "modifier"],
	["qual",      "Qualification Detail",  [], "child"],
	["nominee",   "Nominee Detail",        [], "child"],
	["transfer",  "Transfer / Promotion History", [], "child"],
	["separation","Separation",            ["relieving_date","reason_for_leaving","held_on"], ""],
];
const ED_WHY = {
	child: "Lives in a child table on the record, so it cannot come from a list call — one document read per person, 161 requests for one report.",
	modifier: "A modifier on Category Detail rather than a section of its own, and it only means anything once categories are dated.",
};
// Always in the export, ticked or not: a row nobody can identify is not a row.
const ED_BASE = ["name","employee_number","employee_name","company","status","date_of_joining"];
const ED_STATUSES = ["Active","Inactive","Suspended","Left"];

/* Prettifying the fieldname is right for most of them and wrong for the few
   that are an acronym, or that would read as something else — `name` holds
   the record id, and a column headed Name beside Employee Name is a column
   nobody can read. */
const FIELD_LABEL = {name:"Record ID", employee_number:"Employee Code", ctc:"CTC",
	pan_number:"PAN", iban:"IBAN", bank_ac_no:"Bank Account",
	provident_fund_account:"PF Account", valid_upto:"Passport Valid Upto"};
const prettyField = f => FIELD_LABEL[f]
	|| f.replace(/_/g," ").replace(/\b\w/g, c=>c.toUpperCase());
const DATE_FIELD = /(date|dob|valid_upto|held_on)/;

/* Whole years on a given day, the way an age filter is meant to read: somebody
   born on the 29th is not yet a year older on the 28th. */
function ageOn(dob, on){
	if(!dob) return null;
	const b = new Date(String(dob).slice(0,10)+"T00:00:00");
	const d = new Date(String(on).slice(0,10)+"T00:00:00");
	if(isNaN(b) || isNaN(d)) return null;
	let a = d.getFullYear() - b.getFullYear();
	const m = d.getMonth() - b.getMonth();
	if(m < 0 || (m === 0 && d.getDate() < b.getDate())) a--;
	return a;
}

/* Ask for a field a site does not have and the whole call fails, taking every
   other field with it. So each ticked section is probed for one row first, and
   a section the site cannot answer is dropped by name rather than turning the
   report into an error message. */
async function edProbe(fields){
	try{
		await api("/api/resource/Employee", {fields:JSON.stringify(fields), limit_page_length:1});
		return true;
	}catch(err){ return false; }
}

async function edGenerate(){
	S.edBusy = true; S.edMsg = ""; S.edBad = false; renderBody();
	try{
		const want = ED_SECTIONS.filter(s=>!s[3] && S.edSections.includes(s[0]));
		const kept = [], dropped = [];
		for(const s of want){
			if(await edProbe(ED_BASE.concat(s[2]))) kept.push(s);
			else dropped.push(s[1]);
		}
		let cols = [...new Set(ED_BASE.concat(...kept.map(s=>s[2])))];
		// The age filter is arithmetic on a date, not a field, so the date has
		// to come back whether or not Personal Detail was ticked.
		const wantAge = S.edAgeA !== "" || S.edAgeB !== "";
		if(wantAge && !cols.includes("date_of_birth")) cols.push("date_of_birth");

		const filters = [];
		if(S.edStatus.length && S.edStatus.length < ED_STATUSES.length) filters.push(["status","in",S.edStatus]);
		if(S.empSel)   filters.push(["name","=",S.empSel]);
		if(S.edMgr)    filters.push(["reports_to","=",S.edMgr]);
		if(S.edJoinA)  filters.push(["date_of_joining",">=",S.edJoinA]);
		if(S.edJoinB)  filters.push(["date_of_joining","<=",S.edJoinB]);
		if(S.edSepA)   filters.push(["relieving_date",">=",S.edSepA]);
		if(S.edSepB)   filters.push(["relieving_date","<=",S.edSepB]);
		if(S.edDobA)   filters.push(["date_of_birth",">=",S.edDobA]);
		if(S.edDobB)   filters.push(["date_of_birth","<=",S.edDobB]);

		let rows = await listAll("Employee", cols, filters.length ? filters : null);

		if(wantAge){
			const on = S.edAgeOn || new Date().toISOString().slice(0,10);
			const lo = S.edAgeA === "" ? -Infinity : +S.edAgeA;
			const hi = S.edAgeB === "" ?  Infinity : +S.edAgeB;
			// No date of birth is not "outside the range" — it is unknown, and
			// dropping those rows silently would understate the report.
			const blind = rows.filter(e=>!e.date_of_birth).length;
			rows = rows.filter(e=>{ const a = ageOn(e.date_of_birth, on); return a != null && a >= lo && a <= hi; });
			if(blind) S.edMsg = fmt(blind)+" record"+(blind===1?" has":"s have")+" no date of birth and could not be aged, "
				+ "so they are not in this report. That is a gap in the master, not in the filter.";
		}

		S.edReport = {rows, cols, when:nowStamp(), dropped:dropped.join(", "),
		              sections: kept.length ? kept.map(s=>s[1]).join(", ") : "the identifying fields only"};
		if(dropped.length) S.edBad = true, S.edMsg = "This site's Employee has no field behind "+dropped.join(", ")
			+ ". Those columns were left out; everything else was generated.";
	}catch(err){
		S.edBad = true; S.edMsg = "The site refused the report: "+String(err.message||err);
	}
	S.edBusy = false; renderBody();
}

function edCsv(){
	const r = S.edReport;
	if(!r || !r.rows.length) return;
	const cell = v => { const s = String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
	download("employee-detail-"+new Date().toISOString().slice(0,10)+".csv",
		[r.cols.join(",")].concat(r.rows.map(row=>r.cols.map(c=>cell(row[c])).join(","))).join("\r\n"));
}

function edBody(doc){
  if(!doc) return '<div class="empty">reading the record…</div>';
  if(doc.__err) return '<div class="gap"><b>Could not read the record.</b> '+esc(doc.__err)+'</div>';
  const all = DETAIL_GROUPS.reduce((a,g)=>a.concat(g[2]), []);
  const blank = all.filter(f=>edValue(doc,f[0])==null).length;
  return '<div class="tiles" style="margin-bottom:.9rem">'
    + tile("Code", esc(doc.employee_number||"—"), "", doc.company||"")
    + tile("Status", esc(doc.status||"—"), doc.status==="Active"?"good":"warn", "")

/* Factor HR's CTC report is a filter panel and a Generate button, and the panel
   is copied control for control — including the controls we cannot honour,
   because a missing control hides the gap while a control that says why it
   cannot answer names it. What each one does here is spelled out under the
   form and in CTC_WHY below. */

const CTC_UNITS = ["Yearly","Monthly","Daily"];
const CTC_BY = [["","(none)"],["company","Company"],["department","Department"],
                ["designation","Designation"],["grade","Grade"],["branch","Branch"]];

/* Why a control cannot do what its label promises. Shown when it is used
   rather than as a footnote, so the answer arrives where the question was
   asked. */
const CTC_WHY = {
  incr: "With Increment History needs a dated salary revision per person. ERPNext keeps that in Salary Structure Assignment rows over time and our site has none, so there is no history to show \u2014 today's number is the only number.",
  attdays: "Based on Attendance Days needs generated Attendance, and there are 0 rows. It also needs the divisor \u2014 26 days, calendar days, or working days \u2014 which is an attendance policy nobody has stated. That divisor is the difference between two payslips.",
  hidegroup: "Hide Wage Type Group hides the earning-head grouping in Factor HR's output. There is nothing to hide here: no earning heads have been loaded at all, which is the ask behind E1.",
};

function ctcUnitDiv(unit){ return unit==="Monthly" ? 12 : (unit==="Yearly" ? 1 : 0); }

/* The rows the form asks for. Read off what is already loaded — this report
   makes no request of its own, so Generate is instant and costs the site
   nothing. */
function ctcRows(){
  const f=S.ctc, co=$("#company").value, q=(f.emp||"").toLowerCase().trim();
  return S.employees.filter(e=>{
    if(co && e.company!==co) return false;
    if(f.status!=="All" && (e.status||"")!==f.status) return false;
    // Factor HR means "active in this window"; on our side it can only mean
    // joined in it, because no relieving date came across. Said so on the form.
    if(f.from && !(e.date_of_joining && e.date_of_joining>=f.from)) return false;
    if(f.till && !(e.date_of_joining && e.date_of_joining<=f.till)) return false;
    if(q){
      const hay=((e.employee_number||"")+" "+(e.employee_name||"")+" "+e.name).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort((a,b)=>{
    const k=S.ctc.by;
    if(k){ const d=String(a[k]||"\u2014").localeCompare(String(b[k]||"\u2014")); if(d) return d; }
    return String(a.employee_name||"").localeCompare(String(b.employee_name||""));
  });
}

const ctcAmount = (e,unit) => {
  const div=ctcUnitDiv(unit);
  return (e.ctc && div) ? Math.round(Number(e.ctc)/div) : null;
};

/* The generated report. Grouped with subtotals when Filter By is set, because
   a CTC report without a per-company subtotal is half a report. */
function ctcReport(){
  const f=S.ctc, rows=ctcRows(), unit=f.unit, div=ctcUnitDiv(unit);
  if(!rows.length) return '<div class="empty" style="margin-top:.8rem">'
    + '<b>Nothing matches</b>No employee is left after these filters. Reset Fields puts them back.</div>';

  const withCtc=rows.filter(e=>e.ctc), sum=withCtc.reduce((n,e)=>n+Number(e.ctc||0),0);
  const money=v=>(v==null?'<span class="muted">\u2014</span>':fmt(v));
  const cells=e=>'<td class="mono">'+esc(e.employee_number||e.name)+'</td>'
    + '<td>'+esc(e.employee_name||"")+'</td>'
    + '<td class="muted">'+esc(e.company||"\u2014")+'</td>'
    + '<td class="muted">'+esc(tidyDept(e.department))+'</td>'
    + '<td class="muted">'+esc(e.designation||"\u2014")+'</td>'
    + '<td class="mono">'+esc(e.date_of_joining||"\u2014")+'</td>'
    + '<td>'+esc(e.status||"\u2014")+'</td>'
    + '<td class="n">'+money(ctcAmount(e,unit))+'</td>';

  let body="", last=null, gs=0, gn=0;
  const subtotal=()=>{ if(last===null) return "";
    const r='<tr class="grp"><td colspan="7">'+esc(last||"\u2014")+' \u2014 '+gn+' '
      +(gn===1?"person":"people")+'</td><td class="n">'+(div?fmt(Math.round(gs/div)):"\u2014")+'</td></tr>';
    gs=0; gn=0; return r; };
  rows.forEach(e=>{
    if(f.by){
      const k=e[f.by]||"\u2014";
      if(k!==last){ body+=subtotal(); last=k; }
      gs+=Number(e.ctc||0); gn++;
    }
    body+='<tr>'+cells(e)+'</tr>';
  });
  if(f.by) body+=subtotal();

  return '<div class="legend" style="margin-top:.9rem">'
      + '<b style="font-family:var(--display)">Generated</b>'
      + '<span class="cov '+(withCtc.length?"part":"none")+'">'+fmt(rows.length)+' row'+(rows.length===1?"":"s")+'</span>'
      + '<span>'+fmt(withCtc.length)+' with a CTC, '+fmt(rows.length-withCtc.length)+' blank'
      + (f.by?', grouped by '+esc(f.by):'')+'. Output unit <b>'+esc(unit)+'</b>.</span>'
      + '<button class="btn ghost" style="margin-left:auto" data-cb="export">\u2b07 Export CSV</button></div>'
    + (div ? "" : '<div style="margin:.6rem 0">'+gap('<b>A daily rate cannot be computed here.</b> It needs the attendance-day divisor \u2014 26 days, calendar days or working days \u2014 which is the same unstated policy that <em>Based on Attendance Days</em> asks for. The column is left empty rather than filled with a guess: this number is somebody\u2019s pay.')+'</div>')
    + '<div class="scroll" style="margin-top:.6rem"><table class="ctc" style="min-width:900px"><thead><tr>'
      + '<th>Emp code</th><th>Name</th><th>Company</th><th>Department</th><th>Designation</th>'
      + '<th>DOJ</th><th>Status</th><th class="n">CTC ('+esc(unit.toLowerCase())+')</th></tr></thead><tbody>'
      + body
      + '<tr class="tot"><td colspan="7">Total \u2014 '+fmt(withCtc.length)+' of '+fmt(rows.length)+' with a CTC</td>'
      + '<td class="n">'+(div?fmt(Math.round(sum/div)):"\u2014")+'</td></tr>'
    + '</tbody></table></div>';
}

function ctcExport(){
  const f=S.ctc, rows=ctcRows(), unit=f.unit;
  if(!rows.length){ S.ctcMsg="Nothing to export \u2014 no employee matches these filters."; return; }
  const cell=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const cols=["emp_code","name","company","department","designation","date_of_joining","status","ctc_"+unit.toLowerCase()];
  const csv=[cols.join(",")].concat(rows.map(e=>[e.employee_number||e.name, e.employee_name, e.company,
      tidyDept(e.department), e.designation, e.date_of_joining, e.status, ctcAmount(e,unit)]
      .map(cell).join(","))).join("\r\n");
  const name="ctc-earnings-"+new Date().toISOString().slice(0,10)+".csv";
  download(name, csv);
  S.ctcMsg="Exported "+fmt(rows.length)+" row"+(rows.length===1?"":"s")+" to "+name
    + ". Written in the browser from what is already loaded \u2014 nothing was sent anywhere.";
}

function ctcButton(k){

           unit:"Yearly", attdays:false, hidegroup:false, incr:false};
    S.ctcRun=false; S.ctcPick=false; S.ctcMsg="Fields reset.";
    return renderBody();

  if(k==="background"){
    S.ctcMsg="There is no queue behind this page. In ERPNext a long report is enqueued and mailed when it finishes; here it is computed in the browser from records already loaded, so Generate is instant and this button has nothing to hand off to.";

         : "Loading people is a migration step with its own tooling in <code>tools/</code>, run deliberately and checked, not a button on a report.");
    return renderBody();

}

/* Every control rebuilds the body, which is cheap at this size and keeps the
   form and the table below it from ever disagreeing about what was asked for. */
function wireCTC(){
  const c=$("#content");
  c.querySelectorAll("[data-cf]").forEach(el=>{
    const k=el.dataset.cf;
    const typing = el.tagName==="INPUT" && el.type==="text";
    el.addEventListener(typing?"input":"change",()=>{
      S.ctc[k] = el.type==="checkbox" ? el.checked : el.value;
      // The answer arrives where the question was asked, and only when the box
      // is ticked — unticking it is not a question.
      if(el.type==="checkbox") S.ctcMsg = el.checked ? (CTC_WHY[k]||"") : "";
      if(typing) S.ctcFocus='[data-cf="'+k+'"]';
      renderBody();
    });
  });
  c.querySelectorAll("[data-cb]").forEach(b=>b.addEventListener("click",()=>ctcButton(b.dataset.cb)));
  const pick=c.querySelector("#ctcpicklist");
  if(pick) pick.addEventListener("change",()=>{ S.ctc.emp=pick.value; S.ctcPick=false; renderBody(); });

  // Rebuilding the body drops focus mid-word, so it is put back where it was.
  if(S.ctcFocus){
    const el=c.querySelector(S.ctcFocus); S.ctcFocus="";
    if(el){ el.focus(); if(el.setSelectionRange) el.setSelectionRange(el.value.length,el.value.length); }
  }
}

/* Factor HR groups people by its own category master; ERPNext spreads the same
   idea across five separate link fields. Each is counted from what the records

   The fifth column is whether the Category Type screen below has a row for it.
   Three of these five do not appear there, which makes them ours rather than
   theirs: nothing is coming across to fill them. */
const CATEGORY_FIELDS = [
  ["department",      "Department",      "departments",  "🏢", true],
  ["designation",     "Designation",     "designations", "🎓", true],
  ["grade",           "Grade",           null,           "▤", false],
  ["branch",          "Branch",          null,           "📍", false],
  ["employment_type", "Employment type", null,           "📄", false],
];

/* Factor HR's Categories, photographed 28 August 2026 — and it is not the
   screen the name suggested. Behind that menu item is `Category Type`: a
   master of masters, eight rows, each holding its own value list behind a
   View Category button. Two things follow from that, and FACTOHR_SCREENS §9
   guessed both of them wrong.

   It is not one Worker / Staff / Contract list, so there is no single field to
   map it onto. And two of the five rows visible are not groupings at all —
   Gratuity Applicable and LWF Applicable are statutory pay treatment, filed in
   the same table as Department and maintained by whoever maintains
   departments. ERPNext has neither as a category, so neither imports onto a
   field; both have to be rebuilt as rules.

   `field` is the ERPNext field the type reads onto, or null where nothing on
   our side answers it at all. */
const FH_CATEGORY_TYPES = [
  {name:"Company Name", code:"", field:"company", count:"companies", ico:"🏭",
   maps:'<code>Employee.company</code>, with a real <code>Company</code> doctype behind it'},
  {name:"Department", code:"P001", field:"department", count:"departments", ico:"🏢",
   maps:'<code>Employee.department</code>'},
  {name:"Designation", code:"", field:"designation", count:"designations", ico:"🎓",
   maps:'<code>Employee.designation</code>'},
  {name:"Gratuity Applicable", code:"", field:null, ico:"🏦",
   why:'Whether gratuity applies to a person. In Factor HR that is a <b>category</b> — set from this screen, by whoever maintains departments.',

/* ------------------------------------------- Employees → Calendar ------- */

/* Factor HR's calendar screen, drawn the way it draws it: the toolbar, the
   calendar name beside its default flag, the month strip with the arrows in the
   middle, then six weeks with the week number down the gutter, the day number
   in the corner, and the days either side of the month greyed out.

   Their layout, this build's palette. Copying their navy as well would make the
   two harder to compare rather than easier — the same trade the sidebar and the
   top bar already make.

   Two details are theirs exactly and both are deliberate. The week numbers are
   counted from Sunday, not ISO — their grid reads 31 for the week of 26 July
   2026 where ISO says 30, and a comparison that renumbered the weeks would look
   like a bug in ours. And the first cell of each month carries the long date,
   "Jul 26, 2026", which is the only place that screen names its month at all.

   What is *in* the cells is ours. Their calendar shows "+ 1 more…" on every day
   of the month and nobody has ever opened one, so what it holds over there is
   unknown and nothing here pretends otherwise. */

const CAL_MONTHS = ["January","February","March","April","May","June","July",
                    "August","September","October","November","December"];
const CAL_DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
/* How many entries a cell shows before it collapses the rest behind Factor
   HR's own "+ N more…". Two fits the cell at every width this page is used at. */
const CAL_SHOWN = 2;

/* Local date rather than toISOString: this runs at UTC+5:30, where midnight
   local is half past six the previous evening in UTC, and every date on a
   calendar or a muster grid would land a day early. */
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
                 +"-"+String(d.getDate()).padStart(2,"0");
const thisMonth = () => new Date().toISOString().slice(0,7);

/* Sunday-start week numbering, because that is what Factor HR's gutter shows —
   see above. Jan 1 decides the offset: 2026 opens on a Thursday, so the week
   containing 26 July is its 31st. */
function weekNo(d){
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - jan1) / 86400000);
  return Math.floor((days + jan1.getDay()) / 7) + 1;
}

/* Always six weeks, as Factor HR draws it. A grid that changes height with the
   month makes the arrows move under the pointer. */
function monthCells(ym){
  const [y,m] = ym.split("-").map(Number);
  const start = new Date(y, m-1, 1);
  start.setDate(1 - start.getDay());
  const out=[];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); out.push(d); }
  return out;
}

/* Which holiday list this calendar is showing. Factor HR types a name into the
   box; here the name has to be one of ours, so it is picked rather than typed —
   a calendar named for a list that does not exist would show an empty month and
   blame the month. */
const calList = () => {
  const lists=(S.holidayLists||[]).map(h=>h.name);
  return lists.includes(S.cal.list) ? S.cal.list : (lists[0]||"");
};

/* One day's entries, out of what this site can actually answer: the named
   holiday, the weekly off, and anybody whose first day it was. */
function calEntries(){
  const rows = S.holidays[calList()] || [], by = {};
  const push=(k,e)=>{ (by[k] ||= []).push(e); };
  rows.forEach(r=>{
    const k=String(r.holiday_date).slice(0,10);
    push(k, r.weekly_off ? {cls:"off", text:r.description||"Weekly off"}
                         : {cls:"hol", text:r.description||"Holiday"});
  });
  // Joining dates come off the same scoped list the rest of the page uses, so
  // the company selector in the top bar means the same thing here as everywhere.
  active().forEach(e=>{
    if(e.date_of_joining) push(String(e.date_of_joining).slice(0,10),
      {cls:"join", text:(e.employee_name||e.name)+" joined"});
  });
  const q=(S.cal.find||"").trim().toLowerCase();
  if(q) Object.keys(by).forEach(k=>{
    by[k]=by[k].filter(e=>e.text.toLowerCase().includes(q));
    if(!by[k].length) delete by[k];
  });
  return by;
}

/* The five buttons and the Data Import menu, in Factor HR's order. Four of them
   write, and this page proxies GET only — so they are drawn where Factor HR
   draws them and disabled with the reason on them, rather than quietly missing
   or, worse, present and inert. A holiday list is a document on the site. */
const CAL_TOOLS = [
  ["new",    "New",    "＋", "Holiday lists are created on the ERPNext site. This page only reads — see app/README.md."],
  ["edit",   "Edit",   "✎", "Editing a holiday list changes who is expected at the gate, and that is a write. It belongs on the site."],
  ["delete", "Delete", "⊘", "Deleting a holiday list would leave everybody on it with no weekly off. Not from a dashboard."],
];

function calToolbar(){
  const busy = (S.holidayLists||[]).length && !Object.keys(S.holidays).length;
  return '<div class="embar calbar">'
    + CAL_TOOLS.map(t=>'<button class="embtn" disabled title="'+esc(t[3])+'">'
        + '<span class="cico '+t[0]+'">'+t[2]+'</span>'+t[1]+'</button>').join("")
    + '<button class="embtn" id="calfind" aria-pressed="'+(S.cal.search?"true":"false")+'"'
      + ' title="Search this month&rsquo;s entries">'
      + '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>Search</button>'
    + '<button class="embtn" id="calclose" title="Back to Employee Master, which is where Factor HR&rsquo;s Close returns to">'
      + '<span class="cico close">✕</span>Close</button>'
    + '<span style="margin-left:auto;display:inline-flex;gap:.45rem;align-items:center">'
      + (busy?'<span class="n" style="font-size:.78rem;color:var(--ink-3)">reading the holiday dates…</span>':"")
      + '<button class="embtn" disabled title="Factor HR imports holidays from a spreadsheet here. Importing days off is a write, and a wrong row is a day the plant is marked absent.">⭳ Data Import ▾</button>'
    + '</span></div>';
}

function calNameRow(){
  const list=calList(), lists=S.holidayLists||[];
  // Factor HR's "Default Calendar" tick is our Company default holiday list.
  // Known only if the Company read came back with the field — the richer call
  // is tried first and falls back, so its absence is a real answer, not a bug.
  const known = (S.companies||[]).some(c=>"default_holiday_list" in c);
  const defaults = (S.companies||[]).filter(c=>c.default_holiday_list===list);
  return '<div class="embar calname">'
    + '<label>Calendar Name: '
      + (lists.length
        ? '<select id="callist">'+lists.map(h=>'<option'+(h.name===list?" selected":"")+'>'+esc(h.name)+'</option>').join("")+'</select>'
        : '<input value="" placeholder="no holiday list on the site" disabled>')
    + '</label>'
    + '<label class="caldef">Default Calendar: '
      + '<input type="checkbox" disabled'+(known && defaults.length?" checked":"")+'></label>'
    + '<span class="n">'
      + (!known
          ? 'whether it is the default was not read — the Company list answered without <code>default_holiday_list</code>'
          : defaults.length
            ? 'default for '+defaults.map(c=>esc(c.name)).join(", ")
            : 'not the default calendar of any company')
    + '</span>'
    + '<label class="calgo">Go To Month '
      + '<input type="month" id="calgo" value="'+esc(S.cal.month||thisMonth())+'"></label>'
    + '</div>'
    + (S.cal.search
        ? '<div class="embar"><span class="find">'
          + '<svg viewBox="0 0 24 24" width="15" height="15" stroke="var(--ink-3)" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>'
          + '<input type="search" id="calq" placeholder="Search this calendar…" aria-label="Search the calendar" value="'+esc(S.cal.find||"")+'"></span>'
          + '<span class="n" style="font-size:.8rem;color:var(--ink-3)">Filters what the cells show. Factor HR&rsquo;s own Search dialog has never been screenshotted.</span></div>'
        : "");
}

function calGrid(){
  const ym = S.cal.month || thisMonth();
  const [y,m] = ym.split("-").map(Number);
  const cells = monthCells(ym), by = calEntries(), today = new Date().toISOString().slice(0,10);

  let html = '<div class="calstrip">'
    + '<button class="calnav" data-cal="prev" title="Navigate between months" aria-label="Previous month">&#10094;</button>'
    + '<span class="calmonth">'+CAL_MONTHS[m-1]+' '+y+'</span>'
    + '<button class="calnav" data-cal="next" title="Navigate between months" aria-label="Next month">&#10095;</button>'
    + '</div>';

  html += '<div class="calgrid"><div class="dow gut"></div>'
    + CAL_DOW.map(d=>'<div class="dow">'+d+'</div>').join("");

  cells.forEach((d,i)=>{
    if(i%7===0) html += '<div class="wk">'+weekNo(d)+'</div>';
    const k=ymd(d), out=(d.getMonth()!==m-1);
    const list=by[k]||[];
    const open=!!S.cal.open[k];
    const shown=open?list:list.slice(0,CAL_SHOWN);
    // The grid's very first cell carries the long date — "Jul 26, 2026" — and
    // the first of any month carries "Aug 1". Both are theirs exactly, and the
    // long date is the only place that screen names the month it is showing.
    const label = i===0
      ? CAL_MONTHS[d.getMonth()].slice(0,3)+" "+d.getDate()+", "+d.getFullYear()
      : (d.getDate()===1 ? CAL_MONTHS[d.getMonth()].slice(0,3)+" 1" : String(d.getDate()));
    html += '<div class="cell'+(out?" out":"")+(k===today?" today":"")+'">'
      + '<span class="num">'+label+'</span>'
      + shown.map(e=>'<span class="ev '+e.cls+'" title="'+esc(e.text)+'">'+esc(e.text)+'</span>').join("")
      + (list.length>CAL_SHOWN
          ? '<button class="more" data-more="'+k+'">'
            + (open ? "− show less" : "+ "+(list.length-CAL_SHOWN)+" more…")+'</button>'
          : "")
      + '</div>';
  });
  return html + '</div>';
}

function calLegend(){
  const n = Object.values(calEntries()).reduce((t,l)=>t+l.length,0);
  return '<div class="callegend">'
    + '<span class="ev hol">Named holiday</span>'
    + '<span class="ev off">Weekly off</span>'
    + '<span class="ev join">Joined that day</span>'
    + '<span class="n">'+fmt(n)+' entries in '+esc(calList()||"no list")
    + ((S.cal.find||"").trim()?' matching “'+esc(S.cal.find.trim())+'”':"")+'</span>'
    + '</div>';
}

function secCalendar(){
  const a = active();
  const noList = a.filter(e=>!e.holiday_list);
  const lists = S.holidayLists || [];
  const read = lists.filter(h=>S.holidays[h.name]);
  return '<div class="legend"><b style="font-family:var(--display)">Calendar</b>'
    + (lists.length ? '<span class="cov part">Partial</span>' : '<span class="cov none">Nothing to show</span>')
    + '<span>Holiday lists and weekly offs — the days nobody is expected in.</span></div>'

  // The month itself first, as Factor HR opens it. The panels underneath are
  // the reconciliation: what the grid is drawn from and what it is missing.
  + '<div class="calwrap">'
  + calToolbar() + calNameRow() + calGrid() + calLegend()
  + '</div>'

  + '<div class="cols">'
  + panel("Holiday lists on the site","live",
      '<div class="tiles">'
      + tile("Lists", fmt(lists.length), lists.length?"good":"warn", "")
      + tile("Assigned", fmt(a.length-noList.length), noList.length?"":"good", "active people")
      + tile("No list", fmt(noList.length), noList.length?"bad":"good", noList.length?"no weekly off at all":"everybody covered")
      + '</div>'
      + (noList.length
          ? '<div style="margin-top:.7rem">'+gap('<b>'+fmt(noList.length)+' active people have no Holiday List.</b> A person with no holiday list has no weekly off, so the shift job expects them at the gate on a Sunday and marks them absent when they do not come. It costs them the day.')+'</div>'
            + '<div style="margin-top:.7rem">'+bars(tally(noList,"company"))+'</div>'
          : '<div style="margin-top:.7rem">'+note('Everybody active has a holiday list, so nobody is expected in on their weekly off. This is the check that stops a Sunday reading as mass absence.')+'</div>'), {ico:"📅"})
  + (lists.length && !read.length
      ? panel("Dates","part", '<div class="empty">reading the holiday dates…</div>', {ico:"⏳"})
      : "")
  + read.map(h=>{
      const rows = S.holidays[h.name] || [];
      const off = rows.filter(r=>r.weekly_off).length;
      const dated = rows.filter(r=>!r.weekly_off)
        .sort((x,y)=>String(x.holiday_date).localeCompare(String(y.holiday_date)));
      return panel(h.name, "live",
        '<div class="tiles">'
        + tile("Days off", fmt(rows.length), "", "in the list")
        + tile("Weekly off", fmt(off), "", "generated")
        + tile("Named holidays", fmt(dated.length), dated.length?"":"warn", "festivals and national days")
        + '</div>'
        + (dated.length
            ? '<div class="scroll" style="margin-top:.7rem;max-height:260px;overflow-y:auto">'
              + '<table style="min-width:0"><thead><tr><th>Date</th><th>Day</th><th>Holiday</th></tr></thead><tbody>'
              + dated.map(r=>'<tr><td class="mono">'+esc(dmy(r.holiday_date))+'</td>'
                  + '<td class="muted">'+esc(dayOf(String(r.holiday_date).slice(0,10)))+'</td>'
                  + '<td>'+esc(r.description||"—")+'</td></tr>').join("")
              + '</tbody></table></div>'
            : '<div style="margin-top:.7rem">'+gap('Weekly offs only — <b>not one named holiday</b>. Factor HR&rsquo;s calendar carries the festival list, and a missing festival is a day the whole plant is marked absent.')+'</div>'),
        {ico:"🗓"});
    }).join("")

/* The month strip, the list picker and the "+ N more…" links. Bound only when
   the calendar is what just rendered — every other Employees page has none of
   these controls and querying for them would bind nothing. */
function wireCalendar(){
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };
  const step = n => {
    const [y,m]=(S.cal.month||thisMonth()).split("-").map(Number);
    const d=new Date(y, m-1+n, 1);
    S.cal.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    // A day expanded in August means nothing in September.
    S.cal.open={}; renderBody();
  };
  document.querySelectorAll("[data-cal]").forEach(b=>b.addEventListener("click",
    ()=>step(b.dataset.cal==="next"?1:-1)));
  document.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.more;
    if(S.cal.open[k]) delete S.cal.open[k]; else S.cal.open[k]=true;
    renderBody();
  }));
  on("#callist","change", e=>{ S.cal.list=e.target.value; S.cal.open={}; renderBody(); });
  on("#calgo","change",   e=>{ if(e.target.value){ S.cal.month=e.target.value; S.cal.open={}; renderBody(); } });
  on("#calfind","click",  ()=>{ S.cal.search=!S.cal.search; if(!S.cal.search) S.cal.find=""; S.calfocus=S.cal.search; renderBody(); });
  on("#calclose","click", ()=>{ S.subtab="overview"; renderSub(); renderBody(); });
  const q=$("#calq");
  if(q){
    q.addEventListener("input", ()=>{ S.cal.find=q.value; S.calfocus=true; renderBody(); });
    if(S.calfocus){ S.calfocus=false; q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  }
}

/* One row per person per day, which is what the report is. Everything it can
   answer today comes from three places: the holiday list says which days nobody
   was expected, Employee Checkin says who punched, and the shift says what they
   were measured against. Two of the three are empty on this site, so most cells
   come out as a dash — and a dash here is the report working, not failing. */
function ddaRows(){
  const f=S.dda;
  let people=scoped();
  if(f.status) people=people.filter(e=>e.status===f.status);
  if(f.emp)    people=people.filter(e=>e.name===f.emp);
  const from=f.from||monthStart(), to=f.to||monthEnd();
  if(to<from) return {rows:[], people:0, capped:0, bad:true};

  // Punches are loaded for today only — see load(). So In and Out can only ever
  // be filled for today, and the report says which day that was rather than
  // leaving a reader to wonder why one row differs.
  const punch={};
  S.checkins.forEach(c=>{
    const k=c.employee+"|"+String(c.time).slice(0,10);
    (punch[k] ||= []).push(c);
  });

  const rows=[]; let capped=0;
  const LIMIT=1500;
  people.forEach(e=>{
    const hol={};
    (S.holidays[e.holiday_list] || []).forEach(h=>{ hol[String(h.holiday_date).slice(0,10)]=h; });
    for(let d=new Date(from+"T00:00:00"); ymd(d)<=to; d.setDate(d.getDate()+1)){
      if(rows.length>=LIMIT){ capped++; continue; }
      const k=ymd(d), h=hol[k], p=(punch[e.name+"|"+k]||[]);
      const ins=p.filter(x=>x.log_type==="IN").map(x=>x.time).sort();
      const outs=p.filter(x=>x.log_type==="OUT").map(x=>x.time).sort();
      rows.push({emp:e, date:k,
        in: ins.length?String(ins[0]).slice(11,16):"",
        out: outs.length?String(outs[outs.length-1]).slice(11,16):"",
        work: (ins.length&&outs.length)?spanOf(ins[0],outs[outs.length-1]):"",
        // Weekly off and holidays are the only day status this site can state.
        // Present, Absent and Half Day are outputs of the policy engine.
        status: h ? (h.weekly_off?"Weekly Off":(h.description||"Holiday")) : "—"});
    }
  });
  return {rows, people:people.length, capped, bad:false};
}

              + '</select>'
            : "")
        + '</div>'
      + '</div>'
      + '<div class="ddafield">'
        + '<button class="ddamore" id="ddamore" aria-expanded="'+(f.more?"true":"false")+'">'
          + '<span class="lab">Additional Filters</span>'
          + '<svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></svg></button>'
        + (f.more ? '<div style="margin-top:.5rem">'+note('<b>Never seen open.</b> On our side the filters that would belong here are shift, department and whether the punch was biometric or from a phone &mdash; and only the last of those can be answered today.')+'</div>' : "")
      + '</div>'
      + '</div>';
  }

  return '<div class="fhscreen ddaform">'+html
    + (f.msg ? '<div>'+note(f.msg)+'</div>' : "")+'</div>';
}

/* The output. Grouped per person when their Show Employee Grouping chip is on,
   flat when it is taken off — which is what that chip does over there. */
function ddaReport(){
  const f=S.dda, {rows, people, capped, bad}=ddaRows();
  if(bad) return '<div class="gap" style="margin-top:.8rem"><b>The range ends before it starts.</b> Nothing to report.</div>';
  if(!rows.length) return '<div class="empty" style="margin-top:.8rem"><b>No rows</b>'
    + 'Nobody matches the filters, so there are no days to report on.</div>';

  const head='<tr>'+DDA_COLS.map(c=>'<th>'+c[0]+'</th>').join("")+'</tr>';
  const cell=(c,r)=>'<td'+(c[2]?' class="'+c[2]+'"':"")+'>'+esc(String(c[1](r)))+'</td>';
  const table=list=>'<div class="scroll"><table style="min-width:1080px"><thead>'+head+'</thead><tbody>'
    + list.map(r=>'<tr>'+DDA_COLS.map(c=>cell(c,r)).join("")+'</tr>').join("")
    + '</tbody></table></div>';
  const chunk=(list,key)=>{
    const m=new Map();
    list.forEach(r=>{ const k=key(r); const l=m.get(k)||[]; l.push(r); m.set(k,l); });
    return [...m.entries()];
  };

  // Show Employee Grouping is the chip; Filter By is the section above it. Both
  // are theirs, and they stack: department sections, people inside them.
  const body = list => f.layout.group
    ? chunk(list, r=>r.emp.name).map(([,rows2])=>{
        const e=rows2[0].emp;
        return '<div class="ddagroup"><header><b>'+esc(e.employee_name)+'</b>'
          + '<span class="mono">'+esc(e.employee_number||"—")+'</span>'
          + '<span class="muted">'+esc(tidyDept(e.department))+' · '+esc(e.company)+'</span>'
          + '<span class="n">'+fmt(rows2.length)+' days</span></header>'
          + table(rows2)+'</div>';
      }).join("")
    : table(list);

  const out = f.by
    ? chunk(rows, r=>r.emp[f.by]||"—").sort((a,b)=>String(a[0]).localeCompare(String(b[0])))
        .map(([k,list])=>'<div class="ddasection"><h4>'
          + esc((CTC_BY.find(b=>b[0]===f.by)||["",""])[1])+': '
          + esc(f.by==="department"?tidyDept(k):k)
          + '<span>'+fmt(list.length)+' rows</span></h4>'+body(list)+'</div>').join("")
    : body(rows);

  const filled=rows.filter(r=>r.in||r.out).length;
  return '<div class="ddaout">'
    + (f.layout.logo
        ? '<div class="ddalogo"><span class="mark"><span class="o">MA</span><span class="c">NN</span><span class="o">A</span></span>'
          + '<span><b>Daily Detail Attendance Report</b>'
          + longDate(f.from||monthStart())+' - '+longDate(f.to||monthEnd())
          + ($("#company").value?' · '+esc($("#company").value):' · Manna Group')+'</span></div>'
        : "")
    + '<div class="ddacount">'+fmt(rows.length)+' rows · '+fmt(people)+(people===1?" person":" people")
      + (capped?' · <b>capped</b> — '+fmt(capped)+' more not drawn, pick a person or a shorter range':"")
      + ' · '+fmt(filled)+' with a punch</div>'
    + out
    + '<div style="margin-top:.7rem">'+note('<b>Five of the fourteen columns are dashes for everybody, and they are the point.</b> Late Coming By, Early Going By and Overtime are outputs of the attendance policy engine; the two break columns are outputs of a break model nobody has specified. <b>In and Out can only be filled for today</b> — this page loads one day of punches. Day Status is the holiday list, which is the only part of a day this site can state on its own.')+'</div>'
    + '</div>';
}
