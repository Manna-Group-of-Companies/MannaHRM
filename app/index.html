<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manna HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Deliberately single-theme and light. The whole point of this build is a
   side-by-side comparison with Factor HR, which is light-only — a dark variant
   would make the two harder to compare, not easier. Every colour is therefore
   painted explicitly rather than inherited. */
:root{
  /* Manna Group. Orange and charcoal off the logo; the neutrals are warmed a
     touch towards the orange so the greys read as chosen rather than default. */
  --brand:#EE6A24; --brand-dark:#C9541A; --brand-soft:#FDF1EA;
  --char:#414042;

  --nav:#3A3A3D; --nav-2:#2E2E31; --nav-ink:#B9B7B4; --nav-ink-on:#fff;
  --page:#F4F2F0; --card:#FFFFFF; --line:#E6E2DE; --line-2:#CFC9C3;
  --ink:#26252A; --ink-2:#5C5A60; --ink-3:#918D93;
  --accent:#A8481A; --accent-wash:#FDF1EA;
  --live:#1F7A4D; --live-wash:#E4F3EB;
  /* "Partial" is the brand orange on purpose — work in progress is the most
     common state on this page, and it is the one that should look like Manna. */
  --part:#A8481A; --part-wash:#FDF1EA;
  --none:#A32F27; --none-wash:#FAE7E5;
  --skip:#6E6A70; --skip-wash:#EFECEA;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

/* ---------------- chrome: sidebar + top bar, mirroring Factor HR ---------- */
.shell{display:grid;grid-template-columns:112px 1fr;min-height:100vh}
.side{background:var(--nav);display:flex;flex-direction:column;gap:.1rem;padding:.5rem 0 1rem;position:sticky;top:0;height:100vh;overflow-y:auto}
/* The wordmark, rebuilt in type rather than shipped as a file: MA orange,
   NN charcoal, A orange, inside the oval. Scales cleanly and needs no asset.
   Drop the real PNG in as app/logo.png and swap this for an <img> if preferred. */
.brand{padding:1rem .35rem 1.15rem;text-align:center;line-height:1}
.mark{display:inline-flex;align-items:center;justify-content:center;
  border:2.5px solid var(--nav-ink);border-radius:50%;
  padding:.34rem .5rem;font-family:var(--display);font-weight:700;
  font-size:1.02rem;letter-spacing:-.02em}
.mark .o{color:var(--brand)}
.mark .c{color:#fff}
.brand small{display:block;font-family:var(--display);font-weight:600;font-size:.66rem;
  letter-spacing:.02em;color:var(--nav-ink);margin-top:.34rem}
.nav{background:none;border:0;color:var(--nav-ink);font-family:var(--body);font-size:.74rem;padding:.62rem .3rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.28rem;width:100%;border-left:3px solid transparent}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav[aria-current="page"]{color:#fff;background:rgba(238,106,36,.14);border-left-color:var(--brand);font-weight:600}
.nav:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.nav .pip{position:absolute;margin:-.5rem 0 0 1.6rem;width:7px;height:7px;border-radius:50%;background:var(--none)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--char);color:#fff;padding:.7rem 1.2rem;display:flex;flex-wrap:wrap;gap:.7rem 1.2rem;align-items:center;justify-content:space-between}
.topbar .co{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:.01em}
.topbar select,.topbar input{font-family:var(--body);font-size:.85rem;padding:.4rem .6rem;border-radius:20px;border:0;background:rgba(255,255,255,.95);color:var(--ink);min-width:190px}
.topbar .me{font-size:.85rem;opacity:.95}
.subbar{background:var(--nav-2);padding:0 1.2rem;display:flex;flex-wrap:wrap;gap:.2rem}
.subtab{background:none;border:0;color:var(--nav-ink);font-family:var(--body);font-size:.79rem;letter-spacing:.08em;text-transform:uppercase;padding:.72rem .95rem;cursor:pointer;border-bottom:3px solid transparent}
.subtab[aria-selected="true"]{color:#fff;background:var(--page);color:var(--ink);font-weight:600;border-radius:5px 5px 0 0}
.content{padding:1.1rem 1.2rem 2.5rem;display:flex;flex-direction:column;gap:1rem}

/* ---------------------------------------------------------- coverage ----- */
.legend{display:flex;flex-wrap:wrap;gap:.45rem .9rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.55rem .8rem;font-size:.8rem;color:var(--ink-2)}
.cov{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:.18rem .44rem;border-radius:3px;white-space:nowrap}
.cov.live{background:var(--live-wash);color:var(--live)}
.cov.part{background:var(--part-wash);color:var(--part)}
.cov.none{background:var(--none-wash);color:var(--none)}
.cov.skip{background:var(--skip-wash);color:var(--skip)}

/* ------------------------------------------------------------- cards ----- */
.cols{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.panel > header{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;justify-content:space-between;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.panel > header h3{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.panel > header h3 .ico{width:26px;height:26px;border-radius:7px;background:var(--brand-soft);color:var(--brand-dark);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.panel .body{padding:.9rem}
.panel.dim .body{opacity:.72}

.tiles{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.tile{border:1px solid var(--line);border-radius:6px;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.15rem}
.tile .k{font-family:var(--mono);font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tile .n{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .n.good{color:var(--live)} .tile .n.warn{color:var(--part)} .tile .n.bad{color:var(--none)}
.tile .s{font-size:.76rem;color:var(--ink-2)}

.links{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .9rem;font-size:.86rem}
.links a,.links span{color:var(--accent);text-decoration:none}
.links span.off{color:var(--ink-3);text-decoration:line-through}

.gap{background:var(--none-wash);border:1px solid #F0CFCB;border-radius:5px;padding:.6rem .75rem;font-size:.85rem;color:#7C241D}
.gap b{font-family:var(--display)}
.note{background:var(--brand-soft);border:1px solid #F3D9C6;border-radius:5px;padding:.6rem .75rem;font-size:.85rem;color:#7A3D14}
.note b{font-family:var(--display)}

.rows{display:flex;flex-direction:column;gap:.45rem}
.row{display:grid;grid-template-columns:1fr auto;gap:.15rem .7rem;align-items:center;font-size:.86rem}
.row .val{font-family:var(--mono);font-size:.83rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:6px;border-radius:4px;background:#EDE8E4;overflow:hidden}
.track i{display:block;height:100%;background:var(--brand);border-radius:4px}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.85rem}
th,td{text-align:left;padding:.48rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:#FAF8F6;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAF8F6}
td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr[data-emp]{cursor:pointer}
.muted{color:var(--ink-3)}

.tag{font-family:var(--mono);font-size:.61rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.14rem .38rem;border-radius:3px;background:var(--accent-wash);color:var(--accent)}
.tag.warn{background:var(--part-wash);color:var(--part)}

.empty{padding:1.3rem .9rem;text-align:center;color:var(--ink-2);font-size:.88rem;background:#FAF8F6;border:1px dashed var(--line-2);border-radius:6px}
.empty b{display:block;font-family:var(--display);color:var(--ink);margin-bottom:.2rem}
/* ------------------------------------------------- Employee Master ------- */
/* Factor HR's own Employee Master, card for card. Kept close to that screen
   deliberately: it is the page HR opens most, and asking somebody whether the
   replacement is better is only a fair question if the two look alike enough to
   compare. The list view behind the toggle is the one built here first, and it
   stays because 161 cards is a scroll and 161 rows is a glance. */
.emhead{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .9rem}
.emhead h2{font-family:var(--display);font-size:1.05rem;font-weight:700}
.emhead .n{font-size:.83rem;color:var(--ink-2)}
.emhead .right{margin-left:auto;display:flex;gap:.4rem;align-items:center}

.embar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.55rem .7rem}
.embar select,.embar input{font:inherit;font-size:.83rem;padding:.34rem .5rem;border:1px solid var(--line-2);border-radius:5px;background:#fff;color:var(--ink)}
.embar .find{flex:1 1 220px;display:flex;align-items:center;gap:.4rem;min-width:0}
.embar .find input{flex:1 1 auto;min-width:0}
.embtn{font:inherit;font-size:.83rem;padding:.34rem .6rem;border:1px solid var(--line-2);border-radius:5px;background:#fff;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.embtn:hover:not([disabled]){border-color:var(--brand);color:var(--brand-dark)}
.embtn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark)}
.embtn[disabled]{opacity:.45;cursor:not-allowed}
.embtn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.emview{margin-left:auto;display:flex;gap:.25rem}
.emview .embtn{padding:.3rem .45rem}
.emview svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px;background:var(--ink-3)}
.sdot.on{background:var(--live)} .sdot.off{background:var(--none)}
/* Factor HR's own blue for All. Not from the Manna palette on purpose: this one
   control is a straight copy of theirs, and on it the colour is the thing being
   read — somebody picking a filter looks at the dot, not at the word. */
.sdot.all{background:#2E6BD1}
.empdrop{position:relative;display:inline-flex}
.empdrop .cx{font-size:.58rem;color:var(--ink-3);line-height:1}
.emmenu{position:absolute;top:calc(100% + .3rem);left:0;z-index:20;min-width:158px;background:var(--card);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 4px 14px rgba(65,64,66,.16);padding:.25rem;display:flex;flex-direction:column}
.emmenu[hidden]{display:none}
.emmenu button{font:inherit;font-size:.83rem;text-align:left;background:none;border:0;border-radius:4px;padding:.42rem .55rem;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:.55rem}
.emmenu button:hover{background:var(--page)}
.emmenu button[aria-selected="true"]{font-weight:600}
.emmenu button.zero{color:var(--ink-3)}
.emmenu button.zero .sdot{opacity:.45}

/* Employee Detail's criteria form reuses the report vocabulary above —
   .repform, .repset, .repgrid, .repacts — so the two report screens in this app
   are one idiom rather than two. Only these are new: fourteen tick boxes do not
   fit a two-column grid, and a form this size needs a disabled state. */
/* The Monthly Basic toolbar: a row of controls each under its own uppercase
   micro-label, which is how Factor HR labels a report toolbar as against the
   left-aligned labels it uses inside one. */
.mbbar{display:flex;flex-wrap:wrap;gap:.6rem .9rem;align-items:flex-end;margin-bottom:.85rem}
.mbf{display:flex;flex-direction:column;gap:.24rem;min-width:0}
.mbf > span{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mbf select,.mbf input{font:inherit;font-size:.84rem;padding:.34rem .5rem;border:1px solid var(--line-2);
  border-radius:4px;background:#fff;color:var(--ink)}
.mbf .grow{min-width:210px}
.taglist{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;border:1px solid var(--line-2);
  border-radius:4px;padding:.32rem .45rem;background:#fff;min-height:2rem}
.taglist .t{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;padding:.16rem .45rem;
  border-radius:3px;background:var(--brand-soft);color:var(--brand-dark)}
.taglist .t button{border:0;background:none;color:inherit;cursor:pointer;font:inherit;line-height:1;padding:0}
.taglist .add{font:inherit;font-size:.8rem;color:var(--accent);background:none;border:0;cursor:pointer}
.taglist .add:hover{text-decoration:underline}
.dtbar{display:flex;flex-wrap:wrap;gap:.45rem .9rem;align-items:center;justify-content:space-between;
  font-size:.83rem;color:var(--ink-2)}
.dtbar select,.dtbar input{font:inherit;font-size:.83rem;padding:.24rem .4rem;border:1px solid var(--line-2);
  border-radius:4px;background:#fff;color:var(--ink)}
.dtbar .pager{display:flex;gap:.3rem}
.dtbar .pager button{font:inherit;font-size:.8rem;padding:.28rem .7rem;border:1px solid var(--line-2);
  border-radius:4px;background:#fff;color:var(--ink-2)}
.repchecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(218px,1fr));gap:.34rem .9rem;
  margin-top:.95rem;padding-top:.85rem;border-top:1px solid var(--line)}
.repform label.chk.off{color:var(--ink-3);cursor:not-allowed}
.repgrid > label.off{color:var(--ink-3)}
.repform input:disabled,.repform select:disabled{background:var(--page);color:var(--ink-3);cursor:not-allowed}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost[disabled]:hover{border-color:var(--line-2)}
.emmenu button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}

.cards{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ecard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.85rem .9rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.9rem;align-items:center;cursor:pointer}
.ecard:hover{border-color:var(--brand);box-shadow:0 1px 7px rgba(65,64,66,.07)}
.ecard:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ava{width:74px;height:74px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.45rem;font-weight:700}
.ename{display:flex;align-items:baseline;gap:.5rem;font-weight:600;font-size:.92rem}
.ename span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ename .go{margin-left:auto;color:var(--ink-3);font-size:1rem;line-height:1}
.ecard:hover .ename .go{color:var(--brand)}
.estat{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--ink-2);margin:.2rem 0 .45rem}
.eline{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--accent);padding:.1rem 0}
.eline svg{width:14px;height:14px;flex:0 0 14px;stroke:var(--ink-3);fill:none;stroke-width:1.6}
.eline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eline.off{color:var(--ink-3)}

/* ---- Category Type, as Factor HR draws it -------------------------------
   Their Categories page is a plain paginated master: title bar, search, table,
   pager. Copied close for the same reason Employee Master is — a comparison is
   only fair if the two screens look alike enough to hold side by side — but
   every control on it here is dead, because that one writes and this one
   reads. The one live control is View Category, which is the only thing on the
   screen a read-only window can honestly answer. */
.fhcat{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fhcat>header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.65rem .9rem;border-bottom:1px solid var(--line)}
.fhcat>header h3{font-family:var(--display);font-size:.98rem;font-weight:700}
.fhcat>header .right{margin-left:auto;display:flex;gap:.4rem;align-items:center}
.fhcat .embtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.fhcat .find{padding:.6rem .9rem;border-bottom:1px solid var(--line)}
.fhcat .find input{font:inherit;font-size:.83rem;padding:.4rem .6rem;border:1px solid var(--line-2);border-radius:5px;background:#fff;width:min(320px,100%)}
.fhcat table{min-width:620px}
.fhcat td.act{text-align:right}
.fhact{border:0;background:none;padding:.15rem .25rem;color:var(--ink-3);cursor:not-allowed}
.fhact svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fhview{font:inherit;font-size:.8rem;padding:.3rem .7rem;border:1px solid var(--brand);border-radius:5px;background:#fff;color:var(--brand-dark);cursor:pointer}
.fhview:hover{background:var(--brand-soft)}
.fhview[aria-expanded="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.fhview:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.fhcat tr.vals>td{background:#FAF8F6;white-space:normal;padding:.75rem .9rem}
.fhcat tr.vals .lead{font-size:.85rem;color:var(--ink-2);margin-bottom:.6rem}
.fhcat tr.vals .lead b{font-family:var(--display);color:var(--ink)}
.fhfoot{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem .9rem;border-top:1px solid var(--line)}
.fhcat .cnt{font-size:.8rem;color:var(--ink-3)}
.fhpage{margin-left:auto;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.fhpage .embtn{padding:.26rem .55rem;font-size:.8rem}

/* SHIFT & WORK PATTERN reuses the Category Type shell — same product, same
   kind of master, a different toolbar. */
.fhcat h3.caps{letter-spacing:.04em;font-size:.9rem}
.fhcat .bar3{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.6rem .9rem;border-bottom:1px solid var(--line)}
.fhcat .lbl{font-size:.83rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:.4rem}
.fhcat .lbl.mid{margin-left:auto}
.fhcat .lbl.right{margin-left:auto}
.fhcat .bar3 select,.fhcat .bar3 input{font:inherit;font-size:.83rem;padding:.3rem .5rem;border:1px solid var(--line-2);border-radius:5px;background:#fff;color:var(--ink)}
.fhcat th .sort{color:var(--ink-3);font-weight:400;font-size:.75rem}
.fhcat th.num,.fhcat td.num{text-align:right}
.fhcat td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.fhcat td.num.zero,.fhcat td.num.clip{color:var(--ink-3)}
/* Their shift names are links. Ours are not, because there is nothing behind
   them on this side — but a name that reads as plain text loses the fact that
   one click over there is what answers the open question on this page. */
.fhname{color:var(--accent);border-bottom:1px dotted var(--line-2)}
.fhcat tr.clip>td{opacity:.5}

/* The rendered letter. Serif and generous leading on purpose — it is a document
   somebody will print and hand over, not another panel of data. */
.letter{margin-top:.7rem;background:#fff;border:1px solid var(--line);border-radius:5px;
  padding:1.4rem 1.6rem;font-family:Georgia,"Times New Roman",serif;font-size:.9rem;
  line-height:1.65;max-height:520px;overflow:auto}
.letter p{margin:0 0 .7rem}
.letter h3{font-family:Georgia,serif;font-size:1rem;margin:0 0 .7rem;text-align:center;letter-spacing:.02em}
.letter table{border-collapse:collapse;margin:0 0 .7rem;min-width:0;width:auto;font-size:.88rem}
.letter td{border:0;padding:.1rem .9rem .1rem 0;white-space:normal}
.letter table[border]{border:1px solid var(--line-2)}
.letter table[border] td{border:1px solid var(--line-2);padding:.25rem .5rem}
/* Unresolved merge fields are shown, never blanked. */
.tok{background:var(--none-wash);color:var(--none);border-radius:3px;padding:0 .22em;
  font-family:var(--mono);font-size:.82em;white-space:nowrap}

.tabs{display:flex;flex-wrap:wrap;gap:.4rem}
.tab{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:.34rem .68rem;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink-2);cursor:pointer;display:inline-flex;gap:.4rem;align-items:center}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.tab .n{font-weight:600;font-variant-numeric:tabular-nums}
.tab .n.hot{color:var(--none)}

.person{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:.6rem}
.person .who{display:flex;flex-wrap:wrap;gap:.3rem .7rem;align-items:baseline;padding:.55rem .85rem;background:#FAF8F6;border-bottom:1px solid var(--line)}
.person .who b{font-family:var(--display);font-size:.93rem}
.person .who .code{font-family:var(--mono);font-size:.74rem;color:var(--ink-3)}
.req{display:grid;grid-template-columns:minmax(150px,190px) minmax(190px,230px) 1fr auto;gap:.35rem 1rem;padding:.65rem .85rem;border-bottom:1px solid var(--line);align-items:start}
.req:last-child{border-bottom:0}
.req .when b{display:block;font-family:var(--display);font-size:.9rem}
.req .when span{display:block;font-size:.77rem;color:var(--ink-3)}
.req dl{margin:0;display:grid;grid-template-columns:auto auto auto;gap:.12rem .8rem;font-size:.8rem;font-family:var(--mono);font-variant-numeric:tabular-nums}
.req dl .h{color:var(--ink-3);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em}
.req dl .lab{color:var(--ink-3)}
.req .why{font-size:.84rem;color:var(--ink-2)}
.req .why b{color:var(--ink);font-weight:600}
@media (max-width:820px){.req{grid-template-columns:1fr}.shell{grid-template-columns:84px 1fr}}

/* ---- the approval queue, laid out as Factor HR lays it out --------------
   Toolbar, then a card per request under a per-person heading. The card is
   copied deliberately closely: an approver comparing the two screens should
   not have to hunt for the same number in a different place. */
.qbar{display:flex;flex-wrap:wrap;gap:.5rem .6rem;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem;margin:.6rem 0 .8rem}
.qbar select,.qbar input{font-family:var(--body);font-size:.83rem;padding:.36rem .55rem;
  border:1px solid var(--line-2);border-radius:4px;background:#fff;color:var(--ink)}
.qbar input[type=search]{flex:1 1 210px;min-width:160px}
.qbar .icon{width:30px;height:30px;border:1px solid var(--line-2);border-radius:4px;background:#fff;
  color:var(--ink-2);cursor:pointer;font-size:.95rem;line-height:1}
.qbar .icon:hover{color:var(--accent);border-color:var(--accent)}
.qbar .picked{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);margin-left:auto}
.qbar .picked b{color:var(--accent);font-family:var(--mono)}

.reqhead{display:flex;flex-wrap:wrap;gap:.2rem .9rem;justify-content:space-between;align-items:baseline;
  background:#F1EEEC;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:.34rem .85rem;font-size:.76rem}
.reqhead .kind{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600}
.reqhead .meta{color:var(--accent);font-size:.74rem}
.reqhead .meta .muted{color:var(--ink-3)}

/* Six columns, in Factor HR's order: pick · day · planned vs attended ·
   hours · what the correction asks for · decide. */
.reqx{display:grid;gap:.45rem 1rem;padding:.7rem .85rem;align-items:start;
  grid-template-columns:auto minmax(130px,160px) minmax(175px,205px) minmax(165px,1fr) minmax(180px,1.1fr) auto}
.reqx .day b{display:block;font-family:var(--display);font-size:.95rem}
.reqx .day span{display:block;font-size:.79rem;color:var(--ink-2)}
.reqx .day .applied{margin-top:.3rem;font-size:.75rem;color:var(--ink-3)}
/* The shift sits under the Planned | Attended pair, not in a row of its own —
   otherwise it pushes the hours and the ask down and leaves the card's top
   right empty, which is not how Factor HR reads. */
.reqx .shift{margin-top:.4rem;font-size:.76rem;color:var(--accent);white-space:normal}
.pa{display:grid;grid-template-columns:auto 1fr 1fr;gap:.14rem .6rem;font-size:.82rem;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.pa .h{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.pa .lab{color:var(--ink-3)}
.pa .att{color:var(--ink);font-weight:600}
.hrs,.ask{font-size:.81rem;color:var(--ink-2)}
.hrs b,.ask b{color:var(--ink);font-weight:600;font-family:var(--body)}
.hrs .link,.act .link{display:inline-block;margin-top:.25rem;font-size:.79rem;color:var(--accent);
  text-decoration:underline;cursor:help}
.act{display:flex;flex-direction:column;align-items:center;gap:.35rem}
.yn{display:flex;gap:.45rem}
.yn button{width:27px;height:27px;border-radius:50%;background:#fff;border:1.6px solid;line-height:1;
  font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.yn .ok{border-color:var(--live);color:var(--live)}
.yn .no{border-color:var(--none);color:var(--none)}
/* Enabled on purpose: a control that reports itself disabled never fires,
   so a screen-reader user would get silence instead of the reason. */
.yn button{cursor:pointer}
.yn .ok:hover{background:var(--live-wash)} .yn .no:hover{background:var(--none-wash)}
@media (max-width:1100px){.reqx{grid-template-columns:auto 1fr}}

/* Import / Export opens a dialog in Factor HR rather than acting at once, and
   that is worth copying: two of its three buttons are harmless and one of them
   overwrites attendance. A menu item that exports on click is one slip away
   from a menu item that imports on click. */
.modal{position:fixed;inset:0;background:rgba(38,37,42,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:5vh 1rem;z-index:50}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:6px;
  width:min(560px,100%);box-shadow:0 18px 44px rgba(0,0,0,.24)}
/* The log carries a table, and a table in a 560px box is a table nobody reads. */
.modal .box.wide{width:min(900px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.modal header h3{font-size:1.02rem}
.modal .x{background:none;border:0;font-size:1.2rem;line-height:1;color:var(--ink-3);cursor:pointer;padding:.1rem .3rem}
.modal .x:hover{color:var(--ink)}
.modal .acts{display:flex;flex-wrap:wrap;gap:.7rem;padding:1.1rem 1rem .9rem}
.modal .why{padding:0 1rem .9rem;font-size:.84rem;color:var(--ink-2)}
.modal .why b{color:var(--ink)}
.modal .foot{padding:.7rem 1rem;border-top:1px solid var(--line)}
.btn{font-family:var(--body);font-size:.87rem;font-weight:600;padding:.5rem .9rem;border-radius:4px;
  border:1px solid transparent;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem}
.btn.go{background:var(--live)} .btn.tpl{background:var(--brand)} .btn.imp{background:var(--char)}
.btn.go:hover{background:#19643E} .btn.tpl:hover{background:var(--brand-dark)} .btn.imp:hover{background:#2E2E31}
.btn.ghost{background:#fff;color:var(--accent);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--accent)}

/* The Other queue is a grid, not a stack of cards — because Factor HR's is.
   The two screens look different there because they are used differently, and
   an approver moving between the systems should recognise which one they are
   on before they read a word of it. */
.gbar{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0 .55rem}
.gbtn{font-family:var(--body);font-size:.82rem;padding:.4rem .72rem;border:1px solid var(--line-2);
  border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;gap:.42rem;align-items:center}
.gbtn:hover{border-color:var(--accent);color:var(--accent)}
.gfil{display:flex;flex-wrap:wrap;gap:.45rem 1.4rem;align-items:center;margin-bottom:.6rem;
  font-size:.83rem;color:var(--ink-2)}
.gfil label{display:inline-flex;gap:.45rem;align-items:center}
.gfil select{font-family:var(--body);font-size:.83rem;padding:.32rem .5rem;border:1px solid var(--line-2);
  border-radius:4px;background:#fff;color:var(--ink);min-width:170px}
table.grid th{vertical-align:top}
table.grid td,table.grid th{white-space:nowrap}
table.grid tr.fil th{padding-top:0;background:#FAF8F6}
table.grid tr.fil input{width:100%;min-width:90px;font-family:var(--body);font-size:.8rem;
  padding:.26rem .4rem;border:1px solid var(--line-2);border-radius:3px;background:#fff}
table.grid select{font-family:var(--body);font-size:.8rem;padding:.24rem .35rem;
  border:1px solid var(--line-2);border-radius:3px;background:#fff}
table.grid td.desc{white-space:normal;min-width:260px}

/* The muster grid on Monthly Basic Attendance. Thirty-one day columns, so the
   padding that suits a data table would push half the month off the screen. */
table.muster th.d,table.muster td.d{padding:.3rem .22rem;text-align:center;
  font-family:var(--mono);font-size:.7rem}
table.muster th.d small{display:block;font-size:.56rem;font-weight:400;color:var(--ink-3)}
table.muster td.d.wo{background:var(--skip-wash);color:var(--skip);font-weight:600}
table.muster td.d.non{color:var(--line-2)}
table.muster td.pay{font-family:var(--mono);text-align:right;color:var(--ink-3)}

/* The CTC / Earnings report form, laid out as Factor HR lays it out: labels
   right-aligned in a narrow column, controls in a wide one, the buttons in a
   row across the bottom. Copied closely on purpose — somebody comparing the
   two screens should not have to hunt for the same control in another place. */
.repbar{display:flex;justify-content:flex-end;margin-bottom:.55rem}
.repform{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.95rem 1.1rem}
.repset{border:1px solid var(--line-2);border-radius:5px;padding:.2rem .85rem .7rem;
  margin:0 0 .85rem;max-width:440px}
.repset legend{font-size:.79rem;color:var(--ink-2);padding:0 .32rem}
.repgrid{display:grid;grid-template-columns:auto 1fr;gap:.55rem .75rem;align-items:center}
.repgrid > label{text-align:right;font-size:.86rem;color:var(--ink-2);white-space:nowrap}
.repgrid .ctl{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;font-size:.84rem;color:var(--ink-2)}
.repform input,.repform select{font-family:var(--body);font-size:.84rem;padding:.34rem .5rem;
  border:1px solid var(--line-2);border-radius:3px;background:#fff;color:var(--ink)}
.repform input:focus,.repform select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.repform .wide{min-width:236px}
.repform .hint{font-size:.79rem;color:var(--ink-3)}
.repform label.chk{display:inline-flex;gap:.38rem;align-items:center;text-align:left;
  font-size:.84rem;color:var(--ink-2);white-space:nowrap}
.repform .dots{padding:.3rem .5rem;border:1px solid var(--line-2);border-radius:3px;
  background:#fff;color:var(--ink-2);cursor:pointer;font-family:var(--mono);line-height:1}
.repform .dots:hover{border-color:var(--accent);color:var(--accent)}
.repacts{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem;
  padding-top:.9rem;border-top:1px solid var(--line)}
.repmore{margin-top:.85rem;font-size:.84rem;color:var(--ink-2)}
.repmore summary{cursor:pointer;color:var(--accent);font-size:.83rem}
.repmore .body{padding:.5rem 0 0 1rem}
table.ctc td.n,table.ctc th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.ctc tr.grp td{background:#F1EEEC;font-weight:600}
table.ctc tr.tot td{background:#FAF8F6;font-weight:700;border-top:2px solid var(--line-2)}

/* IN / OUT ACTIVITY REPORT — Factor HR's newer report chrome: uppercase field
   labels above boxed controls, a criteria tab strip beneath them, the primary
   action on the right. Their palette is blue and ours stays Manna orange: a
   screenshot comparison is about where a control is and what it does, not what
   colour somebody's framework paints it. */
.iotop{display:flex;flex-wrap:wrap;gap:.75rem .95rem;align-items:flex-end;padding:.85rem .9rem}
.iof{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.iof>.lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.iof>.ctl{display:flex;align-items:center;gap:.35rem}
.iof input,.iof select{font:inherit;font-size:.83rem;padding:.36rem .5rem;
  border:1px solid var(--line-2);border-radius:5px;background:#fff;color:var(--ink)}
.iof input:focus,.iof select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.iof .grow{min-width:206px}
.iotop .right{margin-left:auto;display:flex;align-items:flex-end;gap:.4rem}
.iotop .embtn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.iotop .embtn.pri:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.iotabs{display:flex;gap:1.35rem;padding:0 .9rem;border-bottom:1px solid var(--line)}
.iotab{font:inherit;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;background:none;
  border:0;border-bottom:2px solid transparent;padding:.55rem .1rem;color:var(--ink-3);cursor:pointer}
.iotab[aria-selected="true"]{color:var(--brand-dark);border-bottom-color:var(--brand);font-weight:600}
.iotab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.iobody{padding:.95rem .9rem 1rem}
.iorow{display:flex;flex-wrap:wrap;gap:.85rem 1.5rem;align-items:flex-end;margin-bottom:.95rem}
.iorow:last-child{margin-bottom:0}
.chipbox{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;border:1px solid var(--line-2);
  border-radius:5px;background:#fff;padding:.4rem .5rem;min-height:37px;width:min(620px,100%)}
.chip{display:inline-flex;align-items:center;gap:.45rem;background:var(--page);border:1px solid var(--line);
  border-radius:4px;padding:.2rem .32rem .2rem .5rem;font-size:.82rem}
.chip button{font:inherit;background:none;border:0;color:var(--ink-3);cursor:pointer;line-height:1;padding:0 .12rem}
.chip button:hover{color:var(--none)}
.iofun{display:inline-flex;align-items:center;gap:.5rem;background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.iofun svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round}
.iofun:hover,.iofun[aria-expanded="true"]{color:var(--brand-dark)}
/* The statutory panel is the older Factor HR form again, so it reuses the CTC
   form's classes. Only the period radios and the year spinner are new. */
.repradio{display:flex;gap:2.2rem;justify-content:center;margin:.2rem 0 1.1rem;font-size:.88rem;color:var(--ink-2)}
.repradio label{display:inline-flex;gap:.42rem;align-items:center;cursor:pointer}
.repform input[type=number]{width:96px}
table.sr th.gapcol,table.sr td.gapcol{background:#FDF6F5;color:var(--none)}
table.sr td.gapcol{font-family:var(--mono);font-size:.78rem}

table.io tr.grp td{background:#F1EEEC;font-weight:600}
table.io td.sel{color:var(--ink-3)}
.nopend{padding:1.1rem .9rem;color:var(--ink-2);font-size:.9rem;background:#FAF8F6;
  border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px}

.status{font-family:var(--mono);font-size:.72rem;display:inline-flex;align-items:center;gap:.4rem}
.dot{width:8px;height:8px;border-radius:50%;background:#B5B0AC;display:inline-block}
.dot.live{background:#5BD48D} .dot.bad{background:#FF8A7E}
.tab[aria-selected="true"]{border-color:var(--brand)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.85em;background:#F4F2F0;border:1px solid var(--line);border-radius:3px;padding:.05em .3em}

/* --------------------------------------- Employees, the calendar screen -- */
/* Factor HR's calendar, laid out as it lays it out: toolbar, the calendar name
   beside its default flag, a month strip with the arrows in the middle, then
   six weeks with the week number down the gutter and the day number in the
   corner. Their layout, this build's palette — copying their navy as well would
   make the two harder to compare rather than easier. */
.calwrap{display:flex;flex-direction:column;gap:.5rem}
.calbar .cico{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:50%;font-size:.62rem;line-height:1;color:#fff;background:var(--ink-3)}
.calbar .cico.new{background:var(--live)} .calbar .cico.edit{background:var(--accent)}
.calbar .cico.delete{background:var(--none)} .calbar .cico.close{background:var(--skip)}
.calname{gap:.5rem .9rem}
.calname label{font-size:.83rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:.4rem}
.calname .n{font-size:.79rem;color:var(--ink-3)}
.calname .calgo{margin-left:auto;color:var(--accent)}
.calname input[type=month]{font:inherit;font-size:.82rem;padding:.3rem .45rem;
  border:1px solid var(--line-2);border-radius:5px;background:#fff;color:var(--ink)}
.caldef input{accent-color:var(--brand);width:15px;height:15px}

/* The month strip. Factor HR puts nothing but the arrows here — the month is
   named in the first cell of the grid — but a strip that does not say which
   month it is showing is a strip somebody misreads, so the name goes between. */
.calstrip{background:var(--char);border-radius:6px 6px 0 0;padding:.42rem .7rem;
  display:flex;align-items:center;justify-content:center;gap:.9rem}
.calmonth{font-family:var(--display);font-weight:600;font-size:.92rem;color:#fff;
  min-width:11rem;text-align:center}
.calnav{background:rgba(255,255,255,.12);border:0;border-radius:4px;color:#fff;cursor:pointer;
  font-size:.8rem;line-height:1;padding:.34rem .6rem}
.calnav:hover{background:var(--brand)}

.calgrid{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));
  background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;overflow:hidden}
.calgrid .dow{background:#FAF8F6;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  padding:.4rem .3rem;text-align:center;font-family:var(--mono);font-size:.64rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.calgrid .wk{background:#FAF8F6;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:.3rem;font-family:var(--mono);font-size:.6rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.calgrid .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  min-height:78px;padding:.28rem .35rem;display:flex;flex-direction:column;gap:.16rem}
/* The days either side of the month are greyed rather than blanked, as they are
   over there: a punch on the 31st of last month is still somebody's day. */
.calgrid .cell.out{background:#F7F5F3}
.calgrid .cell.out .num{color:var(--ink-3)}
.calgrid .cell.today{background:#FDF3E2;box-shadow:inset 0 0 0 1px var(--brand)}
.calgrid .cell.today .num{color:var(--brand-dark);font-weight:600}
.calgrid .num{align-self:flex-end;font-family:var(--mono);font-size:.7rem;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ev{font-size:.72rem;line-height:1.25;border-radius:3px;padding:.08rem .3rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.hol{background:var(--live-wash);color:var(--live)}
.ev.off{background:var(--skip-wash);color:var(--skip)}
.ev.join{background:var(--brand-soft);color:var(--brand-dark)}
.more{background:none;border:0;padding:0;font:inherit;font-size:.72rem;color:var(--accent);
  cursor:pointer;text-align:left}
.more:hover{text-decoration:underline}
.callegend{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;font-size:.8rem}
.callegend .n{color:var(--ink-3);margin-left:auto;font-family:var(--mono);font-size:.74rem}
.callegend .ev{white-space:nowrap}

/* ------------------------------ Attendance, the regularization screen ---- */
/* Factor HR's screen as photographed: the title with a rule under it, one bar
   of controls, and nothing at all beneath until a person is picked. Their
   layout, this build's palette. */
.fhscreen{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
.fhtitle{font-family:var(--display);font-weight:700;font-size:.86rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.regbar{gap:.45rem .55rem}
.regbar .cyc{display:inline-flex;align-items:center;gap:.4rem;font-size:.83rem;color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:5px;padding:.24rem .5rem;background:#fff}
.regbar .cyc select{border:0;padding:.1rem .2rem;font-size:.83rem}
/* Their search box puts the magnifier on the right, not the left. */
.embar .find.rev{flex-direction:row-reverse}
.regicons{display:inline-flex;gap:.3rem;margin-left:auto}
.regicons .ic{padding:.3rem .45rem}

.regfind{background:var(--card);border:1px solid var(--line-2);border-radius:6px;
  box-shadow:0 4px 14px rgba(65,64,66,.1);padding:.25rem;display:flex;flex-direction:column}
.regfind button{font:inherit;font-size:.85rem;text-align:left;background:none;border:0;border-radius:4px;
  padding:.4rem .55rem;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:.6rem}
.regfind button:hover{background:var(--page)}
.regfind .mono{font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.regfind .muted{margin-left:auto;font-size:.8rem}
.regfind .none{padding:.55rem;font-size:.84rem;color:var(--ink-3)}

/* The screen with nobody chosen, which is how it opens. */
.regnone{padding:2.1rem .9rem;text-align:center;background:var(--card);
  border:1px solid var(--line);border-radius:6px}
.regnone b{display:block;font-family:var(--display);font-size:1rem;color:var(--ink);margin-bottom:.25rem}
.regnone span{font-size:.85rem;color:var(--ink-3)}

.regwho{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:.55rem .8rem;font-size:.88rem}
.regwho .mono{font-family:var(--mono);font-size:.8rem;color:var(--ink-2)}

/* ------------------------- Attendance, the Daily Detail report panel ----- */

   chips, and the Additional Filters funnel. Their layout, this build's palette

.ddaform{gap:.7rem}

.ddabar select{font:inherit;font-size:.84rem;padding:.34rem .5rem;border:1px solid var(--line-2);

.ddatabs{display:flex;gap:1.2rem;border-bottom:1px solid var(--line)}

.ddafield .chips select{font:inherit;font-size:.8rem;border:1px dashed var(--line-2);border-radius:3px;
  background:none;color:var(--ink-3);padding:.14rem .3rem}

  cursor:pointer;color:var(--ink-3);width:fit-content}

.ddaout{display:flex;flex-direction:column;gap:.6rem;margin-top:.85rem}
.ddalogo{display:flex;align-items:center;gap:.8rem;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:.6rem .9rem;font-size:.82rem;color:var(--ink-2)}
.ddalogo .mark{border-color:var(--char);padding:.26rem .42rem;font-size:.86rem}

  padding:.5rem .8rem;border-bottom:1px solid var(--line);font-size:.86rem}
.ddagroup > header b{font-family:var(--display)}
.ddagroup > header .mono{font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}

<body>
<div class="shell">

  <aside class="side">
    <div class="brand"><span class="mark"><span class="o">MA</span><span class="c">NN</span><span class="o">A</span></span><small>HR</small></div>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="co" id="cotitle">MANNA GROUP</span>
      <select id="company" aria-label="Company"><option value="">All companies</option></select>
      <input type="search" id="q" placeholder="Search name, code, designation…" aria-label="Search">
      <span class="me">Hi admin &nbsp;·&nbsp; <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span></span>
    </div>
    <div class="subbar" id="subbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => (n == null ? "—" : Number(n).toLocaleString());
const DAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const clock = v => (v ? String(v).slice(11,16) : "—");
/* Dates on an approval card are written as Factor HR writes them — 19-Aug-2026.
   Two systems being compared side by side should not differ in their date
   format as well as their contents. */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dmy = v => {
  const p = String(v==null?"":v).slice(0,10).split("-");
  return (p.length===3 && MON[+p[1]-1]) ? p[2]+"-"+MON[+p[1]-1]+"-"+p[0] : (p[0]||"—");
};
const dmyTime = v => v ? dmy(v)+" "+String(v).slice(11,16) : "—";
const dayOf = iso => { const d = new Date(iso + "T00:00:00"); return isNaN(d) ? "" : DAY[d.getDay()]; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* One bucket per approval queue, all seven present from the start. A tab whose
   bucket is missing would render as an error rather than as an empty queue,
   and an empty queue is the honest answer for five of them. */
const NO_APPROVALS = () => ({attendance:[], leave:[], profile:[], onboarding:[],
                             transfer:[], letter:[], other:[]});

let S = { employees:[], byName:{}, checkins:[], counts:{}, approvals:NO_APPROVALS(),
          // Employee Detail reads one whole record at a time and keeps what it
          // read: the same person is re-rendered on every keystroke elsewhere,
          // and re-fetching them each time would be a request per keypress.
          holidayLists:[], holidays:{}, empDoc:{}, empSel:"",
          // The calendar screen's own state: which month, which holiday list,
          // which days have been expanded past "+ N more…", and the search box
          // Factor HR puts in its toolbar. In S rather than in the DOM because
          // the body is rebuilt on every keystroke.
          cal:{month:"", list:"", find:"", search:false, open:{}}, calfocus:false,
          // Factor HR's regularization screen is one person at a time, so who
          // is picked is state rather than a scroll position. Cycle, dot and
          // category live here for the same reason the master's filters do.
          reg:{cycle:"", emp:"", q:"", cat:"", status:"", menu:false}, regfocus:false,
          // The Daily Detail report panel. `run` is the whole of Factor HR's
          // model: nothing is listed until Generate is pressed, and changing a
          // filter puts it back to false rather than leaving a stale report up.
          dda:{emp:"", q:"", status:"Active", by:"", period:"date", from:"", to:"",
               tab:"criteria", layout:{group:true, logo:true}, more:false, run:false,
               msg:"", menu:false}, ddafocus:false,
          // The master's own view state. Filters live here rather than in the
          // DOM so that switching to a card and back does not silently drop
          // them — a filtered list that quietly unfilters is how somebody
          // concludes a person is missing.
          empview:"grid", empstatus:"", empdept:"", empdesig:"", empdev:"",
          empfilters:false, empfocus:false, empmenu:false,
          // Category Type opens one value list at a time, the way that screen
          // navigates — View Category replaces the list rather than stacking.
          catopen:"",
          // Employee Detail is a report screen in Factor HR, so it has a form's
          // worth of state. edStatus starts null and is filled on first render.
          edStatus:null, edSections:["category"], edJoinA:"", edJoinB:"",
          edSepA:"", edSepB:"", edDobA:"", edDobB:"", edAgeA:"", edAgeB:"",
          edAgeOn:new Date().toISOString().slice(0,10), edMgr:"",
          edReport:null, edBusy:false, edMsg:"", edBad:false,
          // Monthly Basic Attendance. Both layout chips start on because both
          // are on in Factor HR's own screen; the date range fills itself in
          // on first render, where the current month is known.
          mb:{emp:"", status:"Active", tab:"criteria", from:"", till:"",
              logo:true, shift:true, weekoff:false, when:"", count:0, busy:false, err:""},
          mbRows:{},
          // The CTC / Earnings report form. Factor HR generates on demand
          // rather than on open, and that is copied: nothing is listed until
          // Generate is pressed. The form lives here rather than in the DOM
          // because the body is rebuilt on every keystroke.
          ctc:{by:"", status:"All", from:"", till:"", emp:"", wef:"", unit:"Yearly",
               attdays:false, hidegroup:false, incr:false},
          ctcRun:false, ctcMsg:"", ctcPick:false, ctcFocus:"",
          // The In / Out Activity report. Its date range is the one control on
          // this page that has to reach the site — everything else filters
          // what came back — so nothing is fetched until Generate is pressed.
          io:{emp:"", status:"Active", by:"", period:"Date Wise", from:"", till:"",
              t1:"00:00", t2:"23:59", selfie:true, logo:true, logtype:"", stream:"",
              tab:"criteria", more:false, menu:false},
          ioRows:null, ioState:"", ioMsg:"", ioFocus:"", ioRan:"",
          // The statutory report form. Its Report Type list is ours, not
          // theirs: their dropdown has never been opened, so what it offers is
          // still unknown and nothing is invented in its place.
          sr:{mode:"month", month:new Date().getMonth(), year:new Date().getFullYear(),
              from:"", till:"", type:"", status:"Active", emp:"", by:"", output:"Excel",
              code:false, hidehdr:false, pick:false},
          srRun:false, srMsg:"", srFocus:"", srExtra:null, srExtraState:"",
          section:"dashboard", subtab:"overview", apptab:"attendance",
          // The queue toolbar's own state. Selection survives a re-render
          // because the whole body is rebuilt on every keystroke and a
          // checkbox that forgets itself mid-search is worse than none.
          appq:"", appscope:"n:50", appgroup:"employee", appsel:new Set(),
          appshown:[], appmsg:"", appfocus:false, appdialog:"", dlgmsg:"",
          // The Other queue is a grid with its own filters and its own staged
          // decisions; none of it belongs to the card queues.
          othf:{}, othtype:"", othact:{}, othmsg:"", othlog:[],
          // On Board's own reads, fetched after the dashboard rather than with
          // it: Asset and the Employee document fields are the only calls on
          // this page that may not answer, and a module nobody has opened yet
          // must not be able to hold up the load everybody does open.
          onboardRead:false, onboardBusy:false, docs:[], docTier:"", docErr:"", assets:[], assetMoves:[], assetErr:"" };

/* Factor HR's own left-hand nav, in its order, so the two can be compared
   item by item. `cov` is this build's coverage of that module. */
const SECTIONS = [
  {key:"dashboard", label:"Dashboard", cov:"part", icon:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"},
  {key:"onboard",   label:"On Board",  cov:"none", icon:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8M19 8v6M22 11h-6"},
  {key:"employees", label:"Employees", cov:"live", icon:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8"},
  {key:"attendance",label:"Attendance",cov:"part", icon:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2"},
  {key:"leave",     label:"Leave",     cov:"part", icon:"M3 5h18v16H3zM3 9h18M8 3v4M16 3v4"},
  {key:"payroll",   label:"Payroll",   cov:"skip", icon:"M6 4h9a4 4 0 0 1 0 8H6M6 8h12M9 12l5 8"},
  {key:"loans",     label:"Loans",     cov:"none", icon:"M4 8h16v11H4zM8 8V6a4 4 0 0 1 8 0v2M12 12v3"},
  {key:"survey",    label:"Survey",    cov:"none", icon:"M5 3h14v18H5zM9 8h6M9 12h6M9 16h3"},
  {key:"settings",  label:"Settings",  cov:"part", icon:"M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"},
];
const COV_LABEL = {live:"Live", part:"Partial", none:"Not built", skip:"Deferred"};

function renderNav(){
  $("#nav").innerHTML = SECTIONS.map(s =>
    '<button class="nav" data-k="'+s.key+'"'+(S.section===s.key?' aria-current="page"':'')+'>'
    + '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="'+s.icon+'"/></svg>'
    + '<span>'+s.label+'</span></button>').join("");
  $("#nav").querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => {
    S.section = b.dataset.k; S.subtab = "overview"; renderNav(); renderAll();
  }));
}

function panel(title, cov, bodyHtml, opts){
  opts = opts || {};
  return '<section class="panel'+(cov==="none"||cov==="skip"?" dim":"")+'">'
    + '<header><h3><span class="ico">'+(opts.ico||"▪")+'</span>'+esc(title)+'</h3>'
    + '<span class="cov '+cov+'">'+COV_LABEL[cov]+'</span></header>'
    + '<div class="body">'+bodyHtml+'</div></section>';
}
const tile = (k,n,cls,s) => '<div class="tile"><span class="k">'+esc(k)+'</span>'
  + '<span class="n '+(cls||"")+'">'+n+'</span><span class="s">'+esc(s||"")+'</span></div>';
const gap = t => '<div class="gap"><b>Missing vs Factor HR.</b> '+t+'</div>';
const note = t => '<div class="note">'+t+'</div>';

/* --------------------------------------------------------------- data ---- */
async function api(path, params){
  const q = new URLSearchParams(params||{}).toString();
  const r = await fetch(path + (q?"?"+q:""));
  const j = await r.json();
  if(!r.ok) throw new Error(j.hint || j.error || ("HTTP "+r.status));
  return j;
}
async function listAll(dt, fields, filters){
  let out=[], start=0;
  for(;;){
    const p={fields:JSON.stringify(fields), limit_page_length:100, limit_start:start};
    if(filters) p.filters = JSON.stringify(filters);
    const page = (await api("/api/resource/"+encodeURIComponent(dt), p)).data || [];
    out = out.concat(page);
    if(page.length < 100) return out;
    start += 100;
  }
}

/* The correction queue, under either name. This app's own doctype is
   `Attendance Regularization` (docs/SCHEMA.md), with `Pending Approval` as its
   open state; the first cut of this page asked for the longer
   `Employee Attendance Regularization` and Factor HR's own word, `Initiated`.
   Nothing has been applied to the live site yet, so which of the two answers is
   still open — both are tried, and neither failing is fatal. An empty queue
   must not blank the rest of the dashboard. */
async function pendingRegularizations(){
  const mine = await listAll("Attendance Regularization",
    ["name","employee","employee_name","company","attendance_date","requested_in","requested_out",
     "reason","status","approver_type","decided_by","decided_on","decision_note","creation","owner","modified","modified_by"],
    [["status","=","Pending Approval"]]).catch(()=>null);
  // Which name answered decides where a decision would later be written.
  if(mine && mine.length){ S.regDoctype="Attendance Regularization"; return mine; }
  S.regDoctype="Employee Attendance Regularization";
  return listAll("Employee Attendance Regularization",
    ["name","employee","employee_name","attendance_date","requested_in","requested_out",
     "reason","remarks","status","applied_on","creation","owner","modified","modified_by"],
    [["status","=","Initiated"]]).catch(()=>mine||[]);
}

/* ------------------------------------------------------------ helpers ---- */
const scoped = () => { const c=$("#company").value; return c ? S.employees.filter(e=>e.company===c) : S.employees; };
const active = () => scoped().filter(e=>e.status==="Active");
const tidyDept = d => (d||"—").replace(/ - [A-Z]{2,5}$/,"");
function tally(rows,key){ const m=new Map(); rows.forEach(r=>{const k=r[key]||"—";m.set(k,(m.get(k)||0)+1)}); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function bars(pairs){
  const max=Math.max(1,...pairs.map(p=>p[1]));
  return '<div class="rows">'+pairs.map(p=>'<div class="row"><span>'+esc(p[0])+'</span><span class="val">'+p[1]+'</span>'
    +'<span class="track"><i style="width:'+(p[1]/max*100).toFixed(1)+'%"></i></span></div>').join("")+'</div>';
}

/* ------------------------------------------------------------ sections --- */
function secDashboard(){
  const a=active(), dev=a.filter(e=>e.attendance_device_id), mgr=a.filter(e=>e.reports_to);
  const ci=S.checkins, inb=new Set(ci.filter(c=>c.log_type==="IN").map(c=>c.employee));
  const outb=new Set(ci.filter(c=>c.log_type==="OUT").map(c=>c.employee));
  const done=[...inb].filter(e=>outb.has(e)).length;

  return '<div class="legend"><b style="font-family:var(--display)">Coverage against Factor HR</b>'
    + '<span><span class="cov live">Live</span> built and running on real data</span>'
    + '<span><span class="cov part">Partial</span> built, waiting on data or shifts</span>'
    + '<span><span class="cov none">Not built</span> exists in Factor HR, not here</span>'
    + '<span><span class="cov skip">Deferred</span> dropped from this release by decision</span></div>'
  + '<div class="cols">'
  + panel("Employees Summary","live",
      '<div class="tiles">'
      + tile("Active Employees", fmt(a.length),"", "")
      + tile("New Employees", fmt(a.filter(e=>e.date_of_joining && e.date_of_joining>=isoAgo(90)).length),"", "joined in 90 days")
      + tile("Left Employees", fmt(S.counts.left||0),"", "not imported by default")
      + tile("Licensed", "—","", "ERPNext does not charge per head")
      + '</div>', {ico:"👥"})
  + panel("Employee Attendance Summary", ci.length?"live":"part",
      '<div class="tiles">'
      + tile("Total In", fmt(inb.size),"good","")
      + tile("Not Yet In", fmt(Math.max(0,a.length-inb.size)),"warn","")
      + tile("Late-In","—","","needs shifts")
      + tile("On Leave", fmt(S.approvals.leave.length),"","")
      + tile("Completed", fmt(done),"","both punches")
      + '</div>'
      + (ci.length?"":'<div style="margin-top:.7rem">'+note('<b>No punches yet.</b> Employee Checkin is empty until the bridge runs and the phone app is live. Empty means <em>nothing recorded</em>, not <em>nobody came in</em> — which is why the tiles do not report 0% attendance.')+'</div>')
      + '<div style="margin-top:.7rem">'+note('<b>One difference worth keeping.</b> On a Sunday Factor HR shows all 160 as “Not Yet In”. Weekly off is a state of its own here, so nobody who is not expected in is counted as outstanding.')+'</div>',
      {ico:"🕒"})
  + panel("Headcount by company","live", bars(tally(active(),"company")), {ico:"🏭"})
  + panel("Headcount by department","live", bars(tally(active().map(e=>({d:tidyDept(e.department)})),"d").slice(0,10)), {ico:"🗂"})
  + panel("Quick Reports","part",
      '<div class="links">'
      + '<span>Daily Detail Attendance</span><span class="off">ECR File</span>'
      + '<span>Employee Detail</span><span class="off">Employee Earnings</span>'
      + '<span>In / Out Activity</span><span class="off">IncomeTax Register</span>'
      + '<span>Leave Balance</span><span class="off">Salary Pay-slip</span>'
      + '<span class="off">Salary Register</span><span></span></div>'
      + '<div style="margin-top:.7rem">'+note('Two ERPNext query reports exist already — <b>Punch Clock Drift</b> and <b>Open Shifts / Missed Punch-Out</b>. Neither has a Factor HR equivalent. Struck-through reports are payroll, deferred.')+'</div>',
      {ico:"📄"})
  + panel("Payroll Summary","skip",
      gap("Factor HR shows Salary Proceed / Not Proceed / Stop / Hold / Arrears / Stop TDS, and an F&amp;F summary beside it.")
      + '<div style="margin-top:.7rem">'+note('<b>Deferred by decision, 23 Aug.</b> Payroll is calculated by hand and is not processed in Factor HR either, so there is nothing to replace yet.')+'</div>',
      {ico:"₹"})
  + panel("Engagement panels","skip",
      gap("Mood Analysis, CEO Speak, Announcements, Wish Celebration and Important Files all exist in Factor HR.")
      + '<div style="margin-top:.7rem">'+note('Every one of them is <b>empty in your tenant</b>. Nothing to rebuild unless you want it. Birthdays and work anniversaries would be the cheapest to add — the dates are already loaded.')+'</div>',
      {ico:"🎉"})
  + panel("Help Desk","skip",
      gap("Factor HR has a ticket queue: Open / Re-opened / Resolved.")
      + '<div style="margin-top:.7rem">'+note('<b>Not wanted.</b> Three tickets ever raised, none resolved.')+'</div>', {ico:"🎫"})
  + '</div>';
}

function isoAgo(days){ const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); }

/* Factor HR's approval queue, tab for tab and in its order — screenshot of
   28 Aug 2026 reads: Leave 3 · Attendance 50 · Employee Profile 0 ·
   Onboarding 0 · Transfer & Promotion 0 · Letter Assignment 0 · Other.

   The five empty queues are pages here rather than greyed-out buttons. What is
   actually being agreed with HR is each queue's *field list* — and a field list
   nobody can open is a field list nobody checks. Every field carries its own
   state, so "the page exists" is never mistaken for "the queue works". */
const FSTATE = {
  live:  ["live","Live"],   // read off the site and shown on this page today
  stock: ["part","Stock"],  // the field exists in the doctype, not yet surfaced

/* Factor HR's own toolbar, above the queue and shared by every tab:
   select-all · bulk action · search · refresh · how many activities · grouping.
   Everything here that only reads is wired. The two that write are not, and say
   so when pressed rather than looking broken — see `qmsg`. */
/* Factor HR's own dropdown contents, read off the 28 Aug screenshots.
   Two kinds of window in one list — a count of activities and a stretch of
   days — so the value carries its kind: `n:` a count, `d:` days back. */
const QSCOPES=[["","All"],["n:10","Last 10 Activities"],["n:20","Last 20 Activities"],
  ["n:50","Last 50 Activities"],["d:7","Last 7 Days"],["d:31","Last 31 Days"],
  ["d:60","Past Two Months"],["d:90","Past Three Months"]];
const QGROUPS=[["employee","Employee Wise"],["type","Request Type Wise"],
  ["manager","Reporting Manager Wise"]];
const QBULK=[["","--- Select Bulk Action ---"],["decide","Bulk Approve / Reject"],
  ["data","Import / Export Data"]];
const READ_ONLY="Deciding a request is a write, and this page proxies GET only — "
  + "see app/serve.py. It is a window onto the queue, not the queue itself.";

function qToolbar(total, shown){
  const sel=S.appsel.size, allOn = shown.length>0 && shown.every(r=>S.appsel.has(reqId(r)));
  const opt=(list,cur)=>list.map(o=>'<option value="'+o[0]+'"'+(String(o[0])===String(cur)?" selected":"")+'>'+o[1]+'</option>').join("");
  return '<div class="qbar">'
    + '<input type="checkbox" id="qall" aria-label="Select everything shown"'+(allOn?" checked":"")+'>'
    + '<select id="qbulk" aria-label="Bulk action">'+opt(QBULK,"")+'</select>'
    + '<input type="search" id="qsearch" placeholder="Search" aria-label="Search this queue" value="'+esc(S.appq)+'">'
    + '<button class="icon" id="qrefresh" title="Reload from the site" aria-label="Refresh">&#8635;</button>'
    + '<select id="qscope" aria-label="How many activities">'+opt(QSCOPES,S.appscope)+'</select>'
    + '<select id="qgroup" aria-label="Grouping">'+opt(QGROUPS,S.appgroup)+'</select>'
    + '<span class="picked">'+shown.length+' of '+total+' shown'
    + (sel?' · <b>'+sel+' selected</b>':'')+'</span></div>'
    + (S.appmsg?note(esc(S.appmsg)):"");
}

/* Factor HR's Import / Export dialog: Export · Download Template · Import Data,
   and Close. Two of the three only read and work here. The third writes
   attendance from a spreadsheet, which is the single most dangerous button in
   any HR system, so it is drawn and refused rather than quietly omitted —
   somebody who used it in Factor HR should find out here, not discover the gap
   during a payroll run. */
/* Bulk Approval. It sets Your Action on the selection and nothing more —
   Factor HR's own two-step, kept: marking fifty rows is not deciding fifty
   rows, and the gap between the two is where somebody notices row nineteen. */
function bulkDialog(t){
  const n=S.appsel.size;
  return modal("Bulk Approval",
      '<button class="btn go" data-bulkact="Approve">&#10003; Approve selected</button>'
    + '<button class="btn imp" data-bulkact="Reject">&#10005; Reject selected</button>'
    + '<button class="btn ghost" data-bulkact="">Clear staged actions</button>',
      (n? n+' row'+(n===1?'':'s')+' selected. This marks them only — Save Approval Changes is what decides.'
        : 'Nothing selected. Tick the rows first, or use the box in the header to take everything shown.'));
}

/* The Approval Activities Log: what has been decided from this page, newest
   first, and whether it reached the site. Session-scoped and said so — Frappe's
   own version log is the durable record, per document. */
function logDialog(){
  const rows=S.othlog;
  const body = rows.length
    ? '<div class="scroll" style="max-height:46vh"><table style="min-width:640px"><thead><tr>'
      + '<th>When</th><th>Reference</th><th>Action</th><th>Written</th><th>Note</th></tr></thead><tbody>'
      + rows.map(e=>'<tr><td class="mono">'+esc(e.at)+'</td><td class="mono">'+esc(e.ref)+'</td>'
        + '<td>'+esc(e.action)+' &rarr; '+esc(e.status)+'</td>'
        + '<td>'+(e.persisted?'<span class="cov live">Site</span>':'<span class="cov none">Screen</span>')+'</td>'
        + '<td class="muted" style="white-space:normal;min-width:220px">'+esc(e.note||"")+'</td></tr>').join("")
      + '</tbody></table></div>'
    : '<div class="empty"><b>Nothing decided yet</b>Decisions made on this page appear here, with whether they reached the site.</div>';
  return modal("Approval Activities Log",
      '<button class="btn tpl" id="logexport">&#8681; Export log</button>'
    + '<button class="btn ghost" id="logclear">Clear log</button>',
      rows.length+" decision"+(rows.length===1?"":"s")+" this session. "
      + "Frappe keeps the durable record per document in its version log; this list is the page's own.",
      body, true);
}

/* One shell for all three dialogs, so they close the same way and cannot drift
   apart in how they look. */
function modal(title, actions, why, extra, wide){
  return '<div class="modal" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgtitle">'
    + '<div class="box'+(wide?" wide":"")+'"><header><h3 id="dlgtitle">'+esc(title)+'</h3>'
    + '<button class="x" id="dlgx" aria-label="Close">&#215;</button></header>'
    + '<div class="acts">'+actions+'</div>'
    + '<div class="why">'+(S.dlgmsg?esc(S.dlgmsg)+'<br>':'')+'<span class="muted">'+why+'</span></div>'
    + (extra?'<div style="padding:0 1rem 1rem">'+extra+'</div>':'')
    + '<div class="foot"><button class="btn ghost" id="dlgclose">Close</button></div>'
    + '</div></div>';
}

function dataDialog(t){
  const shown=S.appshown.length, sel=S.appsel.size;
