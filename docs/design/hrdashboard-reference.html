const REPORTS=[['headcount','Headcount (Point-in-time)','Breakdown of all current employees.','users'],['onboarding','Onboarding','Onboarding employees by month of their join date.','user'],['offboarding','Offboarding','Offboarding and inactive employees by month of their last working date.','door'],['balance','Time Off Balance','An overview of employees’ time off balances.','clock'],['pipeline','Recruitment Pipeline','An overview of the hiring progress during a period of time.','brief'],['data','Employee Data Reports','An overview of employee information: age, gender and birthdays.','trend'],['schedule','Time Off Schedule','An overview of employees’ time off schedules.','timer'],['turnover','Employee Turnover Rate','An overview of the resigned employees over the active employees.','trendd']];
R.reports=()=>ph('Report','Here’s report so far')+`<div class="grid2">${REPORTS.map(([k,t,d,i])=>`<button class="tile" data-go="report/${k}"><span class="ti">${ic(i,20,1.8)}</span><h3>${t}</h3><p>${d}</p></button>`).join('')}</div>`;
const last12=()=>{const a=[];for(let i=11;i>=0;i--){const d=new Date(today.getFullYear(),today.getMonth()-i,1);a.push(iso(d).slice(0,7))}return a};
const mLabel=m=>D(m+'-01').toLocaleDateString('en-US',{month:'short'});
function headcountAt(m){const end=iso(new Date(+m.slice(0,4),+m.slice(5,7),0));return S.employees.filter(e=>e.joined<=end).length}
const rHead=(t,k,extra='')=>phBack(t,'reports',`<button data-go="reports">Report</button>${ic('right',14,2)}<b>${t}</b>`,`${extra}${btn('Export','data-act="exportCsv" data-x="r_'+k+'"','btn-line','upload')}`);
let dataTab='age';
R.report=(p)=>{const k=p[0];const E=S.employees;const M=last12();
  if(k==='headcount'){const by=(f,list)=>list.map(x=>[x,E.filter(e=>e[f]===x).length]).filter(x=>x[1]);const mx=E.length;
    return rHead('Headcount','headcount')+`<div class="mini-grid">${[['Total headcount',E.length],['Active',E.filter(e=>e.status==='Active').length],['Onboarding',E.filter(e=>e.status==='Onboarding').length],['Offboarding',E.filter(e=>e.status==='Offboarding').length]].map(([t,v])=>`<div class="mini"><div class="mini-t">${t}</div><div class="mini-v"><b data-count="${v}">${v}</b></div></div>`).join('')}</div>
    <div class="card" style="margin-bottom:24px"><div class="card-h"><h3>Headcount over time</h3><span class="muted">Last 12 months</span></div><div id="rc1"></div></div>
    <div class="grid3">${[['By department','dept',deptNames()],['By office','office',officeNames()],['By type','type',['Permanent','Contract','Freelance','Internship']]].map(([t,f,l])=>`<div class="card"><h3 style="margin-bottom:14px;font-size:16px">${t}</h3>${by(f,l).map(([x,n])=>`<div class="hbar"><span>${esc(x)}</span><div class="bar"><i style="width:${n/mx*100}%"></i></div><b class="num">${n}</b></div>`).join('')}</div>`).join('')}</div>`}
  if(k==='onboarding'||k==='offboarding'){const on=k==='onboarding';const L=on?E.filter(e=>e.joined>=M[0]+'-01'):E.filter(e=>e.status==='Offboarding'||!e.active);
    return rHead(on?'Onboarding':'Offboarding',k)+`<div class="card" style="margin-bottom:24px"><div class="card-h"><h3>${on?'Joiners':'Leavers'} by month</h3><span class="muted">Last 12 months</span></div><div id="rc1"></div></div>
    <div class="card"><div class="card-h"><h3>${on?'New employees':'Leaving employees'}</h3><span class="muted">${plural(L.length,'person','people')}</span></div>${L.length?table(['Employee','Department','Job title',on?'Join date':'Last working day','Checklist',''],L.sort((a,b)=>(on?b.joined.localeCompare(a.joined):(a.lastDay||'').localeCompare(b.lastDay||''))).map(e=>{const l=S.lists.find(x=>x.emp===e.id&&x.kind===(on?'Onboarding':'Offboarding'));return`<tr class="click" data-go="emp/${e.id}/general"><td>${who(e.name,e.email)}</td><td>${esc(e.dept)}</td><td>${esc(e.title)}</td><td>${fmtD(on?e.joined:e.lastDay)}</td><td style="min-width:130px">${l?prog(listProg(l)):'—'}</td><td><span class="row-go">${ic('right',16,2)}</span></td></tr>`})):emptyState('users','No one in this period','')}</div>`}
  if(k==='balance'){return rHead('Time Off Balance','balance')+`<div class="card">${table(['Employee','Department',...S.leaveTypes.map(t=>t.name),'Pending'],E.map(e=>`<tr class="click" data-go="emp/${e.id}/job"><td>${who(e.name,e.title)}</td><td>${esc(e.dept)}</td>${S.leaveTypes.map(t=>{const en=entitled(t.id),u=usedDays(e.id,t.id);return`<td style="min-width:120px">${en==null?`<span class="num">${u} taken</span>`:`<div class="progress"><div class="bar"><i style="width:${u/en*100}%;background:${t.color}"></i></div><span>${en-u}/${en}</span></div>`}</td>`}).join('')}<td>${S.leaves.filter(l=>l.emp===e.id&&l.status==='Pending').length||'—'}</td></tr>`))}</div>`}
  if(k==='pipeline'){const st=S.stages;const C=S.cands.filter(c=>!c.rejected);const cnt=st.map(s=>C.filter(c=>stageName(c)===s).length);const reach=st.map((s,i)=>S.cands.filter(c=>c.stage>=i).length);
    return rHead('Recruitment Pipeline','pipeline')+`<div class="mini-grid">${[['Applicants',S.cands.length],['In progress',C.filter(c=>stageName(c)!=='Hired').length],['Hired',S.cands.filter(c=>stageName(c)==='Hired').length],['Rejected',S.cands.filter(c=>c.rejected).length]].map(([t,v])=>`<div class="mini"><div class="mini-t">${t}</div><div class="mini-v"><b data-count="${v}">${v}</b></div></div>`).join('')}</div>
    <div class="grid2"><div class="card"><h3 style="margin-bottom:14px">Funnel</h3>${st.map((s,i)=>`<div class="funnel-row"><span>${esc(s)}</span><div class="bar"><i style="width:${reach[0]?reach[i]/reach[0]*100:0}%;background:var(--green);opacity:${1-i*.12}"></i></div><b class="num">${reach[i]}</b></div>`).join('')}<p class="muted" style="font-size:12.5px;margin:10px 0 0">How many applicants reached each stage.</p></div>
    <div class="card"><h3 style="margin-bottom:14px">By source</h3>${S.sources.map(s=>{const n=S.cands.filter(c=>c.source===s).length;return`<div class="hbar"><span>${esc(s)}</span><div class="bar"><i style="width:${S.cands.length?n/S.cands.length*100:0}%;background:var(--blue)"></i></div><b class="num">${n}</b></div>`}).join('')}</div></div>
    <div class="card" style="margin-top:24px">${table(['Job','Status','Applicants',...st.slice(1)],S.jobs.map(j=>{const c=S.cands.filter(x=>x.job===j.id);return`<tr class="click" data-go="job/${j.id}/pipeline"><td><b>${esc(j.title)}</b></td><td>${pill(j.status)}</td><td class="num">${c.length}</td>${j.stages.slice(1).map((s,i)=>`<td class="num">${c.filter(x=>x.stage>=i+1&&!x.rejected).length}</td>`).join('')}</tr>`}))}</div>`}
  if(k==='data'){const tabs=segTabs('rd',[['age','Age'],['gender','Gender'],['birthday','Birthday']],dataTab,'data-rd');let body='';
    if(dataTab==='age'){const B=[['Under 25',0,24],['25–29',25,29],['30–34',30,34],['35–39',35,39],['40–49',40,49],['50+',50,200]];const ages=E.filter(e=>e.dob).map(e=>age(e.dob));body=`<div class="mini-grid" style="margin-top:20px">${[['Average age',ages.length?(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1):'—'],['Youngest',Math.min(...ages)],['Oldest',Math.max(...ages)]].map(([t,v])=>`<div class="mini" style="background:var(--surface-2);box-shadow:none"><div class="mini-t">${t}</div><div class="mini-v"><b>${v}</b></div></div>`).join('')}</div><div id="rc1" data-b='${JSON.stringify(B.map(b=>[b[0],ages.filter(a=>a>=b[1]&&a<=b[2]).length]))}'></div>`}
    if(dataTab==='gender'){const G=['Female','Male','Non-binary','Prefer not to say'];const cols=['#1AAE5F','#2F6FED','#F5A524','#8A94A6'];const segs=G.map((g,i)=>({l:g,v:E.filter(e=>e.gender===g).length,c:cols[i]})).filter(s=>s.v);
      body=`<div class="grid2" style="margin-top:20px;align-items:center"><div>${donutBlock(segs,null,'Employees')}</div><div>${deptNames().map(d=>{const L=E.filter(e=>e.dept===d);if(!L.length)return'';return`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><b>${d}</b><span class="muted">${L.length}</span></div><div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)">${G.map((g,i)=>{const n=L.filter(e=>e.gender===g).length;return n?`<i style="width:${n/L.length*100}%;background:${cols[i]}" title="${g}: ${n}"></i>`:''}).join('')}</div></div>`}).join('')}</div></div>`}
    if(dataTab==='birthday'){const up=E.filter(e=>e.dob).map(e=>{const b=D(e.dob);let n=new Date(today.getFullYear(),b.getMonth(),b.getDate());if(n<today)n=new Date(today.getFullYear()+1,b.getMonth(),b.getDate());return{e,n,days:Math.round((n-today)/864e5)}}).sort((a,b)=>a.n-b.n);
      body=`<div class="grid2" style="margin-top:20px"><div class="sec" style="margin:0"><div class="sec-h"><h3>Coming up</h3></div>${up.slice(0,8).map(x=>`<div class="list-row">${av(x.e.name)}<div class="grow"><b>${esc(x.e.name)}</b><small>${x.n.toLocaleDateString('en-GB',{day:'numeric',month:'long'})} · turns ${age(x.e.dob)+1}</small></div>${x.days===0?pill('Hired','Today 🎂'):x.days<=7?pill('Pending',`in ${plural(x.days,'day')}`):`<span class="muted" style="font-size:12.5px">in ${x.days} days</span>`}<button class="icon-btn" data-act="msgEmp" data-id="${x.e.id}" aria-label="Send wishes">${ic('chat',16,2)}</button></div>`).join('')}</div>
      <div class="sec" style="margin:0"><div class="sec-h"><h3>By month</h3></div><div id="rc1" data-b='${JSON.stringify(Array.from({length:12},(_,i)=>[new Date(2000,i,1).toLocaleDateString('en-US',{month:'short'}),E.filter(e=>e.dob&&D(e.dob).getMonth()===i).length]))}'></div></div></div>`}
    return rHead('Employee Data','data_'+dataTab)+`<div class="card">${tabs}${body}</div>`}
  if(k==='schedule'){const from=TODAY,days=30,to=iso(addDays(today,days-1));const L=S.leaves.filter(l=>['Approved','Pending'].includes(l.status)&&l.to>=from&&l.from<=to).sort((a,b)=>a.from.localeCompare(b.from));
    const pos=s=>Math.max(0,Math.min(days,(D(s)-today)/864e5));
    return rHead('Time Off Schedule','schedule')+`<div class="card"><div class="card-h"><h3>Next 30 days</h3><div class="legend">${S.leaveTypes.map(t=>`<span><i style="background:${t.color}"></i>${t.name}</span>`).join('')}</div></div>
    <div class="gantt-row" style="margin-bottom:6px"><span></span><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)">${[0,7,14,21,29].map(d=>`<span>${fmtS(iso(addDays(today,d)))}</span>`).join('')}</div></div>
    ${L.length?`<div class="gantt">${L.map((l,i)=>{const t=ltype(l.type);const a=pos(l.from),b=pos(iso(addDays(D(l.to),1)));return`<div class="gantt-row"><button class="who" data-act="leaveDetail" data-id="${l.id}" style="text-align:left">${av(ename(l.emp))}<div><b style="font-size:13px">${esc(ename(l.emp))}</b><small>${fmtS(l.from)}–${fmtS(l.to)}</small></div></button><div class="gantt-track"><button class="gantt-bar" data-act="leaveDetail" data-id="${l.id}" style="left:${a/days*100}%;width:${Math.max(3,(b-a)/days*100)}%;background:${t.color};${l.status==='Pending'?'opacity:.55;':''}animation-delay:${i*40}ms" title="${esc(t.name)} · ${l.status}">${workdays(l.from,l.to)}d</button></div></div>`}).join('')}</div>`:emptyState('calendar','No time off in the next 30 days','')}</div>`}
  if(k==='turnover'){const left=m=>{const r=rng(m.charCodeAt(6)*31+m.charCodeAt(5));return Math.floor(r()*3)+(S.employees.filter(e=>e.lastDay&&e.lastDay.slice(0,7)===m).length)};const rates=M.map(m=>+(left(m)/Math.max(1,headcountAt(m))*100).toFixed(1));const avg=(rates.reduce((a,b)=>a+b,0)/rates.length).toFixed(1);
    return rHead('Employee Turnover Rate','turnover')+`<div class="mini-grid">${[['Average monthly rate',avg+'%'],['This month',rates.at(-1)+'%'],['Leavers (12 months)',M.reduce((s,m)=>s+left(m),0)],['Current headcount',E.length]].map(([t,v])=>`<div class="mini"><div class="mini-t">${t}</div><div class="mini-v"><b>${v}</b></div></div>`).join('')}</div>
    <div class="card"><div class="card-h"><h3>Turnover rate by month</h3><span class="muted">Leavers ÷ headcount</span></div><div id="rc1" data-r='${JSON.stringify(rates)}'></div></div>`}
  return R.notfound()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-rd]');if(b){dataTab=b.dataset.rd;rerender()}});
AFTER.report=()=>{const k=params[0];const M=last12();const el=$('#rc1');if(!el)return;
  if(k==='headcount')lineChart('rc1',M.map(mLabel),[{name:'Headcount',color:'var(--green)',data:M.map(headcountAt)}],{min:0,area:true,label:'Headcount'});
  if(k==='onboarding')barChart('rc1',M.map(mLabel),M.map(m=>S.employees.filter(e=>e.joined.slice(0,7)===m).length),{label:'Joiners by month'});
  if(k==='offboarding')barChart('rc1',M.map(mLabel),M.map(m=>S.employees.filter(e=>e.lastDay&&e.lastDay.slice(0,7)===m).length+(m<TODAY.slice(0,7)?Math.floor(rng(m.charCodeAt(6))()*3):0)),{label:'Leavers by month',color:'var(--blue)'});
  if(k==='data'&&el.dataset.b){const b=JSON.parse(el.dataset.b);barChart('rc1',b.map(x=>x[0]),b.map(x=>x[1]),{label:'Distribution',color:dataTab==='birthday'?'var(--yellow)':'var(--green)',h:dataTab==='birthday'?220:250})}
  if(k==='turnover')lineChart('rc1',M.map(mLabel),[{name:'Rate',color:'var(--red)',data:JSON.parse(el.dataset.r)}],{min:0,fmt:v=>v+'%',area:true,label:'Turnover'})};
EXPORT.r_headcount=()=>[['Name','Department','Office','Type','Status','Joined']].concat(S.employees.map(e=>[e.name,e.dept,e.office,e.type,e.status,e.joined]));
EXPORT.r_onboarding=()=>[['Name','Department','Title','Joined']].concat(S.employees.filter(e=>e.joined>=last12()[0]+'-01').map(e=>[e.name,e.dept,e.title,e.joined]));
EXPORT.r_offboarding=()=>[['Name','Department','Title','Last day']].concat(S.employees.filter(e=>e.status==='Offboarding').map(e=>[e.name,e.dept,e.title,e.lastDay]));
EXPORT.r_balance=EXPORT.balance;
EXPORT.r_pipeline=()=>[['Candidate','Job','Stage','Source','Applied']].concat(S.cands.map(c=>[c.name,(job(c.job)||{}).title,stageName(c),c.source,c.applied]));
EXPORT.r_data_age=()=>[['Name','Date of birth','Age']].concat(S.employees.map(e=>[e.name,e.dob,e.dob?age(e.dob):'']));
EXPORT.r_data_gender=()=>[['Name','Gender','Department']].concat(S.employees.map(e=>[e.name,e.gender,e.dept]));
EXPORT.r_data_birthday=EXPORT.r_data_age;
EXPORT.r_schedule=()=>[['Employee','Type','From','To','Status']].concat(S.leaves.filter(l=>l.to>=TODAY).map(l=>[ename(l.emp),ltype(l.type).name,l.from,l.to,l.status]));
EXPORT.r_turnover=()=>[['Month','Headcount']].concat(last12().map(m=>[m,headcountAt(m)]));


/* ================= SETTINGS ================= */
const SET_NAV=[['company','Company info','building'],['office','Office','pin'],['department','Department','layers'],['titles','Job titles','brief'],['schedules','Work schedules','clock'],['permission','Permission','shield'],['integration','Integration','plug'],['subscription','Subscription','card'],['password','Change password','lock'],['notifications','Notifications','bell']];
R.settings=(p)=>{const tab=p[0]||'company';const fn=SET[tab]||SET.company;
  return ph('Settings','Manage your company and account')+`<div class="set-wrap"><nav class="set-nav" aria-label="Settings sections">${SET_NAV.map(([k,l,i])=>`<button data-go="settings/${k}" class="${k===tab?'on':''}" ${k===tab?'aria-current="page"':''}>${ic(i,18,2)}${l}</button>`).join('')}</nav><div>${fn(p.slice(1))}</div></div>`};
const SET={};
SET.company=()=>{const c=S.company;return`<form class="card" data-form="company" novalidate><div class="sec-h"><h3>Company info</h3></div><div style="display:flex;gap:16px;align-items:center;margin-bottom:20px"><span class="icon-sq" style="width:64px;height:64px;font-size:22px;background:var(--green);color:#fff;border-radius:16px">${esc((c.name||'?').slice(0,1))}</span><div><b style="font-size:16px">${esc(c.name)}</b><div class="muted" style="font-size:13px">${esc(c.industry)} · ${esc(c.size)} people</div></div></div>
  <div class="form-grid">${inp('name',c.name,'required data-err="Enter the company name"','Company name',{req:true})}${sel('industry',OB_IND.map(x=>x[0]),c.industry,'','Industry')}${sel('size',['1–10','11–50','51–200','201–500','500+'],c.size,'','Company size')}${inp('founded',c.founded,'inputmode="numeric" maxlength="4"','Founded')}${inp('email',c.email,'type="email" required data-err="Enter a valid email"','Company email')}${inp('phone',c.phone,'type="tel"','Phone')}${inp('website',c.website,'','Website')}${inp('address',c.address,'','Address')}</div><div class="modal-f">${btn('Save changes','','btn-ink')}</div></form>`};
F.company=v=>{Object.assign(S.company,v);toast('Company info saved')};
SET.office=()=>`<div class="card"><div class="sec-h"><h3>Offices</h3>${btn('Add office','data-act="editOffice"','btn-ink btn-sm','plus')}</div><div class="grid2">${S.offices.map(o=>`<div class="sec" style="margin:0"><div class="sec-h" style="margin-bottom:8px"><span style="display:flex;gap:10px;align-items:center"><span class="icon-sq">${ic(o.radius?'building':'globe',18,2)}</span><b>${esc(o.name)}</b></span>${menu(dotsBtn,mItem('Edit',`data-act="editOffice" data-id="${o.id}"`,'edit')+mItem('Delete',`data-act="delOffice" data-id="${o.id}"`,'trash',true))}</div><div class="muted" style="font-size:13px;line-height:1.6">${esc(o.address)}${o.city!=='—'?', '+esc(o.city):''}<br>${esc(o.country)} · ${esc(o.tz)}<br>${plural(S.employees.filter(e=>e.office===o.name).length,'person','people')}</div></div>`).join('')}</div></div>`;
A.editOffice=el=>{const o=S.offices.find(x=>x.id===el.dataset.id)||{name:'',address:'',city:'',state:'',country:'',tz:'GMT',radius:100,phone:''};modal(mh(el.dataset.id?'Edit office':'Add office','')+`<form data-form="office" data-id="${el.dataset.id||''}" novalidate><div class="form-grid">${inp('name',o.name,'required data-err="Name the office"','Office name',{full:true})}${inp('address',o.address,'','Street address',{full:true})}${inp('city',o.city,'','City')}${inp('state',o.state,'','State')}${inp('country',o.country,'','Country')}${inp('tz',o.tz,'','Time zone')}${inp('phone',o.phone,'type="tel"','Phone')}${inp('radius',o.radius,'type="number" min="0" max="2000" step="10"','Check-in radius (m)',{hint:'0 means no location check-in.'})}</div>${mf('Save office')}</form>`)};
F.office=(v,f)=>{const d={...v,name:v.name.trim(),radius:+v.radius||0};if(f.dataset.id){const o=S.offices.find(x=>x.id===f.dataset.id);if(o.name!==d.name){S.employees.forEach(e=>{if(e.office===o.name)e.office=d.name});S.jobs.forEach(j=>{if(j.loc===o.name)j.loc=d.name})}Object.assign(o,d)}else S.offices.push({id:uid('O'),...d});toast('Office saved')};
A.delOffice=el=>{const o=S.offices.find(x=>x.id===el.dataset.id);const n=S.employees.filter(e=>e.office===o.name).length;if(n){toast(`Move ${plural(n,'person','people')} out of ${o.name} first`);return}const s=snap();S.offices=S.offices.filter(x=>x!==o);save();rerender();toast('Office deleted',s)};
SET.department=()=>`<div class="card"><div class="sec-h"><h3>Departments</h3>${btn('New department','data-act="editDept"','btn-ink btn-sm','plus')}</div>${table(['Department','Head','People','Open jobs',''],S.depts.map(d=>`<tr><td><b>${esc(d.name)}</b>${d.desc?`<small class="muted" style="display:block">${esc(d.desc)}</small>`:''}</td><td>${d.headId&&emp(d.headId)?who(ename(d.headId),emp(d.headId).title):'—'}</td><td class="num">${S.employees.filter(e=>e.dept===d.name).length}</td><td class="num">${S.jobs.filter(j=>j.dept===d.name&&j.status==='Open').length}</td><td>${menu(dotsBtn,mItem('Edit',`data-act="editDept" data-id="${d.id}"`,'edit')+mItem('View people',`data-act="dirDept" data-d="${esc(d.name)}"`,'users')+mItem('Delete',`data-act="delDept" data-id="${d.id}"`,'trash',true))}</td></tr>`))}</div>`;
A.editDept=el=>{const d=S.depts.find(x=>x.id===el.dataset.id)||{name:'',headId:'',desc:''};modal(mh(el.dataset.id?'Edit department':'New department','')+`<form data-form="dept" data-id="${el.dataset.id||''}" novalidate><div class="form-grid" style="grid-template-columns:1fr">${inp('name',d.name,'required data-err="Name the department"','Department name')}${sel('headId',[['','No head yet'],...S.employees.map(e=>[e.id,e.name])],d.headId,'','Head of department')}${ta('desc',d.desc,'rows="3"','Description')}</div>${mf('Save department')}</form>`)};
F.dept=(v,f)=>{const n=v.name.trim();if(S.depts.some(d=>d.name.toLowerCase()===n.toLowerCase()&&d.id!==f.dataset.id)){toast('A department with that name already exists');return false}if(f.dataset.id){const d=S.depts.find(x=>x.id===f.dataset.id);if(d.name!==n){S.employees.forEach(e=>{if(e.dept===d.name)e.dept=n});S.titles.forEach(t=>{if(t.dept===d.name)t.dept=n});S.jobs.forEach(j=>{if(j.dept===d.name)j.dept=n})}Object.assign(d,{name:n,headId:v.headId,desc:v.desc})}else S.depts.push({id:uid('D'),name:n,headId:v.headId,desc:v.desc});toast('Department saved')};
A.delDept=el=>{const d=S.depts.find(x=>x.id===el.dataset.id);const n=S.employees.filter(e=>e.dept===d.name).length;if(n){toast(`Move ${plural(n,'person','people')} out of ${d.name} first`);return}const s=snap();S.depts=S.depts.filter(x=>x!==d);save();rerender();toast('Department deleted',s)};
let titleDept='All';
SET.titles=()=>{const L=S.titles.filter(t=>titleDept==='All'||t.dept===titleDept);return`<div class="card"><div class="sec-h"><h3>Job titles</h3>${btn('New job title','data-act="editTitle"','btn-ink btn-sm','plus')}</div><div style="margin-bottom:14px;max-width:260px">${sel('d',['All',...deptNames()],titleDept,'data-ch="titleDept" aria-label="Department"')}</div>${table(['Job title','Department','People',''],L.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.dept)}</td><td class="num">${S.employees.filter(e=>e.title===t.name).length}</td><td>${menu(dotsBtn,mItem('Edit',`data-act="editTitle" data-id="${t.id}"`,'edit')+mItem('Delete',`data-act="delTitle" data-id="${t.id}"`,'trash',true))}</td></tr>`))}</div>`};
CH.titleDept=t=>{titleDept=t.value;rerender()};
A.editTitle=el=>{const t=S.titles.find(x=>x.id===el.dataset.id)||{name:'',dept:deptNames()[0]};modal(mh(el.dataset.id?'Edit job title':'New job title','')+`<form data-form="title" data-id="${el.dataset.id||''}" novalidate><div class="form-grid" style="grid-template-columns:1fr">${inp('name',t.name,'required data-err="Enter a title"','Job title')}${sel('dept',deptNames(),t.dept,'','Department')}</div>${mf('Save')}</form>`)};
F.title=(v,f)=>{if(f.dataset.id){const t=S.titles.find(x=>x.id===f.dataset.id);S.employees.forEach(e=>{if(e.title===t.name)e.title=v.name.trim()});Object.assign(t,{name:v.name.trim(),dept:v.dept})}else S.titles.push({id:uid('t'),name:v.name.trim(),dept:v.dept});toast('Job title saved')};
A.delTitle=el=>{const s=snap();S.titles=S.titles.filter(t=>t.id!==el.dataset.id);save();rerender();toast('Job title deleted',s)};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
SET.schedules=()=>`<div class="card"><div class="sec-h"><h3>Work schedules</h3>${btn('New schedule','data-act="editSched"','btn-ink btn-sm','plus')}</div>${S.schedules.map(s=>`<div class="list-row"><span class="icon-sq">${ic('clock',18,2)}</span><div class="grow"><b>${esc(s.name)}</b> ${s.def?pill('Active','Default'):''}<small>${s.days.map(d=>DAYS[d]).join(', ')} · ${s.start}–${s.end} · ${s.brk} min break · ${dur(s.days.length*(toMin(s.end)-toMin(s.start)-s.brk))} a week</small></div><span class="muted" style="font-size:12.5px">${plural(S.employees.filter(e=>e.schedule===s.name).length,'person','people')}</span>${menu(dotsBtn,mItem('Edit',`data-act="editSched" data-id="${s.id}"`,'edit')+(s.def?'':mItem('Make default',`data-act="defSched" data-id="${s.id}"`,'tick'))+mItem('Delete',`data-act="delSched" data-id="${s.id}"`,'trash',true))}</div>`).join('')}</div>`;
A.editSched=el=>{const s=S.schedules.find(x=>x.id===el.dataset.id)||{name:'',days:[1,2,3,4,5],start:'09:00',end:'17:00',brk:60};modal(mh(el.dataset.id?'Edit work schedule':'New work schedule','')+`<form data-form="sched" data-id="${el.dataset.id||''}" novalidate>${inp('name',s.name,'required data-err="Name the schedule"','Schedule name')}<div class="field" style="margin:14px 0"><label>Working days</label><div style="display:flex;gap:6px;flex-wrap:wrap">${[1,2,3,4,5,6,0].map(d=>`<label class="chip" style="cursor:pointer;display:flex;gap:6px;align-items:center"><input type="checkbox" class="chk" name="d${d}" ${s.days.includes(d)?'checked':''} style="width:16px;height:16px">${DAYS[d]}</label>`).join('')}</div></div><div class="form-grid" style="grid-template-columns:repeat(3,1fr)">${inp('start',s.start,'type="time" required','Start')}${inp('end',s.end,'type="time" required','End')}${inp('brk',s.brk,'type="number" min="0" max="240" step="5"','Break (min)')}</div>${mf('Save schedule')}</form>`)};
F.schedPre=f=>{fe(f,'end').setCustomValidity(toMin(fv(f,'end'))<=toMin(fv(f,'start'))?'End must be after start':'')};
F.sched=(v,f)=>{const days=[0,1,2,3,4,5,6].filter(d=>v['d'+d]);if(!days.length){toast('Pick at least one working day');return false}const d={name:v.name.trim(),days,start:v.start,end:v.end,brk:+v.brk||0};if(f.dataset.id){const s=S.schedules.find(x=>x.id===f.dataset.id);S.employees.forEach(e=>{if(e.schedule===s.name)e.schedule=d.name});Object.assign(s,d)}else S.schedules.push({id:uid('W'),...d,def:false});toast('Schedule saved')};
A.defSched=el=>{S.schedules.forEach(s=>s.def=s.id===el.dataset.id);save();rerender();toast('Default schedule updated')};
A.delSched=el=>{const s=S.schedules.find(x=>x.id===el.dataset.id);if(s.def){toast('Pick another default first');return}const sn=snap();const def=S.schedules.find(x=>x.def);S.employees.forEach(e=>{if(e.schedule===s.name)e.schedule=def.name});S.schedules=S.schedules.filter(x=>x!==s);save();rerender();toast('Schedule deleted',sn)};
SET.permission=(p)=>{const tab=p[0]||'admins';const tabs=tabsNav([['Admins & members','settings/permission/admins','admins'],['Roles','settings/permission/roles','roles']],tab);
  if(tab==='roles')return`<div class="card">${tabs}<div class="sec-h"><h3>Roles</h3>${btn('New role','data-act="editRole"','btn-ink btn-sm','plus')}</div><div class="grid2">${S.roles.map(r=>`<div class="sec" style="margin:0"><div class="sec-h" style="margin-bottom:6px"><b>${esc(r.name)}</b>${menu(dotsBtn,mItem('Edit permissions',`data-act="editRole" data-id="${r.id}"`,'edit')+(r.name==='Admin'?'':mItem('Delete',`data-act="delRole" data-id="${r.id}"`,'trash',true)))}</div><p class="muted" style="margin:0 0 10px;font-size:13px">${esc(r.desc)}</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="muted" style="font-size:12.5px">${plural(S.employees.filter(e=>e.role===r.name).length,'member')}</span><span class="muted" style="font-size:12.5px">${Object.values(r.perms).filter(x=>x.edit).length} can edit · ${Object.values(r.perms).filter(x=>x.view).length} can view</span></div></div>`).join('')}</div></div>`;
  const M=S.employees.filter(e=>e.role!=='Employee');
  return`<div class="card">${tabs}<div class="sec-h"><h3>People with extra access</h3>${btn('Add member','data-act="addMember"','btn-ink btn-sm','plus')}</div>${table(['Member','Role','Department',''],M.map(e=>`<tr><td>${who(e.name,e.email)}</td><td data-stop>${menu(`<button class="pill p-blue" data-act="menu" style="cursor:pointer">${esc(e.role)} ${ic('chev',12,2.4)}</button>`,S.roles.map(r=>mItem(r.name,`data-act="setRole" data-id="${e.id}" data-r="${esc(r.name)}"`,r.name===e.role?'tick':'')).join(''),'left')}</td><td>${esc(e.dept)}</td><td>${e.id==='EMP001'?'<span class="muted" style="font-size:12.5px">You</span>':`<button class="btn btn-ghost btn-sm" data-act="setRole" data-id="${e.id}" data-r="Employee">Remove access</button>`}</td></tr>`))}</div>`};
A.setRole=el=>{const e=emp(el.dataset.id);if(e.id==='EMP001'&&el.dataset.r!=='Admin'){toast('You can’t remove your own admin access');return}const s=snap();e.role=el.dataset.r;save();rerender();toast(`${e.first} is now ${e.role}`,s)};
A.addMember=()=>modal(mh('Add member','Give someone extra access.')+`<form data-form="member" novalidate><div class="form-grid" style="grid-template-columns:1fr">${sel('emp',S.employees.filter(e=>e.role==='Employee').map(e=>[e.id,e.name+' · '+e.title]),'','','Employee')}${sel('role',S.roles.filter(r=>r.name!=='Employee').map(r=>r.name),'HR Manager','','Role')}</div>${mf('Add member')}</form>`);
F.member=v=>{emp(v.emp).role=v.role;notify(`${ename(v.emp)} is now ${v.role}`,'','settings/permission','shield');toast('Member added')};
const MODS=['Employees','Time off','Attendance','Payroll','Recruitment','Documents','Reports','Settings'];
A.editRole=el=>{const r=S.roles.find(x=>x.id===el.dataset.id)||{name:'',desc:'',perms:Object.fromEntries(MODS.map(m=>[m,{view:true,edit:false}]))};modal(mh(el.dataset.id?'Edit role':'New role','Choose what this role can see and change.')+`<form data-form="role" data-id="${el.dataset.id||''}" novalidate><div class="form-grid">${inp('name',r.name,`required data-err="Name the role" ${r.name==='Admin'?'readonly':''}`,'Role name')}${inp('desc',r.desc,'','Description')}</div><div class="perm-grid" style="margin-top:16px"><div class="h">Module</div><div class="h c">View</div><div class="h c">Edit</div>${MODS.map(m=>`<div>${m}</div><div class="c"><input type="checkbox" class="chk" name="v_${m}" ${r.perms[m]?.view?'checked':''} aria-label="${m} view"></div><div class="c"><input type="checkbox" class="chk" name="e_${m}" ${r.perms[m]?.edit?'checked':''} aria-label="${m} edit"></div>`).join('')}</div>${mf('Save role')}</form>`,{wide:600})};
F.role=(v,f)=>{const perms=Object.fromEntries(MODS.map(m=>[m,{view:!!v['v_'+m]||!!v['e_'+m],edit:!!v['e_'+m]}]));if(f.dataset.id){const r=S.roles.find(x=>x.id===f.dataset.id);if(r.name!==v.name.trim())S.employees.forEach(e=>{if(e.role===r.name)e.role=v.name.trim()});Object.assign(r,{name:v.name.trim(),desc:v.desc,perms})}else S.roles.push({id:uid('R'),name:v.name.trim(),desc:v.desc,perms});toast('Role saved')};
A.delRole=el=>{const r=S.roles.find(x=>x.id===el.dataset.id);const s=snap();S.employees.forEach(e=>{if(e.role===r.name)e.role='Employee'});S.roles=S.roles.filter(x=>x!==r);save();rerender();toast('Role deleted',s)};
let intCat='All';
SET.integration=()=>{const cats=['All',...new Set(S.integrations.map(i=>i.cat))];const L=S.integrations.filter(i=>intCat==='All'||i.cat===intCat);return`<div class="card"><div class="sec-h"><h3>Integrations</h3><span class="muted">${S.integrations.filter(i=>i.on).length} connected</span></div><div style="overflow-x:auto;margin-bottom:16px">${segTabs('ic',cats,intCat,'data-ic')}</div><div class="grid2">${L.map(i=>`<div class="sec" style="margin:0;display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:12px;align-items:center"><span class="icon-sq" style="background:${i.color};color:#fff;font-size:15px">${esc(i.name.slice(0,1))}</span><div class="grow" style="flex:1"><b>${esc(i.name)}</b><small style="display:block;color:var(--muted)">${esc(i.cat)}</small></div>${i.on?pill('Connected'):''}</div><p class="muted" style="margin:0;font-size:13px">${esc(i.desc)}</p><div>${i.on?`<button class="btn btn-line btn-sm" data-act="intOff" data-id="${i.id}">Disconnect</button>`:`<button class="btn btn-ink btn-sm" data-act="intOn" data-id="${i.id}">Connect</button>`}</div></div>`).join('')}</div></div>`};
document.addEventListener('click',e=>{const b=e.target.closest('[data-ic]');if(b){intCat=b.dataset.ic;rerender()}});
A.intOn=el=>{const i=S.integrations.find(x=>x.id===el.dataset.id);modal(`<div style="display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 20px"><span class="icon-sq" style="width:56px;height:56px;background:var(--green);color:#fff">${LOGO.replace('class="h"','width="26" height="26"')}</span>${ic('arrow',22,2)}<span class="icon-sq" style="width:56px;height:56px;background:${i.color};color:#fff;font-size:22px">${esc(i.name[0])}</span></div><h2 style="text-align:center;margin:0 0 6px">Connect ${esc(i.name)}</h2><p class="sub-t" style="text-align:center">HRDashboard will be able to:</p><div class="sec">${['See your workspace name',''+i.desc,'Post updates on your behalf'].map(t=>`<div class="list-row" style="padding:8px 0">${ic('tick',16,2.4)}<span>${esc(t)}</span></div>`).join('')}</div><p class="muted" style="font-size:12.5px">Demo only: no data leaves this browser.</p><div class="modal-f"><button class="btn btn-line" data-act="close">Cancel</button><button class="btn btn-ink" data-act="intYes" data-id="${i.id}">Allow and connect</button></div>`)};
A.intYes=el=>{const i=S.integrations.find(x=>x.id===el.dataset.id);i.on=true;notify(`${i.name} connected`,'','settings/integration','plug');save();closeModal();rerender();toast(`${i.name} connected`)};
A.intOff=el=>{const i=S.integrations.find(x=>x.id===el.dataset.id);confirmBox(`Disconnect ${esc(i.name)}?`,'Syncing will stop right away.','Disconnect',()=>{const s=snap();i.on=false;save();rerender();toast(`${i.name} disconnected`,s)})};
const PLANS=[{n:'Basic',p:4,f:['Up to 25 people','Employees & directory','Time off','Email support']},{n:'Pro',p:8,f:['Unlimited people','Everything in Basic','Payroll & attendance','Recruitment','Reports']},{n:'Enterprise',p:14,f:['Everything in Pro','Custom roles','Single sign-on','Dedicated manager']}];
let planPick=null,planCycle='Monthly';
const planPrice=(p,c)=>c==='Yearly'?Math.round(p*12*.8):p;
SET.subscription=(p)=>{const tab=p[0]||'overview';const tabs=tabsNav([['Overview','settings/subscription/overview','overview'],['Billing history','settings/subscription/history','history'],['Plans','settings/subscription/plans','plans']],tab);const s=S.sub;const plan=PLANS.find(x=>x.n===s.plan);
  if(tab==='history')return`<div class="card">${tabs}${table(['Invoice','Date','Plan','Amount','Status'],s.history.map(h=>`<tr><td><b>${h.id}</b></td><td>${fmtD(h.date)}</td><td>${esc(h.plan)}</td><td class="num">$${h.amount.toLocaleString()}</td><td>${pill(h.status)}</td></tr>`))}</div>`;
  if(tab==='plans')return`<div class="card">${tabs}<div style="display:flex;justify-content:center;margin-bottom:20px"><div class="seg"><button class="${planCycle==='Monthly'?'on':''}" data-act="cycle" data-c="Monthly">Monthly</button><button class="${planCycle==='Yearly'?'on':''}" data-act="cycle" data-c="Yearly">Yearly <span class="pill p-green nodot" style="padding:1px 6px">−20%</span></button></div></div>
    <div class="grid3">${PLANS.map(x=>`<button class="plan ${(planPick||s.plan)===x.n?'on':''}" data-act="pickPlan" data-p="${x.n}"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">${x.n}</b>${x.n===s.plan?pill('Active','Current'):''}</div><div class="price">$${planPrice(x.p,planCycle)}<small> / person / ${planCycle==='Yearly'?'year':'month'}</small></div><ul>${x.f.map(f=>`<li>${ic('tick',16,2.4)}${f}</li>`).join('')}</ul></button>`).join('')}</div>
    <div class="modal-f">${btn((planPick&&(planPick!==s.plan||planCycle!==s.cycle))?`Continue with ${planPick}`:'Pick a plan','data-act="toPay" '+((planPick&&(planPick!==s.plan||planCycle!==s.cycle))?'':'disabled'),'btn-ink')}</div></div>`;
  return`<div class="card">${tabs}<div class="grid2"><div class="sec" style="margin:0;background:var(--ink);color:var(--ink-text);border:0"><span style="opacity:.7;font-size:13px">Current plan</span><div style="font-size:28px;font-weight:700;margin:6px 0">${esc(s.plan)}</div><div style="opacity:.8">$${planPrice(plan.p,s.cycle)} per person / ${s.cycle==='Yearly'?'year':'month'}</div><button class="btn btn-green btn-sm" style="margin-top:16px" data-go="settings/subscription/plans">Change plan</button></div>
  <div class="sec" style="margin:0">${[['Next invoice',fmtD(s.renews)],['Estimated amount','$'+(planPrice(plan.p,s.cycle)*S.employees.length).toLocaleString()],['Billing cycle',s.cycle],['Payment method',s.card]].map(([k,v])=>`<div class="kv" style="grid-template-columns:1fr auto"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</div></div>
  <div class="sec" style="margin-top:16px"><div class="sec-h"><h3>Seats</h3><span class="muted">${S.employees.length} of ${s.plan==='Basic'?25:'unlimited'}</span></div>${prog(s.plan==='Basic'?S.employees.length/25*100:Math.min(100,S.employees.length/50*100))}</div></div>`};
A.cycle=el=>{planCycle=el.dataset.c;rerender()};
A.pickPlan=el=>{planPick=el.dataset.p;rerender()};
A.toPay=()=>{const x=PLANS.find(p=>p.n===planPick);const total=planPrice(x.p,planCycle)*S.employees.length;
  modal(mh('Payment details',`${x.n} plan · ${planCycle.toLowerCase()} · ${S.employees.length} people`)+`<div class="demo-note">${ic('info',16,2)}<span>Demo checkout. Don’t enter real card details — only the last 4 digits are kept.</span></div><form data-form="pay" novalidate><div class="form-grid">${inp('holder',ME().name,'required data-err="Enter the name on the card"','Name on card',{full:true})}${inp('card','','inputmode="numeric" autocomplete="off" required pattern="[0-9 ]{12,23}" data-err="Enter a card number (demo)"','Card number',{full:true})}${inp('exp','','placeholder="MM/YY" required pattern="(0[1-9]|1[0-2])/[0-9]{2}" data-err="Use MM/YY"','Expiry')}${inp('cvc','','inputmode="numeric" autocomplete="off" required pattern="[0-9]{3,4}" data-err="3 or 4 digits"','CVC')}</div>
  <div class="sec" style="margin-top:16px;background:var(--surface-2);border:0">${[['Plan',`${x.n} (${planCycle})`],['People',S.employees.length],['Price per person','$'+planPrice(x.p,planCycle)]].map(([k,v])=>`<div class="kv" style="grid-template-columns:1fr auto;padding:8px 0"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}<div class="kv" style="grid-template-columns:1fr auto;border:0;padding:8px 0"><dt><b style="color:var(--text)">Total due today</b></dt><dd style="font-size:18px">$${total.toLocaleString()}</dd></div></div>${mf('Pay $'+total.toLocaleString(),'btn-green')}</form>`)};
LIVE.cardFmt=()=>{};
document.addEventListener('input',e=>{if(e.target.name==='card'&&e.target.closest('[data-form="pay"]')){const v=e.target.value.replace(/\D/g,'').slice(0,19);e.target.value=v.replace(/(.{4})/g,'$1 ').trim()}if(e.target.name==='exp'&&e.target.closest('[data-form="pay"]')){let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v}});
F.pay=v=>{const x=PLANS.find(p=>p.n===planPick);const last=v.card.replace(/\D/g,'').slice(-4);const amount=planPrice(x.p,planCycle)*S.employees.length;S.sub.plan=x.n;S.sub.cycle=planCycle;S.sub.card='Card •••• '+last;S.sub.history.unshift({id:'INV-'+(2500+S.sub.history.length),date:TODAY,plan:x.n,amount,status:'Paid'});planPick=null;
  closeModal();save();setTimeout(()=>modal(`<div style="text-align:center;padding:10px 0"><div class="ok-big">${ic('tick',40,3)}</div><h2>You’re on ${x.n}</h2><p class="sub-t">Payment received. Your invoice is in Billing history.</p><button class="btn btn-ink" data-act="close" style="margin:0 auto">Done</button></div>`),300);go('settings/subscription/overview');return'norender'};
SET.password=()=>`<form class="card" data-form="chpw" novalidate data-live="pwStrength" style="max-width:560px"><div class="sec-h"><h3>Change password</h3></div><div class="demo-note">${ic('info',16,2)}<span>Demo: passwords aren’t stored. This checks the rules only.</span></div>${pwField('current','Current password','required data-err="Enter your current password"')}<div style="height:14px"></div>${pwField('newpw','New password','required minlength="8" data-err="Use at least 8 characters"')}<div class="strength"><i></i><i></i><i></i><i></i></div><p class="hint" id="pwT" style="color:var(--faint);font-size:12px;margin:6px 0 14px">Use 8+ characters with a mix of letters, numbers and symbols.</p>${pwField('confirm','Confirm new password','required data-err="Confirm your new password"')}<div class="modal-f">${btn('Update password','','btn-ink')}</div></form>`;
F.chpwPre=f=>{const c=fe(f,'confirm');c.setCustomValidity(c.value&&c.value!==fv(f,'newpw')?'The passwords don’t match':'');const n=fe(f,'newpw');n.setCustomValidity(n.value&&n.value===fv(f,'current')?'Choose a different password from your current one':'')};
F.chpw=(v,f)=>{f.reset();f.querySelectorAll('.strength i').forEach(i=>i.style.background='');toast('Password updated');return'norender'};
SET.notifications=()=>`<form class="card" data-form="nprefs"><div class="sec-h"><h3>Notifications</h3></div>${[['leave','Time off requests','When someone asks for time off or a request changes.'],['att','Attendance','Late check-ins and missed check-outs.'],['payroll','Payroll','When payroll is ready and when it’s paid.'],['recruit','Recruitment','New applicants and candidate moves.'],['news','News','When news is published.'],['birthday','Birthdays & anniversaries','A reminder the day before.']].map(([k,t,d])=>`<div class="tog-row"><div><b>${t}</b><span class="s">${d}</span></div>${sw(k,S.nprefs[k])}</div>`).join('')}
  <div class="sec-h" style="margin-top:24px"><h3>Channels</h3></div>${[['push','Push notifications','On this device.'],['email','Email','Sent to '+esc(ME().email)+'.'],['digest','Weekly digest','A summary every Monday morning.']].map(([k,t,d])=>`<div class="tog-row"><div><b>${t}</b><span class="s">${d}</span></div>${sw(k,S.nprefs[k])}</div>`).join('')}<div class="modal-f">${btn('Save preferences','','btn-ink')}</div></form>`;
F.nprefs=v=>{Object.keys(S.nprefs).forEach(k=>S.nprefs[k]=!!v[k]);toast('Notification preferences saved')};

/* ================= NOTIFICATIONS PAGE ================= */
let nTab='All';
R.notifications=()=>{const L=S.notifs.filter(n=>nTab==='All'||(nTab==='Unread'?!n.read:n.read));const isToday=n=>new Date(n.t).toDateString()===new Date().toDateString();
  const groups=[['Today',L.filter(isToday)],['Earlier',L.filter(n=>!isToday(n))]];
  return ph('Notifications','Everything that needs your attention',`<button class="btn btn-line" data-act="readAll">${ic('tick',16,2)}Mark all as read</button><button class="btn btn-line" data-go="settings/notifications">${ic('gear',16,2)}Settings</button>`)+`<div class="card"><div class="card-h">${segTabs('nt',['All','Unread','Read'],nTab,'data-nt',t=>t==='All'?S.notifs.length:S.notifs.filter(n=>t==='Unread'?!n.read:n.read).length)}${L.length?`<button class="btn btn-ghost btn-sm" data-act="clearRead">Clear read</button>`:''}</div>
  ${L.length?groups.filter(g=>g[1].length).map(([g,G])=>`<div class="group-h">${g}</div>${G.map(n=>`<div style="display:flex;align-items:center;gap:6px"><button class="notif ${n.read?'':'unread'}" data-notif="${n.id}"><span class="icon-sq">${ic(n.icon,18,2)}</span><div class="grow"><b style="font-weight:600">${esc(n.title)}</b><p>${esc(n.body)}</p><small>${ago(n.t)}</small></div></button>${menu(dotsBtn,mItem(n.read?'Mark as unread':'Mark as read',`data-act="nToggle" data-id="${n.id}"`,'tick')+mItem('Delete',`data-act="nDel" data-id="${n.id}"`,'trash',true))}</div>`).join('')}`).join(''):emptyState('bell','Nothing here','You’re all caught up.')}</div>`};
document.addEventListener('click',e=>{const b=e.target.closest('[data-nt]');if(b){nTab=b.dataset.nt;rerender()}});
A.nToggle=el=>{const n=S.notifs.find(x=>x.id===el.dataset.id);n.read=!n.read;save();rerender()};
A.nDel=el=>{const s=snap();S.notifs=S.notifs.filter(x=>x.id!==el.dataset.id);save();rerender();toast('Notification deleted',s)};
A.clearRead=()=>{const s=snap();S.notifs=S.notifs.filter(n=>!n.read);save();rerender();toast('Read notifications cleared',s)};

/* ================= MESSAGES ================= */
const REPLIES=['Thanks, that helps!','Got it 👍','Sounds good, thank you.','I’ll take a look and get back to you.','Perfect, appreciate it!','Sure, no problem.'];
let msgQ='',pendingAtt=null;
A.msgEmp=el=>{const id=el.dataset.id;if(id==='EMP001'){toast('That’s you!');return}let t=S.threads.find(x=>x.emp===id);if(!t){t={id:uid('TH'),emp:id,unread:0,msgs:[]};S.threads.unshift(t);save()}closeModal();go('messages/'+t.id)};
R.messages=(p)=>{const cur=S.threads.find(t=>t.id===p[0]);if(cur&&cur.unread){cur.unread=0;save();setTimeout(renderNav,0)}const q=msgQ.toLowerCase();
  const L=S.threads.filter(t=>!q||ename(t.emp).toLowerCase().includes(q)).sort((a,b)=>(b.msgs.at(-1)?.t||0)-(a.msgs.at(-1)?.t||0));
  return`<div class="chat ${cur?'has':''}"><div class="chat-list"><div class="hd"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Messages</h3><button class="icon-btn" data-act="newChat" aria-label="New message">${ic('edit',18,2)}</button></div><div class="inp-ic">${ic('search',18,2)}<input class="inp" placeholder="Search" value="${esc(msgQ)}" data-live="msgQ" aria-label="Search conversations"></div></div><div class="chat-items">${L.map(t=>{const m=t.msgs.at(-1);return`<button class="chat-item ${cur&&cur.id===t.id?'on':''}" data-go="messages/${t.id}">${av(ename(t.emp),'','width:40px;height:40px;font-size:13px')}<div class="grow"><b>${esc(ename(t.emp))}</b><small>${m?(m.from==='me'?'You: ':'')+esc(m.text||'📎 '+(m.file?.name||'File')):'No messages yet'}</small></div><div class="meta">${m?ago(m.t):''}${t.unread?`<span class="unread">${t.unread}</span>`:''}</div></button>`}).join('')||'<p class="muted" style="padding:18px">No conversations.</p>'}</div></div>
  <div class="chat-main">${cur?chatMain(cur):`<div style="flex:1;display:grid;place-items:center">${emptyState('chat','Pick a conversation','Or start a new one.',btn('New message','data-act="newChat"','btn-ink btn-sm','edit'))}</div>`}</div></div>`};
function chatMain(t){const e=emp(t.emp)||{name:'Former employee',title:''};let lastDay='';
  return`<div class="hd"><button class="icon-btn menu-btn" data-go="messages" aria-label="Back to conversations" style="display:${innerWidth<=880?'grid':'none'}">${ic('left',20,2)}</button>${av(e.name,'','width:40px;height:40px;font-size:13px')}<div style="flex:1"><b>${esc(e.name)}</b><div class="muted" style="font-size:12.5px">${esc(e.title)}</div></div><button class="btn btn-line btn-sm" data-go="emp/${t.emp}/general">Profile</button></div>
  <div class="msgs" id="msgs">${t.msgs.map(m=>{const d=new Date(m.t).toDateString();const sep=d!==lastDay?`<span class="date-sep">${d===new Date().toDateString()?'Today':new Date(m.t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</span>`:'';lastDay=d;return sep+`<div class="msg ${m.from==='me'?'me':''}">${m.file?`<div class="att">${ftype(m.file.name)}<span>${esc(m.file.name)}<br><small style="opacity:.7">${kb(m.file.size)}</small></span></div>`:''}${esc(m.text)}<time>${clock(m.t)}</time></div>`}).join('')||'<p class="muted" style="text-align:center;margin:auto">Say hello 👋</p>'}</div>
  ${pendingAtt?`<div class="att-chip">${ftype(pendingAtt.name)}<b>${esc(pendingAtt.name)}</b><span class="muted">${kb(pendingAtt.size)}</span><button class="icon-btn" style="width:26px;height:26px" data-act="rmAtt" aria-label="Remove attachment">${ic('x',14,2)}</button></div>`:''}
  <form class="composer" data-form="msg" data-id="${t.id}"><label class="icon-btn" style="position:relative;overflow:hidden;cursor:pointer" title="Attach a file">${ic('clip',20,2)}<input type="file" style="position:absolute;inset:0;opacity:0;cursor:pointer" data-live="msgFile" aria-label="Attach a file"></label><textarea class="inp" name="text" placeholder="Write a message…" rows="1" aria-label="Message" data-enter></textarea><button class="btn btn-green" style="height:46px" aria-label="Send">${ic('send',18,2)}</button></form>`}
AFTER.messages=()=>{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;const ta=$('[data-enter]');if(ta){ta.focus();ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ta.form.requestSubmit()}});ta.addEventListener('input',()=>{ta.style.height='46px';ta.style.height=Math.min(120,ta.scrollHeight)+'px'})}};
LIVE.msgQ=t=>{msgQ=t.value;const pos=t.selectionStart;rerender();const n=$('[data-live="msgQ"]');n&&(n.focus(),n.setSelectionRange(pos,pos))};
LIVE.msgFile=t=>{const f=t.files[0];if(f){pendingAtt={name:f.name,size:f.size};rerender()}};
A.rmAtt=()=>{pendingAtt=null;rerender()};
F.msg=(v,f)=>{const t=S.threads.find(x=>x.id===f.dataset.id);const text=v.text.trim();if(!text&&!pendingAtt)return false;t.msgs.push({from:'me',text,t:Date.now(),file:pendingAtt});pendingAtt=null;save();rerender();
  const m=$('#msgs');if(m){m.insertAdjacentHTML('beforeend','<div class="typing" id="typing"><i></i><i></i><i></i></div>');m.scrollTop=m.scrollHeight}
  setTimeout(()=>{t.msgs.push({from:'them',text:REPLIES[Math.floor(Math.random()*REPLIES.length)],t:Date.now()});if(!(route==='messages'&&params[0]===t.id))t.unread++;save();if(route==='messages')rerender();else renderNav()},1400+Math.random()*900);return'norender'};
A.newChat=()=>modal(mh('New message','')+`<form data-form="newChat">${sel('emp',S.employees.filter(e=>e.id!=='EMP001').map(e=>[e.id,e.name+' · '+e.title]),'','','To')}${mf('Start conversation')}</form>`);
F.newChat=v=>{A.msgEmp({dataset:{id:v.emp}});return'norender'};

/* ================= HELP CENTER ================= */
const FAQ=[['How do I add a new employee?','Go to Employees → Manage employees and click “Add new profile”. Fill in personal, job and payroll details. They’ll show up in the directory, payroll and org chart right away.'],['How do people request time off?','From Time Off → My time off, click “New request”, pick the type and dates, and send. Managers review requests in Team time off or straight from the notification menu.'],['Can I change an attendance record?','Yes, within 31 days. Open My attendance or Employee attendance, click Edit on the row, and adjust the times or paid hours.'],['How is net pay calculated?','Net pay = salary + overtime + bonus + allowance − tax − insurance − other deductions. Tax and insurance rates are set in Payroll → Settings.'],['How do I move a candidate to the next stage?','Open the job’s pipeline and drag the card to another column, use the arrows on the card, or use the stage menu in table view.'],['Where is my data stored?','In this demo, everything is saved in your browser only. Clearing your browser data resets it.'],['Can I undo a change?','Most changes show an Undo button in the message at the bottom of the screen for a few seconds.']];
const PRIVACY=`<h3>What we collect</h3><p>We store the information you enter about your company and your people: names, contact details, job details, time off, attendance and pay.</p><h3>How we use it</h3><p>Only to run HR features for your company: showing profiles, calculating balances and pay, and sending notifications you’ve turned on.</p><h3>Who can see it</h3><p>People in your company, based on the roles you set in Settings → Permission. We never sell your data.</p><h3>Where it lives</h3><p>In this demo, all data stays in your browser’s local storage and isn’t sent to any server.</p><h3>Your choices</h3><p>You can edit or delete any record, and reset all demo data from Settings.</p><h3>Contact</h3><p>Questions? Reach us from Help center → Contact support.</p>`;
const SHORTCUTS=[[['/'],'Search people, pages and actions'],[['?'],'Open keyboard shortcuts'],[['Esc'],'Close a window or menu'],[['g','d'],'Go to dashboard'],[['g','e'],'Go to employees'],[['g','t'],'Go to time off'],[['g','a'],'Go to attendance'],[['g','p'],'Go to payroll'],[['g','r'],'Go to recruitment'],[['g','o'],'Go to documents'],[['g','n'],'Go to news'],[['g','x'],'Go to reports'],[['g','m'],'Go to messages'],[['g','c'],'Go to to-do'],[['g','s'],'Go to settings'],[['n'],'New item on the current page'],[['Enter'],'Send a message (Shift+Enter for a new line)']];
let helpQ='';
R.help=(p)=>{const sub=p[0];const crumbs=t=>phBack(t,'help',`<button data-go="help">Help center</button>${ic('right',14,2)}<b>${t}</b>`);
  if(sub==='faq'){const q=helpQ.toLowerCase();const L=FAQ.filter(([a,b])=>!q||(a+b).toLowerCase().includes(q));return crumbs('FAQ')+`<div class="card"><div class="inp-ic" style="max-width:420px;margin-bottom:10px">${ic('search',18,2)}<input class="inp" placeholder="Search questions" value="${esc(helpQ)}" data-live="helpQ" aria-label="Search FAQ"></div>${L.map(([a,b],i)=>`<div class="acc ${q&&i===0?'open':''}"><button data-act="acc" aria-expanded="false">${esc(a)}${ic('plus',18,2)}</button><div class="acc-b"><div><p>${esc(b)}</p></div></div></div>`).join('')||emptyState('search','No questions match','Try different words, or contact support.',btn('Contact support','data-go="help/contact"','btn-line btn-sm'))}</div>`}
  if(sub==='privacy')return crumbs('Privacy Policy')+`<div class="card"><p class="muted" style="margin-top:0">Last updated ${fmtD(iso(new Date(today.getFullYear(),0,15)))}</p><div class="prose">${PRIVACY}</div></div>`;
  if(sub==='shortcuts')return crumbs('Keyboard Shortcuts')+`<div class="card"><p class="muted" style="margin-top:0">These work anywhere, except while typing in a field.</p>${SHORTCUTS.map(([k,d])=>`<div class="tog-row"><span>${d}</span><span style="display:flex;gap:6px;align-items:center">${k.map((x,i)=>(i?'<span class="muted" style="font-size:12px">then</span>':'')+`<kbd class="kbd-k">${x}</kbd>`).join('')}</span></div>`).join('')}</div>`;
  if(sub==='contact')return crumbs('Contact Support')+`<div class="split" style="grid-template-columns:minmax(0,1fr) 320px"><form class="card" data-form="ticket" novalidate><div class="sec-h"><h3>Send us a message</h3></div><div class="form-grid">${inp('name',ME().name,'required','Your name')}${inp('email',ME().email,'type="email" required data-err="Enter a valid email"','Email')}${sel('cat',['Question','Bug report','Billing','Feature request'],'Question','','Topic',{full:true})}${inp('subject','','required data-err="Add a subject"','Subject',{full:true})}${ta('msg','','rows="6" required data-err="Tell us what’s going on"','Message',{full:true})}</div><div class="modal-f">${btn('Send message','','btn-ink','send')}</div></form>
    <div><div class="card" style="margin-bottom:16px">${[['mail','Email',' support@hrdashboard.app'],['phone','Phone',' +1 555 0199'],['clock','Hours',' Mon–Fri, 9:00–17:00']].map(([i,k,v])=>`<div class="list-row"><span class="icon-sq">${ic(i,18,2)}</span><div class="grow"><small>${k}</small><b>${v}</b></div></div>`).join('')}</div>
    <div class="card"><h3 style="font-size:16px;margin-bottom:8px">Your requests</h3>${S.tickets.length?S.tickets.map(t=>`<div class="list-row"><div class="grow"><b style="font-size:13.5px">${esc(t.subject)}</b><small>${esc(t.cat)} · ${ago(t.t)}</small></div>${pill('Pending','Open')}</div>`).join(''):'<p class="muted" style="margin:0;font-size:13px">No requests yet.</p>'}</div></div></div>`;
  return`<div class="help-hero"><h1>How can we help?</h1><p>Search guides, or browse the topics below.</p><div class="inp-ic">${ic('search',18,2)}<input class="inp" placeholder="Search for answers" data-act-enter="helpSearch" aria-label="Search help" id="helpSearch"></div></div>
  <div class="grid2">${[['help/faq','FAQ','Answers to common questions.','help'],['help/shortcuts','Keyboard shortcuts','Move faster around the app.','kbd'],['help/privacy','Privacy policy','How we handle your data.','shield'],['help/contact','Contact support','Get in touch with our team.','headset']].map(([g,t,d,i])=>`<button class="tile" data-go="${g}"><span class="ti">${ic(i,20,1.8)}</span><h3>${t}</h3><p>${d}</p></button>`).join('')}</div>
  <div class="card" style="margin-top:24px"><h3 style="margin-bottom:8px">Popular questions</h3>${FAQ.slice(0,4).map(([a,b])=>`<div class="acc"><button data-act="acc" aria-expanded="false">${esc(a)}${ic('plus',18,2)}</button><div class="acc-b"><div><p>${esc(b)}</p></div></div></div>`).join('')}</div>`};
AFTER.help=()=>{const s=$('#helpSearch');if(s)s.addEventListener('keydown',e=>{if(e.key==='Enter'){helpQ=s.value;go('help/faq')}})};
LIVE.helpQ=t=>{helpQ=t.value;const pos=t.selectionStart;rerender();const n=$('[data-live="helpQ"]');n&&(n.focus(),n.setSelectionRange(pos,pos))};
A.acc=el=>{const a=el.parentElement;a.classList.toggle('open');el.setAttribute('aria-expanded',a.classList.contains('open'))};
F.ticket=v=>{S.tickets.unshift({id:uid('TK'),...v,t:Date.now()});notify('We got your message','Support usually replies within a day.','help/contact','headset');toast('Message sent. We’ll reply by email.')};

/* ================= BOOT ================= */
function boot(){
  const parts=parse();
  if(S.session&&!AUTH.has(parts[0])){const root=$('#root');root.innerHTML=shellHtml();root.dataset.mode='app';syncTheme();renderNav();
    $('#view').innerHTML=`<div class="sk" style="height:28px;width:240px;margin-bottom:10px"></div><div class="sk" style="height:16px;width:300px;margin-bottom:26px"></div><div class="card dash-top"><div class="stat-grid">${'<div class="stat"><div class="sk" style="width:48px;height:48px;border-radius:50%;margin-bottom:22px"></div><div class="sk" style="height:30px;width:60%;margin-bottom:12px"></div><div class="sk" style="height:14px;width:45%"></div></div>'.repeat(4)}</div><div><div class="sk" style="height:22px;width:180px;margin-bottom:18px"></div><div class="sk" style="height:230px"></div></div></div><div class="dash-bot"><div class="card"><div class="sk" style="height:22px;width:140px;margin-bottom:20px"></div>${'<div class="sk" style="height:42px;margin-bottom:10px"></div>'.repeat(4)}</div><div class="card"><div class="sk" style="height:200px;width:200px;border-radius:50%;margin:10px auto"></div></div></div>`;
    setTimeout(()=>render(true),RM?0:650)}else render(true);
}
boot();
})();


</script>
</body>
</html>
