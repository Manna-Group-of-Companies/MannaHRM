LIVE.payCalc=(t,f)=>{const e=emp(f.dataset.id);const g=e.salary+(+fv(f,'ot')||0)+(+fv(f,'bonus')||0)+(+fv(f,'allow')||0);const n=g-Math.round(e.salary*S.paySet.tax/100)-Math.round(e.salary*S.paySet.insurance/100)-(+fv(f,'deduct')||0);f.querySelector('#pNet').textContent=money(n)};
F.payEdit=(v,f)=>{Object.assign(S.pay[f.dataset.id],{ot:+v.ot||0,bonus:+v.bonus||0,allow:+v.allow||0,deduct:+v.deduct||0});toast('Pay saved')};
R.payslip=(p)=>{const e=emp(p[0]);if(!e)return R.notfound();const m=p[1]||payMonth;const n=netPay(e);const isCur=m===TODAY.slice(0,7)||m===payMonth;const paid=isCur?S.pay[e.id].paid:true;
  const row=(l,v,neg)=>`<div class="kv" style="grid-template-columns:1fr auto"><dt>${l}</dt><dd class="num" style="${neg?'color:var(--red-ink)':''}">${neg?'−':''}${money(v)}</dd></div>`;
  return phBack('Payroll Detail','payroll',`<button data-go="payroll">Payroll</button>${ic('right',14,2)}<b>${esc(e.name)}</b>`,`<button class="btn btn-line" data-act="print">${ic('print',16,2)}Print</button>${isCur?`<button class="btn btn-line" data-act="payEdit" data-id="${e.id}">${ic('edit',16,2)}Edit</button>`:''}${isCur&&!paid?`<button class="btn btn-green" data-act="payOne" data-id="${e.id}">${ic('tick',16,2)}Mark paid</button>`:''}`)+
  `<div class="split"><div class="card profile-card">${av(e.name,'xl')}<h2 style="margin:0;font-size:18px">${esc(e.name)}</h2><div class="muted">${esc(e.title)}</div><div style="margin-top:10px">${pill(paid?'Paid':'Unpaid')}</div>
  <div class="pc-list">${[['Employee ID',e.id],['Department',e.dept],['Pay period',fmtM(m)],['Pay day',fmtD(iso(new Date(+m.slice(0,4),+m.slice(5,7)-1,Math.min(28,S.paySet.payday))))],['Method',S.paySet.method],['Bank',`${e.bank.name||'—'} ${e.bank.acct||''}`]].map(([k,v])=>`<div class="r" style="justify-content:space-between;gap:10px"><span class="muted">${k}</span><b style="text-align:right">${esc(v)}</b></div>`).join('')}</div>
  <div style="margin-top:16px">${sel('m',(()=>{const a=[];for(let i=0;i<6;i++){const d=new Date(today.getFullYear(),today.getMonth()-i,1);a.push([iso(d).slice(0,7),fmtM(iso(d).slice(0,7))])}return a})(),m,`data-ch="slipMonth" data-id="${e.id}"`,'Payslip for')}</div></div>
  <div class="card"><div class="card-h"><h3>Payslip · ${fmtM(m)}</h3><span class="muted">${esc(S.company.name)}</span></div>
  <div class="grid2"><div class="sec" style="margin:0"><div class="sec-h"><h3>Earnings</h3></div>${row('Base salary',n.base)}${row('Overtime',n.ot)}${row('Bonus',n.bonus)}${row('Allowance',n.allow)}<div class="kv" style="grid-template-columns:1fr auto;border:0"><dt><b style="color:var(--text)">Gross pay</b></dt><dd class="num">${money(n.gross)}</dd></div></div>
  <div class="sec" style="margin:0"><div class="sec-h"><h3>Deductions</h3></div>${row(`Income tax (${S.paySet.tax}%)`,n.tax,1)}${row(`Insurance (${S.paySet.insurance}%)`,n.ins,1)}${row('Other deductions',n.other,1)}<div class="kv" style="grid-template-columns:1fr auto;border:0"><dt><b style="color:var(--text)">Total deductions</b></dt><dd class="num" style="color:var(--red-ink)">−${money(n.tax+n.ins+n.other)}</dd></div></div></div>
  <div class="sec" style="margin-top:16px;background:var(--green-soft);border:0;display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:15px">Net pay</b><div class="muted" style="font-size:13px">Paid to ${esc(e.bank.name||'bank account')} ${esc(e.bank.acct||'')}</div></div><b style="font-size:28px;color:var(--green-ink)" class="num">${money(n.net)}</b></div>
  <div class="sec" style="margin-top:16px"><div class="sec-h"><h3>Year to date</h3></div><div class="grid3">${[['Gross',n.gross*(today.getMonth()+1)],['Deductions',(n.tax+n.ins+n.other)*(today.getMonth()+1)],['Net',n.net*(today.getMonth()+1)]].map(([k,v])=>`<div><div class="muted" style="font-size:13px">${k}</div><b class="num" style="font-size:18px">${money(v)}</b></div>`).join('')}</div></div></div></div>`};
CH.slipMonth=t=>go(`payslip/${t.dataset.id}/${t.value}`);
R['payroll-settings']=(p)=>{const tab=p[0]||'general';const s=S.paySet;const tabs=tabsNav([['General','payroll-settings/general','general'],['Pay cycle','payroll-settings/cycle','cycle']],tab);
  if(tab==='cycle'){const next=[];let d=D(s.first||TODAY);const step=s.cycle==='Monthly'?0:s.cycle==='Biweekly'?14:7;for(let i=0;i<6;i++){next.push(iso(d));d=step?addDays(d,step):new Date(d.getFullYear(),d.getMonth()+1,Math.min(28,s.payday))}
    return ph('Payroll Settings','How often and when people get paid')+`<form class="card" data-form="payCycle" novalidate>${tabs}<div class="grid2"><div class="form-grid" style="grid-template-columns:1fr">${sel('cycle',['Monthly','Biweekly','Weekly'],s.cycle,'','Pay frequency')}${inp('payday',s.payday,'type="number" min="1" max="28" required data-err="Pick a day between 1 and 28"','Pay day of the month',{hint:'Used for monthly pay.'})}${inp('cutoff',s.cutoff,'type="number" min="1" max="28" required','Attendance cut-off day',{hint:'Hours after this day move to the next cycle.'})}${inp('first',s.first,'type="date" required','First pay date')}</div>
    <div class="sec" style="margin:0"><div class="sec-h"><h3>Upcoming pay dates</h3></div>${next.map((x,i)=>`<div class="list-row"><span class="icon-sq">${ic('calendar',18,2)}</span><div class="grow"><b>${fmtD(x)}</b><small>${D(x).toLocaleDateString('en-US',{weekday:'long'})}</small></div>${i===0?pill('Due','Next'):''}</div>`).join('')}</div></div><div class="modal-f">${btn('Save changes','','btn-ink')}</div></form>`}
  return ph('Payroll Settings','Currency, tax and payment method')+`<form class="card" data-form="paySet" novalidate>${tabs}<div class="form-grid" style="max-width:680px">${inp('currency',S.company.currency,'maxlength="3" required data-err="Enter a currency symbol"','Currency symbol')}${sel('method',['Bank transfer','Cheque','Cash','Payroll card'],s.method,'','Payment method')}${inp('tax',s.tax,'type="number" min="0" max="60" step="0.5" required','Income tax (%)')}${inp('insurance',s.insurance,'type="number" min="0" max="30" step="0.5" required','Insurance (%)')}${inp('ot',s.ot,'type="number" min="1" max="3" step="0.25" required','Overtime rate (× hourly pay)')}</div><div class="modal-f">${btn('Save changes','','btn-ink')}</div></form>`};
F.paySet=v=>{S.company.currency=v.currency.trim();Object.assign(S.paySet,{method:v.method,tax:+v.tax,insurance:+v.insurance,ot:+v.ot});toast('Payroll settings saved')};
F.payCycle=v=>{Object.assign(S.paySet,{cycle:v.cycle,payday:+v.payday,cutoff:+v.cutoff,first:v.first});toast('Pay cycle saved')};

/* ================= PERFORMANCE ================= */
let rvTab='All';
R.performance=()=>{const L=S.reviews.filter(r=>rvTab==='All'||r.status===rvTab);const done=S.reviews.filter(r=>r.status==='Completed');const avg=done.length?(done.reduce((s,r)=>s+r.rating,0)/done.length).toFixed(1):'—';
  return ph('Performance','Reviews and goals for this cycle',btn('Start review','data-act="newReview"','btn-ink','plus'))+`<div class="mini-grid">${[['Reviews this cycle',S.reviews.length],['Completed',done.length],['In progress',S.reviews.filter(r=>r.status==='In progress').length],['Average rating',avg]].map(([t,v])=>`<div class="mini"><div class="mini-t">${t}</div><div class="mini-v"><b>${v}</b></div></div>`).join('')}</div>
  <div class="card"><div class="card-h">${segTabs('rv',['All','Not started','In progress','Completed'],rvTab,'data-rv',t=>t==='All'?S.reviews.length:S.reviews.filter(r=>r.status===t).length)}</div>${L.length?table(['Employee','Period','Reviewer','Goals','Rating','Status',''],L.map(r=>{const e=emp(r.emp)||{name:'Former employee',title:''};const gp=r.goals.length?r.goals.reduce((s,g)=>s+g.p,0)/r.goals.length:0;return`<tr class="click" data-act="openReview" data-id="${r.id}"><td>${who(e.name,e.title)}</td><td>${esc(r.period)}</td><td>${esc(ename(r.reviewer))}</td><td style="min-width:140px">${prog(gp)}</td><td>${r.rating?stars(r.rating,'',true):'—'}</td><td>${pill(r.status)}</td><td><span class="row-go">${ic('right',16,2)}</span></td></tr>`})):emptyState('trend','No reviews here','Start a review to track goals and feedback.')}</div>`};
document.addEventListener('click',e=>{const b=e.target.closest('[data-rv]');if(b){rvTab=b.dataset.rv;rerender()}});
A.newReview=()=>modal(mh('Start a review','Pick who to review this cycle.')+`<form data-form="newReview" novalidate><div class="form-grid">${sel('emp',S.employees.map(e=>[e.id,e.name]),'','','Employee',{full:true})}${sel('reviewer',S.employees.map(e=>[e.id,e.name]),'EMP001','','Reviewer')}${inp('period','H2 '+today.getFullYear(),'required','Period')}${inp('goal','','placeholder="e.g. Improve onboarding NPS"','First goal (optional)',{full:true})}</div>${mf('Start review')}</form>`);
F.newReview=v=>{const r={id:uid('RV'),emp:v.emp,reviewer:v.reviewer,period:v.period,status:'Not started',rating:0,goals:v.goal?[{t:v.goal,p:0}]:[],note:''};S.reviews.unshift(r);toast('Review started');setTimeout(()=>A.openReview({dataset:{id:r.id}}),300)};
A.openReview=el=>{const r=S.reviews.find(x=>x.id===el.dataset.id);const e=emp(r.emp)||{name:'Former employee',title:''};
  modal(`<div class="m-head"><div style="display:flex;gap:14px;align-items:center">${av(e.name,'lg')}<div><h2 style="margin:0;font-size:19px">${esc(e.name)}</h2><div class="muted">${esc(e.title)} · ${esc(r.period)}</div></div></div><button class="icon-btn" data-act="close" aria-label="Close">${ic('x',20,2)}</button></div>
  <form data-form="review" data-id="${r.id}" novalidate style="margin-top:20px">${sel('status',['Not started','In progress','Completed'],r.status,'','Status')}
  <div class="field" style="margin:16px 0"><label>Overall rating</label>${stars(r.rating,'data-rate')}<input type="hidden" name="rating" value="${r.rating}"></div>
  <div class="sec-h" style="margin-top:20px"><h3>Goals</h3><button type="button" class="btn btn-line btn-sm" data-act="addGoal">${ic('plus',14,2)}Add goal</button></div><div id="goals">${r.goals.map((g,i)=>goalRow(g,i)).join('')}</div>
  ${ta('note',r.note,'placeholder="Strengths, areas to grow, next steps"','Feedback',{style:'margin-top:16px'})}${mf('Save review')}</form>`,{drawer:true})};
const goalRow=(g,i)=>`<div class="sec" style="padding:12px;margin-bottom:8px"><input class="inp" name="gt${i}" value="${esc(g.t)}" aria-label="Goal" style="margin-bottom:8px" placeholder="Goal"><div style="display:flex;gap:10px;align-items:center"><input type="range" name="gp${i}" min="0" max="100" step="5" value="${g.p}" style="flex:1;accent-color:var(--green)" aria-label="Progress" data-live="gp"><b class="num" style="min-width:40px;text-align:right">${g.p}%</b></div></div>`;
LIVE.gp=(t)=>{t.nextElementSibling.textContent=t.value+'%'};
A.addGoal=()=>{const g=$('#goals');g.insertAdjacentHTML('beforeend',goalRow({t:'',p:0},g.children.length));g.lastElementChild.querySelector('input').focus()};
F.review=(v,f)=>{const r=S.reviews.find(x=>x.id===f.dataset.id);r.status=v.status;r.rating=+v.rating||0;r.note=v.note;r.goals=[];for(let i=0;v['gt'+i]!==undefined;i++)if(v['gt'+i].trim())r.goals.push({t:v['gt'+i].trim(),p:+v['gp'+i]});toast('Review saved')};


/* ================= RECRUITMENT ================= */
const JSTAT=['Open','On hold','Draft','Closed'];
let jobTab='All',jobQ='';
const stageName=c=>{const j=job(c.job);return c.rejected?'Rejected':(j?j.stages[c.stage]:'')||'Applied'};
R.jobs=()=>{const q=jobQ.toLowerCase();const L=S.jobs.filter(j=>(jobTab==='All'||j.status===jobTab)&&(!q||j.title.toLowerCase().includes(q)));
  return ph('Jobs','Open roles and how far applicants have got',btn('Post a job','data-go="job-new"','btn-ink','plus'))+`<div class="card" style="margin-bottom:20px"><div class="card-h" style="margin:0">${segTabs('jt',['All',...JSTAT],jobTab,'data-jt',t=>t==='All'?S.jobs.length:S.jobs.filter(j=>j.status===t).length)}<div class="inp-ic" style="min-width:240px">${ic('search',18,2)}<input class="inp" placeholder="Search jobs" value="${esc(jobQ)}" data-live="jobQ" aria-label="Search jobs"></div></div></div>
  <div class="jobs" id="jobGrid">${jobCards(L)}</div>`};
KEYN.jobs=()=>go('job-new');
const jobCards=L=>L.length?L.map(j=>{const c=S.cands.filter(x=>x.job===j.id&&!x.rejected);return`<div class="card job lift"><div class="card-h" style="margin:0;align-items:flex-start"><button data-go="job/${j.id}/pipeline" style="text-align:left"><h3>${esc(j.title)}</h3><div class="muted" style="margin-top:4px;font-size:13px">${esc(j.dept)} · ${plural(j.openings,'opening')}</div></button>
  ${menu(`<button class="pill ${PC[j.status]}" data-act="menu" style="cursor:pointer" aria-label="Change status">${j.status} ${ic('chev',12,2.4)}</button>`,JSTAT.map(s=>mItem(s,`data-act="jobStatus" data-id="${j.id}" data-s="${s}"`,s===j.status?'tick':'')).join(''))}</div>
  <div class="job-meta"><span class="pill p-grey nodot">${esc(j.type)}</span><span class="pill p-grey nodot">${ic('pin',12,2)}${esc(j.loc)}</span><span class="pill p-grey nodot">${money(j.salMin)}–${money(j.salMax)}</span></div>
  <div class="funnel">${j.stages.map((s,i)=>{const n=c.filter(x=>x.stage>=i).length;return`<div title="${esc(s)}: ${n}"><div class="bar"><i style="width:${c.length?n/c.length*100:0}%"></i></div><small>${n}</small></div>`}).join('')}</div>
  <div class="job-f"><span>${plural(c.length,'applicant')} · posted ${fmtS(j.posted)}</span><button class="btn btn-ink btn-sm" data-go="job/${j.id}/pipeline">Candidates ${ic('arrow',14,2)}</button></div></div>`}).join(''):`<div class="card" style="grid-column:1/-1">${emptyState('brief','No jobs here','Post a role to start collecting applicants.',btn('Post a job','data-go="job-new"','btn-ink btn-sm'))}</div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-jt]');if(b){jobTab=b.dataset.jt;rerender()}});
LIVE.jobQ=t=>{jobQ=t.value;const q=jobQ.toLowerCase();$('#jobGrid').innerHTML=jobCards(S.jobs.filter(j=>(jobTab==='All'||j.status===jobTab)&&j.title.toLowerCase().includes(q)))};
A.jobStatus=el=>{const s=snap(),j=job(el.dataset.id);j.status=el.dataset.s;save();rerender();toast(`${j.title} is now ${j.status}`,s)};
let jdQ='';
R.job=(p)=>{const j=job(p[0]);if(!j)return R.notfound();const view=p[1]||'pipeline';const q=jdQ.toLowerCase();
  const C=S.cands.filter(c=>c.job===j.id&&(!q||c.name.toLowerCase().includes(q)));
  const head=`<div class="ph"><div><h1>Recruitment</h1><div class="crumbs"><button data-go="jobs">List job</button>${ic('right',14,2)}<b>${esc(j.title)}</b> ${pill(j.status)}</div></div><div class="ph-act" style="align-items:center">
  <div class="inp-ic" style="min-width:220px">${ic('search',18,2)}<input class="inp" placeholder="Search candidates" value="${esc(jdQ)}" data-live="jdQ" aria-label="Search candidates"></div>
  ${menu(`<button class="btn btn-ink" data-act="menu">Add candidates ${ic('chev',16,2)}</button>`,mItem('Add manually',`data-act="newCand" data-j="${j.id}"`,'user')+mItem('Bulk upload CVs',`data-act="bulkCv" data-j="${j.id}"`,'upload'))}
  <div class="seg ic" role="group" aria-label="View"><button class="${view==='table'?'on':''}" data-go="job/${j.id}/table" aria-label="Table view" title="Table view">${ic('list',16,2)}</button><button class="${view==='pipeline'?'on':''}" data-go="job/${j.id}/pipeline" aria-label="Pipeline view" title="Pipeline view">${ic('board',16,2)}</button></div>
  <button class="icon-btn ${view==='activity'?'on':''}" data-go="job/${j.id}/activity" aria-label="Activity" title="Activity">${ic('clock',20,2)}</button><button class="icon-btn" data-act="editJob" data-id="${j.id}" aria-label="Edit job" title="Edit job">${ic('edit',20,2)}</button></div></div>`;
  if(view==='activity'){const acts=S.cands.filter(c=>c.job===j.id).flatMap(c=>c.activity.map(a=>({...a,c}))).sort((a,b)=>b.t-a.t);
    return head+`<div class="card"><div class="card-h"><h3>Activity</h3><span class="muted">${plural(acts.length,'event')}</span></div>${acts.length?`<div class="tl">${acts.slice(0,40).map(a=>`<div class="tl-i"><b>${esc(a.c.name)}</b> · ${esc(a.m)}<small>${ago(a.t)}</small></div>`).join('')}</div>`:emptyState('clock','No activity yet','Moves, emails and notes will show up here.')}</div>`}
  if(view==='table')return head+`<div class="card">${C.length?table(['Candidate','Stage','Source','Applied','Rating','Tags',''],C.map(c=>{const r=Object.values(c.rating);const avg=r.length?Math.round(r.reduce((a,b)=>a+b,0)/r.length):0;return`<tr class="click" data-go="applicant/${c.id}/profile"><td>${who(c.name,c.email)}</td><td data-stop>${menu(`<button class="pill ${c.rejected?'p-red':c.stage===j.stages.length-1?'p-green':'p-blue'}" data-act="menu" style="cursor:pointer">${esc(stageName(c))} ${ic('chev',12,2.4)}</button>`,j.stages.map((s,i)=>mItem(s,`data-act="moveTo" data-id="${c.id}" data-s="${i}"`,!c.rejected&&i===c.stage?'tick':'')).join('')+'<hr>'+mItem('Reject',`data-act="reject" data-id="${c.id}"`,'x',true))}</td><td>${esc(c.source)}</td><td>${fmtD(c.applied)}</td><td>${avg?stars(avg,'',true):'—'}</td><td>${c.tags.map(t=>`<span class="tag" style="padding:3px 8px">${esc(t)}</span>`).join(' ')||'—'}</td><td><span class="row-go">${ic('right',16,2)}</span></td></tr>`})):emptyState('users','No candidates yet','Add someone manually or upload CVs.')}</div>`;
  return head+`<div class="board" style="grid-template-columns:repeat(${j.stages.length},minmax(240px,1fr))">${j.stages.map((s,i)=>{const L=C.filter(c=>c.stage===i&&!c.rejected);return`<div class="col" data-stage="${i}" style="background:var(--surface-2)"><div class="col-h">${esc(s)}<span style="display:flex;gap:6px;align-items:center;background:none;padding:0"><span class="pill p-green nodot" style="padding:1px 8px">${L.length}</span><button class="icon-btn" style="width:28px;height:28px" data-act="newCand" data-j="${j.id}" data-s="${i}" aria-label="Add to ${esc(s)}">${ic('plus',16,2)}</button></span></div>${L.map(c=>candCard(c,i,j)).join('')||'<div class="col-empty">Drop someone here</div>'}</div>`}).join('')}</div>
  ${C.some(c=>c.rejected)?`<div class="card" style="margin-top:16px"><div class="card-h" style="margin-bottom:8px"><h3>Rejected</h3><span class="muted">${C.filter(c=>c.rejected).length}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${C.filter(c=>c.rejected).map(c=>`<button class="tag" data-go="applicant/${c.id}/profile">${av(c.name,'','width:22px;height:22px;font-size:9px')}${esc(c.name)}</button>`).join('')}</div></div>`:''}`};

LIVE.jdQ=t=>{jdQ=t.value;const pos=t.selectionStart;rerender();const n=$('[data-live="jdQ"]');if(n){n.focus();n.setSelectionRange(pos,pos)}};

  if(c.stage===j.stages.length-1)notify(`${c.name} was hired`,j.title,`applicant/${c.id}/profile`,'brief');save();rerender();toast(c.stage===j.stages.length-1?`${c.name} hired 🎉`:`Moved to ${j.stages[c.stage]}`,s)}

  $$('.col').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const c=cand(dragId);if(c&&c.stage!==+col.dataset.stage)moveCand(c,+col.dataset.stage)})})};

    <div class="sec" style="display:flex;gap:10px;align-items:center;text-align:left"><span class="icon-sq">${ic('link',18,2)}</span><span style="flex:1;overflow-wrap:anywhere;font-size:13px" id="jobLink">careers.${esc(S.company.website||'company.com')}/jobs/${esc(nj.id||'')}</span><button class="btn btn-line btn-sm" data-act="copyLink">${ic('copy',14,2)}Copy</button></div>
    <div class="row-act" style="justify-content:center;margin-top:20px"><button class="btn btn-line" data-act="njAgain">Post another job</button><button class="btn btn-ink" data-act="njDone">View candidates ${ic('arrow',16,2)}</button></div></div>`}
  if(s===2)return phBack('New job','jobs',`<button data-go="jobs">Jobs</button>${ic('right',14,2)}<b>${esc(nj.title)}</b>`)+`<div class="card" style="max-width:760px">${stepper}<h3 style="margin:0 0 4px">Hiring workflow</h3><p class="muted" style="margin:0 0 18px">The stages candidates move through. Drag-free: use the arrows to reorder.</p>
    <div id="njStages">${nj.stages.map((st,i)=>`<div class="list-row"><span class="icon-sq">${i+1}</span><input class="inp grow" value="${esc(st)}" data-live="njStage" data-i="${i}" aria-label="Stage ${i+1} name"><div class="row-act"><button class="icon-btn" data-act="njMove" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Move up">${ic('up',16,2)}</button><button class="icon-btn" data-act="njMove" data-i="${i}" data-d="1" ${i===nj.stages.length-1?'disabled':''} aria-label="Move down">${ic('chev',16,2)}</button><button class="icon-btn" data-act="njDel" data-i="${i}" ${nj.stages.length<=2?'disabled':''} aria-label="Remove stage">${ic('trash',16,2)}</button></div></div>`).join('')}</div>
    <button class="btn btn-line btn-sm" style="margin-top:12px" data-act="njAdd">${ic('plus',14,2)}Add stage</button>
    <div class="modal-f"><button class="btn btn-line" data-act="njBack">${ic('left',16,2)}Back</button><button class="btn btn-line" data-act="njPublish" data-st="Draft">Save as draft</button><button class="btn btn-ink" data-act="njPublish" data-st="Open">Publish job</button></div></div>`;
  return phBack('New job','jobs',`<button data-go="jobs">Jobs</button>${ic('right',14,2)}<b>New job</b>`)+`<form class="card" style="max-width:760px" data-form="nj1" novalidate>${stepper}${jobFields(nj)}<div class="modal-f"><button type="button" class="btn btn-line" data-go="jobs">Cancel</button><button class="btn btn-ink">Continue ${ic('arrow',16,2)}</button></div></form>`};
F.nj1Pre=F.jobEditPre;
F.nj1=v=>{Object.assign(nj,v);nj.step=2;render(true);return'norender'};
LIVE.njStage=t=>{nj.stages[+t.dataset.i]=t.value};
A.njMove=el=>{const i=+el.dataset.i,d=+el.dataset.d;[nj.stages[i],nj.stages[i+d]]=[nj.stages[i+d],nj.stages[i]];rerender()};

  modal(mh('Add candidate','Add someone who applied outside the careers page.')+`<form data-form="cand" novalidate><div class="form-grid">${inp('name','','required data-err="Enter their full name"','Full name',{full:true,req:true})}${inp('email','','type="email" required data-err="Enter a valid email"','Email',{req:true})}${inp('phone','','type="tel"','Phone')}${sel('job',S.jobs.map(x=>[x.id,x.title]),j,'','Job')}${sel('source',S.sources,S.sources[0],'','Source')}${inp('location','','','Location')}${inp('exp','','type="number" min="0" max="50"','Years of experience')}<input type="hidden" name="stage" value="${st}"></div>

R.candidates=()=>ph('Candidates','Everyone who applied, across all jobs',`${btn('Bulk upload CVs','data-act="bulkCv"','btn-line','upload')}${btn('Add candidate','data-act="newCand"','btn-ink','plus')}`)+`<div class="card"><div class="filters"><div class="inp-ic">${ic('search',18,2)}<input class="inp" placeholder="Search candidates" value="${esc(cQ)}" data-live="cQ" aria-label="Search"></div>${sel('j',[['','All jobs'],...S.jobs.map(j=>[j.id,j.title])],cJob,'data-ch="cJob" aria-label="Job"')}${sel('s',[['','All stages'],...S.stages,'Rejected'],cStage,'data-ch="cStage" aria-label="Stage"')}${sel('src',[['','All sources'],...S.sources],cSrc,'data-ch="cSrc" aria-label="Source"')}</div><div id="cT">${candTable()}</div></div>`;

function candTable(){const q=cQ.toLowerCase();const L=S.cands.filter(c=>(!q||(c.name+c.email).toLowerCase().includes(q))&&(!cJob||c.job===cJob)&&(!cStage||stageName(c)===cStage)&&(!cSrc||c.source===cSrc)).sort((a,b)=>b.applied.localeCompare(a.applied));const per=10,pg=Math.min(ui.pages.cand||1,Math.max(1,Math.ceil(L.length/per)));ui.pages.cand=pg;
  return L.length?table(['Candidate','Job','Stage','Source','Applied','CV',''],L.slice((pg-1)*per,pg*per).map(c=>`<tr class="click" data-go="applicant/${c.id}/profile"><td>${who(c.name,c.email||'No email yet')}</td><td>${esc((job(c.job)||{}).title||'—')}</td><td>${pill(c.rejected?'Rejected':stageName(c)==='Hired'?'Hired':'In progress',stageName(c))}</td><td>${esc(c.source)}</td><td>${fmtD(c.applied)}</td><td>${c.cv?`<span class="file-row" style="gap:8px">${ftype(c.cv)}<span style="font-size:12.5px">${esc(c.cv)}</span></span>`:'—'}</td><td><span class="row-go">${ic('right',16,2)}</span></td></tr>`))+pager(L.length,pg,per,'cand'):emptyState('users','No candidates match','Try another search or clear the filters.')}

/* applicant */

const fill=(t,c)=>t.replace(/\{\{candidate_name\}\}/g,c.name.split(' ')[0]).replace(/\{\{job_title\}\}/g,(job(c.job)||{}).title||'').replace(/\{\{company\}\}/g,S.company.name).replace(/\{\{sender_name\}\}/g,ME().name);
R.applicant=(p)=>{const c=cand(p[0]);if(!c)return R.notfound();const j=job(c.job)||{title:'',stages:S.stages,id:''};const tab=p[1]||'profile';
  const tabs=tabsNav([['Profile',`applicant/${c.id}/profile`,'profile'],['Evaluation',`applicant/${c.id}/evaluation`,'evaluation'],['Email',`applicant/${c.id}/email`,'email'],['Activity',`applicant/${c.id}/activity`,'activity']],tab);
  let body='';
  if(tab==='profile')body=`<div class="sec">${secH('Candidate info',`data-act="editCand" data-id="${c.id}"`)}${kvs([['Full name',c.name],['Email',c.email],['Phone',c.phone],['Location',c.location],['Experience',c.exp?plural(c.exp,'year'):''],['Source',c.source],['Applied',fmtD(c.applied)],['Applied for',j.title]])}</div>
    <div class="sec"><div class="sec-h"><h3>CV</h3><label class="btn btn-line btn-sm" style="position:relative;overflow:hidden">${ic('upload',14,2)}${c.cv?'Replace':'Upload'}<input type="file" accept=".pdf,.doc,.docx" style="position:absolute;inset:0;opacity:0;cursor:pointer" data-live="candCv" data-id="${c.id}"></label></div>${c.cv?`<div class="file-row">${ftype(c.cv)}<b style="font-weight:600">${esc(c.cv)}</b></div>`:'<span class="muted">No CV yet.</span>'}</div>

    <div class="sec"><div class="sec-h"><h3>Notes</h3></div><form data-form="candNote" data-id="${c.id}">${ta('notes',c.notes,'rows="3" placeholder="Private notes about this candidate"')}<div class="modal-f" style="margin-top:10px"><button class="btn btn-line btn-sm">Save note</button></div></form></div>`;
  if(tab==='evaluation'){const r=c.rating;const vals=Object.values(r);const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—';

    ${CRIT.map(k=>`<div class="tog-row"><div><b>${k}</b><span class="s">${({Skills:'Can they do the work?',Communication:'Clear and thoughtful?',Culture:'Would they add to the team?',Experience:'Relevant background?'})[k]}</span></div><div class="field" style="align-items:flex-end">${stars(r[k]||0,'data-rate')}<input type="hidden" name="${k}" value="${r[k]||0}"></div></div>`).join('')}

  if(tab==='email')body=`<form data-form="sendMail" data-id="${c.id}" novalidate><div class="sec"><div class="sec-h"><h3>New email</h3>${sel('tpl',[['','Use a template…'],...S.emailTpl.map(t=>[t.id,t.name])],'','data-ch="pickTpl" style="width:auto;height:38px" aria-label="Template"')}</div><div class="form-grid" style="grid-template-columns:1fr">${inp('to',c.email,'type="email" required data-err="This candidate needs an email address"','To')}${inp('subject','','required data-err="Add a subject"','Subject')}${ta('body','','rows="7" required data-err="Write a message"','Message')}</div><div class="modal-f"><button class="btn btn-ink">${ic('send',16,2)}Send email</button></div></div></form>
    <div class="sec"><div class="sec-h"><h3>Sent emails</h3></div>${c.emails.length?c.emails.slice().reverse().map(m=>`<div class="list-row"><span class="icon-sq">${ic('mail',18,2)}</span><div class="grow"><b>${esc(m.subject)}</b><small>${ago(m.t)} · to ${esc(m.to)}</small></div></div>`).join(''):'<span class="muted">No emails yet.</span>'}</div>`;
  if(tab==='activity')body=`<div class="tl">${c.activity.slice().reverse().map(a=>`<div class="tl-i"><b>${esc(a.m)}</b><small>${new Date(a.t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')}</div>`;
  return phBack('Applicant',j.id?`job/${j.id}/pipeline`:'candidates',`<button data-go="jobs">Jobs</button>${ic('right',14,2)}${j.id?`<button data-go="job/${j.id}/pipeline">${esc(j.title)}</button>${ic('right',14,2)}`:''}<b>${esc(c.name)}</b>`)+
  `<div class="split"><div class="card profile-card">${av(c.name,'xl')}<h2 style="margin:0;font-size:19px">${esc(c.name)}</h2><div class="muted" style="margin:4px 0 12px">${esc(j.title)}</div>${pill(c.rejected?'Rejected':stageName(c)==='Hired'?'Hired':'In progress',stageName(c))}
  <div class="pc-list"><div class="r">${ic('mail',16,2)}${esc(c.email||'—')}</div><div class="r">${ic('phone',16,2)}${esc(c.phone||'—')}</div><div class="r">${ic('pin',16,2)}${esc(c.location||'—')}</div></div>

  <div class="card">${tabs}${body}</div></div>`};
