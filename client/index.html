<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manna HR</title>
<!-- Without this Chrome asks for /favicon.ico on every page load and logs the
     404 as a console error, which buries the errors somebody is actually
     looking for. The Manna M (14 October 2026): SVG for every browser that
     takes one, a PNG for the ones that do not, and the home-screen icons a
     phone asks for when the site is saved to it. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<!-- Not the conventional /apple-touch-icon.png: anything starting /app is
     forwarded to the ERPNext desk, by the dev proxy and by the Cloudflare
     Worker, and came back 404. -->
<link rel="apple-touch-icon" href="/manna-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F46A21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
