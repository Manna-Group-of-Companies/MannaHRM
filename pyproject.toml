[project]
name = "manna_hr"
authors = [{ name = "Manna Group of Companies", email = "it@mannarubber.com" }]
description = "Group-wide attendance and HR rules for the Manna companies"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

# `frappe` and `hrms` are supplied by the bench and are deliberately not named
# here — naming them makes pip try to resolve them from PyPI, where they are
# either absent or a different project entirely.
#
# The two below are real, ordinary PyPI packages this app's own code imports
# (manna_hr/onboard_sync.py, reading the Onboarding page's Google Sheet) and
# belong here for exactly the opposite reason: naming them is what makes
# `bench get-app` install them automatically on every bench this app goes
# onto, rather than leaving it to whoever notices ImportError first and runs
# `pip install` by hand — which on a locked-down machine may not even be
# possible (Application Control policies have refused it here before).
dependencies = ["google-api-python-client", "google-auth"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "manna_hr"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
# Frappe's own house style, so a file moved between this app and hrms does not
# reformat wholesale in the diff.
indent-style = "tab"
