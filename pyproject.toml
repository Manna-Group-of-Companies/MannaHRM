[project]
name = "manna_hr"
authors = [{ name = "Manna Group of Companies", email = "it@mannarubber.com" }]
description = "Group-wide attendance and HR rules for the Manna companies"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

# Deliberately empty. `frappe` and `hrms` are supplied by the bench, and naming
# them here makes pip try to resolve them from PyPI, where they are either
# absent or a different project entirely.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "manna_hr"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
# Frappe's own house style, so a file moved between this app and hrms does not
# reformat wholesale in the diff.
indent-style = "tab"
